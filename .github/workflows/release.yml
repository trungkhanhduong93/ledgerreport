name: Build and Release EXE

on:
  push:
    branches:
      - main
    # Việc 11 (29/09/2026): push CHỈ đổi tài liệu thì KHÔNG build — trước đây push một file .md cũng build lại EXE và
    # THAY asset của Release đang có bằng binary khác SHA ⇒ EXE vừa đối chiếu khớp trên máy lệch ngay.
    # (Chỉ bỏ qua khi MỌI file đổi đều khớp danh sách; lẫn một file code là vẫn build. Push tag không xét đường dẫn.)
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-cu/**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build EXE and Create GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7          # việc 11: bản chạy Node 24 (v4 chạy Node 20 — hết vòng đời)
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7      # việc 11 — v7 bỏ input pip-install, file này không dùng
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Extract App Version & Tag
        id: version
        shell: pwsh
        run: |
          $ver = "1.0.0"
          if (Test-Path "version.txt") {
            $ver = (Get-Content "version.txt" -Raw).Trim()
          }
          $tagName = "v$ver"
          Write-Host "Detected Version: $ver -> Tag: $tagName"
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Dich san giao dien (viec 24)
        # Dịch JSX của index.html MỘT LẦN ở đây ⇒ EXE mở không phải chờ Babel dịch 7–13 giây. Node có sẵn trên runner
        # windows-latest; Babel lấy từ thu-vien/ nên không cần npm install. Dịch hỏng ⇒ dừng, không phát hành.
        shell: pwsh
        run: |
          node --version
          node dich_giao_dien.js
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build Executable with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconsole --onefile --clean --noconfirm `
            --name iPOS_Accounting_Report `
            --icon icon.ico `
            --version-file version_info.txt `
            --collect-submodules pyodbc `
            --add-data "web_dich_san/index.html;." `
            --add-data "thu-vien/tailwind-3.4.17.js;thu-vien" `
            --add-data "thu-vien/react-18.3.1.production.min.js;thu-vien" `
            --add-data "thu-vien/react-dom-18.3.1.production.min.js;thu-vien" `
            --add-data "thu-vien/xlsx-0.18.5.full.min.js;thu-vien" `
            --add-data "install_driver.ps1;." `
            --add-data "manifest.json;." `
            --add-data "icon.svg;." `
            --add-data "version.txt;." `
            server.py

      - name: Create ZIP Package
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/iPOS_Accounting_Report.exe" -DestinationPath "dist/iPOS_Accounting_Report.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3   # việc 11 — chỉ đổi runtime Node 20 → 24, giữ nguyên input
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: iPOS Accounting Report ${{ env.RELEASE_TAG }}
          body: |
            ### 🚀 Tính Năng Mới & Nâng Cấp (${{ env.RELEASE_TAG }})

            - ⚡ **Tự động cập nhật (Auto-Update In-Place):** Khi mở app, ứng dụng tự động kiểm tra phiên bản mới từ GitHub, tự tải về và ghi đè an toàn vào chính file `.exe` hiện tại trên máy.
            - 📦 **Bổ sung bản nén ZIP:** Tải về mở dùng ngay mà không bị trình duyệt Chrome/Edge cảnh báo tệp lạ.
            - 🔄 **Khởi động lại siêu tốc:** Sau khi cập nhật xong, app tự mở lại phiên bản mới nhất và tự động dọn dẹp sạch các tệp rác.
            - 🛠️ **Tối ưu hóa & Vá lỗi:** Tách rời tiến trình độc lập chống lỗi tắt app, đồng bộ hiển thị số phiên bản realtime trên toàn bộ giao diện.

            ---

            **📦 Tệp đính kèm:**
            - `iPOS_Accounting_Report.zip`: Bản nén ZIP tải về mở dùng ngay (Khuyên dùng - Không bị trình duyệt chặn).
            - `iPOS_Accounting_Report.exe`: Tệp thực thi độc lập cho Windows (Dành cho tính năng tự cập nhật).
            
            **⚙️ Yêu cầu:** Windows 10/11 (64-bit), `ODBC Driver 17 for SQL Server`.
          files: |
            dist/iPOS_Accounting_Report.zip
            dist/iPOS_Accounting_Report.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
