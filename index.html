                                                    <SortableHeader field="CHENH_SL"      sort={btpSort} onSort={f => setBtpSort(s => cycleSort(s, f))} className="border-r w-24 px-2 bg-emerald-50/40" align="right">Chênh SL</SortableHeader>
                                                    <SortableHeader field="TRANG_THAI"    sort={btpSort} onSort={f => setBtpSort(s => cycleSort(s, f))} className="border-r w-44 px-2" align="left">Trạng thái</SortableHeader>
                                                    <SortableHeader field="GHI_CHU"       sort={btpSort} onSort={f => setBtpSort(s => cycleSort(s, f))} className="w-96 px-3" align="left">Ghi chú</SortableHeader>
                                                </tr>
                                                <tr className="bg-indigo-50/60 border-b-2 border-indigo-200">
                                                    {['','DON_VI','','SO_PHIEU_XUAT','KHO_XUAT','BTP','TEN_BTP','','','NVL','TEN_NVL','','','','SO_PHIEU_NHAP','','','','','',''].map((key, idx) => (
                                                        <th key={idx} className="border-r px-1 py-1">
                                                            {key ? <input
                                                                type="text"
                                                                value={btpColSearch[key] || ''}
                                                                onChange={e => setBtpColSearch(p => ({...p, [key]: e.target.value}))}
                                                                className="w-full bg-white border border-slate-200 rounded-md px-1.5 py-1 text-[10px] font-semibold text-slate-700 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200 focus:bg-indigo-50/30 transition-all placeholder:text-slate-300 placeholder:text-center"
                                                            /> : null}
                                                        </th>
                                                    ))}
                                                </tr>
                                            </thead>
                                            <tbody className="text-[11px] font-medium text-slate-700">
                                                {btpVS.topPadding > 0 && <tr><td colSpan={100} style={{ height: btpVS.topPadding, padding: 0, border: 0 }}></td></tr>}
                                                {btpFlatData.slice(btpVS.startIndex, btpVS.endIndex + 1).map((row, i) => {
                                                    const bad  = row.TRANG_THAI === 'Chưa nhập kho BTP';
                                                    const warn = row.TRANG_THAI === 'Lệch số lượng';
                                                    const nogoc = row.TRANG_THAI === 'Không tìm thấy phiếu xuất liên quan';
                                                    const rowBg = bad ? 'bg-rose-50/70' : warn ? 'bg-amber-50/70'
                                                                : nogoc ? 'bg-violet-50/70' : (row._grp ? 'bg-slate-50/60' : '');
                                                    const num = (v, d = 2) => v == null ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: d });
                                                    const topLine = row._first ? 'border-t-2 border-t-indigo-300' : '';
                                                    return (
                                                        <tr key={btpVS.startIndex + i} className={`border-b hover:bg-indigo-50/40 text-center ${rowBg} ${topLine}`}>
                                                            <td className="border-r text-slate-300 font-mono">{btpVS.startIndex + i + 1}</td>
                                                            <td className="border-r font-black text-slate-600">{row._first ? row.DON_VI : ''}</td>
                                                            <td className="border-r">{row._first ? (row.NGAY_XUAT || '—') : ''}</td>
                                                            <td className="border-r font-mono font-bold text-indigo-700">{row._first ? (row.SO_PHIEU_XUAT || '—') : ''}</td>
                                                            <td className="border-r">{row._first ? (row.KHO_XUAT || '—') : ''}</td>
                                                            <td className="border-r font-mono">{row.BTP}</td>
                                                            <td className="border-r px-3 text-left">{row.TEN_BTP}</td>
                                                            <td className="border-r px-2 text-right font-mono">{num(row.SL_SX)}</td>
                                                            <td className="border-r text-slate-400">{row.DVT_BTP}</td>
                                                            <td className="border-r font-mono">{row.NVL || '—'}</td>
                                                            <td className="border-r px-3 text-left">{row.TEN_NVL || '—'}</td>
                                                            <td className="border-r text-slate-400">{row.DVT_NVL}</td>
                                                            <td className="border-r px-2 text-right font-mono">{num(row.SL_NVL_XUAT)}</td>
                                                            <td className="border-r px-2 text-right font-mono">{num(row.TIEN_NVL, 0)}</td>
                                                            <td className="border-r font-mono text-emerald-700">{row.SO_PHIEU_NHAP || '—'}</td>
                                                            <td className="border-r">{row.NGAY_NHAP || '—'}</td>
                                                            <td className="border-r">{row.KHO_NHAP || '—'}</td>
                                                            <td className="border-r px-2 text-right font-mono">{num(row.SL_NHAP)}</td>
                                                            <td className={`border-r px-2 text-right font-mono ${row.CHENH_SL != null && Number(row.CHENH_SL) !== 0 ? 'font-black text-rose-600' : 'text-slate-300'}`}>{num(row.CHENH_SL)}</td>
                                                            <td className={`px-2 text-left font-black ${bad ? 'text-rose-600' : warn ? 'text-amber-600' : nogoc ? 'text-violet-600' : 'text-emerald-600'}`}>{row.TRANG_THAI}</td>
                                                            <td className="px-3 text-left text-slate-500">{row.GHI_CHU || ''}</td>
                                                        </tr>
                                                    );
                                                })}
                                                {btpVS.bottomPadding > 0 && <tr><td colSpan={100} style={{ height: btpVS.bottomPadding, padding: 0, border: 0 }}></td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="p-4 bg-white border-t flex justify-between items-center px-10 shrink-0 z-40 shadow-inner">
                                        <div className="flex items-center gap-8">
                                            <div className="text-[10px] font-black text-slate-300 uppercase tracking-widest italic underline">iPOS Accounting Report</div>
                                        </div>
                                        <div className="flex items-center gap-6">
                                            <div className="flex items-center gap-2">
                                                <PageJumper page={btpPagination.page} totalPages={btpPagination.total_pages} onGoto={p => loadBtpData(p)} />
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end">
                                            <span className="text-[9px] font-black text-slate-300 uppercase tracking-tighter">XKHOSXBTP → NSP</span>
                                            <span className="text-[11px] font-black text-indigo-400 uppercase tracking-widest">
                                                Trang {btpPagination.page} / {btpPagination.total_pages}
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </>
                    )}

                    {activeTab === 'report' && (
                        <div className="flex-1 flex flex-col relative overflow-hidden">
                            {loading && <div className="absolute inset-0 bg-white/60 z-50 flex flex-col items-center justify-center backdrop-blur-[4px] transition-all"><div className="bg-white p-8 rounded-[40px] shadow-[0_30px_100px_rgba(0,0,0,0.2)] flex flex-col items-center gap-6 border border-indigo-50 scale-110"><div className="relative"><div className="w-16 h-16 border-4 border-indigo-100 rounded-full"></div><div className="w-16 h-16 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin absolute top-0 left-0"></div><Icon name="file-text" size={24} className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-indigo-600"/></div><div className="flex flex-col items-center gap-1"><div className="text-[12px] font-black text-indigo-900 uppercase tracking-widest">Đang kết xuất báo cáo</div><div className="text-[9px] font-bold text-slate-400 uppercase tracking-tighter italic">Vui lòng chờ trong giây lát...</div></div></div></div>}
                            <ReportTab
                                filters={filters}
                                setFilters={setFilters}
                                period={period}
                                setPeriod={setPeriod}
                                meta={meta}
                                onToggleFilter={toggleFilter}
                                activeDropdown={activeDropdown}
                                setActiveDropdown={setActiveDropdown}
                                reportData={reportData}
                                loadReportData={loadReportData}
                                loading={loading}
                                monthList={monthList}
                                monthlyData={monthlyData}
                                jobList={jobList}
                                jobData={jobData}
                                reportType={reportType}
                                setReportType={setReportType}
                                setPendingReportType={setPendingReportType}
                                setShowClearModal={setShowClearModal}
                                trialBalanceData={trialBalanceData}
                                trialBalanceTotal={trialBalanceTotal}
                                cashBookData={cashBookData}
                                vatSalesTotals={vatSalesTotals}
                                journalViewMode={journalViewMode}
                                setJournalViewMode={setJournalViewMode}
                                vatSalesMode={vatSalesMode}
                                setVatSalesMode={setVatSalesMode}
                                saleSourceTotals={saleSourceTotals}
                                saleSourceMode={saleSourceMode}
                                setSaleSourceMode={setSaleSourceMode}
                                nxtData={nxtData}
                                nxtGroupBy={nxtGroupBy}
                                setNxtGroupBy={setNxtGroupBy}
                                onExportSuccess={(path, filename) => setExportNoticeModal({ path, filename })}
                            />
                        </div>
                    )}
                    {/* MODAL: Xác nhận xuất CSV cho dataset lớn */}
                    {exportConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[9999] px-4 animate-backdrop">
                            <div className="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl border border-slate-100 animate-modal">
                                <div className="flex items-start gap-4 mb-5">
                                    <div className="w-12 h-12 rounded-2xl bg-amber-50 border border-amber-200 flex items-center justify-center shrink-0">
                                        <Icon name="file-spreadsheet" size={22} className="text-amber-600"/>
                                    </div>
                                    <div className="flex-1">
                                        <h2 className="text-[16px] font-black text-slate-900 tracking-tight">Xuất dữ liệu lớn</h2>
                                        <p className="text-[11px] font-bold text-slate-400 mt-0.5">Tập dữ liệu vượt ngưỡng xử lý browser</p>
                                    </div>
                                </div>
                                <div className="bg-slate-50 rounded-2xl px-4 py-3 mb-5 border border-slate-100">
                                    <div className="flex items-center justify-between mb-1.5">
                                        <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Số dòng</span>
                                        <span className="text-[15px] font-black text-indigo-600 tabular-nums">{exportConfirm.total.toLocaleString()}</span>
                                    </div>
                                </div>
                                <div className="text-[12px] text-slate-600 leading-relaxed mb-6">
                                    File sẽ được tạo trên máy server bằng Background Job (không gây đơ trình duyệt), lưu vào folder <code className="px-1.5 py-0.5 bg-slate-100 rounded text-[11px] font-mono text-slate-800">Downloads\iPOS_Accounting_Report\</code>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setExportConfirm(null)}
                                            className="px-4 py-3 rounded-2xl border border-slate-200 text-slate-500 font-black text-[10px] hover:bg-slate-50 transition-all uppercase tracking-widest">
                                        Hủy
                                    </button>
                                    <button onClick={() => startServerExport(exportConfirm.kind, exportConfirm.total, 'csv')}
                                            className="flex-1 px-3 py-3 rounded-2xl bg-emerald-600 text-white font-black text-[10px] hover:bg-emerald-700 shadow-xl shadow-emerald-200 transition-all uppercase tracking-widest flex flex-col items-center justify-center">
                                        Xuất CSV
                                        <span className="text-[9px] opacity-80 mt-0.5 font-medium normal-case">Tốc độ siêu nhanh</span>
                                    </button>
                                    <button onClick={() => startServerExport(exportConfirm.kind, exportConfirm.total, 'xlsx')}
                                            className="flex-1 px-3 py-3 rounded-2xl bg-indigo-600 text-white font-black text-[10px] hover:bg-indigo-700 shadow-xl shadow-indigo-200 transition-all uppercase tracking-widest flex flex-col items-center justify-center">
                                        Xuất Excel (.xlsx)
                                        <span className="text-[9px] opacity-80 mt-0.5 font-medium normal-case">Mở ngay chuẩn đẹp</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: Tải xong → Mở file / Mở folder */}
                    {exportDone && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[9999] px-4 animate-backdrop">
                            <div className="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl border border-slate-100 animate-modal">
                                <div className="flex items-start gap-4 mb-5">
                                    <div className="w-12 h-12 rounded-2xl bg-emerald-50 border border-emerald-200 flex items-center justify-center shrink-0">
                                        <Icon name="check" size={22} className="text-emerald-600"/>
                                    </div>
                                    <div className="flex-1">
                                        <h2 className="text-[16px] font-black text-slate-900 tracking-tight">Đã xuất xong</h2>
                                        <p className="text-[11px] font-bold text-slate-400 mt-0.5">
                                            {(exportDone.total || 0).toLocaleString()} dòng · {exportDone.filename}
                                        </p>
                                    </div>
                                </div>
                                <div className="space-y-1.5 mb-5">
                                    <div className="flex justify-between items-center text-xs font-black">
                                        <span className="text-slate-500 uppercase tracking-widest text-[10px]">Tiến trình</span>
                                        <span className="text-emerald-600 text-sm tabular-nums font-mono">100%</span>
                                    </div>
                                    <div className="w-full h-3 bg-emerald-100 rounded-full overflow-hidden p-0.5 border border-emerald-100">
                                        <div className="h-full bg-emerald-600 rounded-full w-full"></div>
                                    </div>
                                </div>
                                <div className="bg-slate-50 rounded-2xl px-4 py-3 mb-5 border border-slate-100">
                                    <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-1.5">Đường dẫn</div>
                                    <div className="text-[11px] font-mono text-slate-700 break-all leading-relaxed">{exportDone.file_path}</div>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setExportDone(null)}
                                            className="px-5 py-3 rounded-2xl border border-slate-200 text-slate-600 font-black text-[11px] hover:bg-slate-50 transition-all uppercase tracking-widest">
                                        Đóng
                                    </button>
                                    <button onClick={() => openExportedFolder(exportDone.file_path)}
                                            className="flex-1 px-5 py-3 rounded-2xl border-2 border-indigo-200 text-indigo-700 bg-indigo-50 font-black text-[11px] hover:bg-indigo-100 transition-all uppercase tracking-widest flex items-center justify-center gap-2">
                                        <Icon name="file-text" size={12}/> Mở folder
                                    </button>
                                    <button onClick={() => openExportedFile(exportDone.file_path)}
                                            className="flex-1 px-5 py-3 rounded-2xl bg-emerald-600 text-white font-black text-[11px] hover:bg-emerald-700 shadow-xl shadow-emerald-200 transition-all uppercase tracking-widest flex items-center justify-center gap-2">
                                        <Icon name="file-spreadsheet" size={12}/> Mở file
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {exporting && exportProgress && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[9999] px-4">
                            <div className="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-slate-100">
                                <div className="flex items-center gap-4 mb-6">
                                    <div className="relative shrink-0">
                                        <div className="w-12 h-12 border-4 border-emerald-100 rounded-full"></div>
                                        <div className="w-12 h-12 border-4 border-emerald-600 rounded-full border-t-transparent animate-spin absolute top-0 left-0"></div>
                                    </div>
                                    <div>
                                        <div className="text-[15px] font-black text-slate-900 uppercase tracking-tight">Đang xuất Excel</div>
                                        <div className="text-[11px] font-bold text-slate-400 mt-0.5">
                                            {exportProgress.phase === 'fetch'  && 'Đang tải dữ liệu từ server...'}
                                            {exportProgress.phase === 'build'  && `Đang dựng file: ${exportProgress.current.toLocaleString()} / ${exportProgress.total.toLocaleString()} dòng`}
                                            {exportProgress.phase === 'write'  && 'Đang ghi file xlsx...'}
                                            {exportProgress.phase === 'stream' && `Đang stream ${exportProgress.total.toLocaleString()} dòng → browser tải file CSV trực tiếp`}
                                        </div>
                                    </div>
                                </div>
                                {exportProgress.total > 0 && (
                                    <div className="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
                                        <div className="h-full bg-gradient-to-r from-emerald-500 to-emerald-600 transition-all"
                                             style={{ width: `${Math.min(100, Math.round((exportProgress.current / Math.max(1, exportProgress.total)) * 100))}%` }}></div>
                                    </div>
                                )}
                                <div className="text-[10px] font-bold text-slate-400 mt-3 text-center">
                                    Vui lòng không tắt cửa sổ. Dữ liệu lớn có thể mất vài phút.
                                </div>
                            </div>
                        </div>
                    )}
                    {showClearModal && (
                        <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[9999] animate-backdrop px-4">
                            <div className="bg-white/90 backdrop-blur-xl rounded-[32px] p-10 max-w-md w-full shadow-[0_32px_100px_rgba(0,0,0,0.3)] border border-white animate-modal">
                                <h2 className="text-2xl font-black text-slate-900 mb-2 tracking-tight">Chuyển mẫu báo cáo?</h2>
                                <p className="text-slate-500 font-medium mb-8 text-[13px] leading-relaxed">Nội dung báo cáo hiện tại sẽ bị xóa. Bạn cần phải tải lại báo cáo nếu muốn quay lại mẫu cũ.</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowClearModal(false)} className="flex-1 px-6 py-3.5 rounded-2xl border border-slate-200 text-slate-600 font-black text-[11px] hover:bg-slate-50 transition-all uppercase tracking-widest">Hủy</button>
                                    <button onClick={() => { setReportType(pendingReportType); setReportData({}); setMonthList([]); setMonthlyData({}); setJobList([]); setJobData({}); setNxtData(null); setShowClearModal(false); }} className="flex-1 px-6 py-3.5 rounded-2xl bg-indigo-600 text-white font-black text-[11px] hover:bg-indigo-700 shadow-xl shadow-indigo-200 transition-all uppercase tracking-widest">Xác nhận</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <AutoUpdateModal
                        isUpdating={autoUpdate.isUpdating}
                        progress={autoUpdate.progress}
                        onClose={() => autoUpdate.setIsUpdating(false)}
                    />
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
