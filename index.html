            // Xuất báo cáo ra XLS giống HỆT giao diện web: dựng file Excel dạng HTML (mso), nội tuyến toàn bộ
            // computed-style (font, màu chữ/nền, viền, canh lề, padding, merge colspan/rowspan). Kèm cả khối
            // tiêu đề (công ty, mẫu, tên báo cáo, kỳ) canh theo đúng cột. Ô số cột giá trị lưu SỐ THẬT
            // (bấm vào = 1000000) nhưng hiển thị #,##0. Tự tách sheet nếu vượt 60.000 dòng.
            const exportReportXls = () => {
                const table = document.querySelector(".report-table");
                if (!table) return;
                const SHEET_LIMIT = 1000000;

                // ── Nội tuyến computed-style từ DOM gốc vào clone ──
                const clone = table.cloneNode(true);
                clone.querySelectorAll('colgroup').forEach(cg => cg.remove());
                const origRows = table.querySelectorAll('tr');
                const cloneRows = clone.querySelectorAll('tr');
                const toRemove = [];
                for (let ri = 0; ri < origRows.length && ri < cloneRows.length; ri++) {
                    const oTr = origRows[ri];
                    const cTr = cloneRows[ri];
                    const trCs = getComputedStyle(oTr);
                    if (trCs.display === 'none') { toRemove.push(cTr); continue; }
                    const oCells = oTr.querySelectorAll('th,td');
                    const cCells = cTr.querySelectorAll('th,td');
                    for (let ci = 0; ci < oCells.length && ci < cCells.length; ci++) {
                        const oc = oCells[ci]; const cc = cCells[ci];
                        const cs = getComputedStyle(oc);
                        const isHdr = oc.tagName === 'TH';
                        let st = 'border:1px solid #000;';
                        st += 'font-weight:' + cs.fontWeight + ';text-align:' + cs.textAlign + ';';
                        st += 'vertical-align:' + cs.verticalAlign + ';color:' + cs.color + ';';
                        st += 'font-size:' + cs.fontSize + ';';
                        st += 'padding:' + cs.paddingTop + ' ' + cs.paddingRight + ' ' + cs.paddingBottom + ' ' + cs.paddingLeft + ';';
                        if (cs.width && cs.width !== 'auto') st += 'width:' + cs.width + ';';
                        if (cs.height && cs.height !== 'auto') st += 'height:' + cs.height + ';';
                        const bg = cs.backgroundColor;
                        if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') st += 'background-color:' + bg + ';';
                        if (cs.fontStyle !== 'normal') st += 'font-style:' + cs.fontStyle + ';';
                        cc.setAttribute('style', st);
                        if (!isHdr) {
                            // Ô hiển thị số âm theo kiểu kế toán "(1,000,000)" → đưa về dấu trừ cho Excel.
                            let txt = (cc.textContent || '').trim();
                            let isNeg = false;
                            if (txt.startsWith('(') && txt.endsWith(')')) {
                                isNeg = true;
                                txt = txt.slice(1, -1).trim();
                            }
                            // ── Ô PHẦN TRĂM ("15.54%") ─────────────────────────────────────────────
                            // Excel phải giữ value THẬT là phân số (0.1554) rồi tự hiển thị 15.54%,
                            // nếu để nguyên chuỗi "15.54%" thì ô thành text, không tính toán được.
                            // Giữ đúng số chữ số thập phân đang hiển thị trên web (xpct0..xpct4).
                            // Dịch dấu thập phân bằng toFixed thay vì chia 100 trần — 15.54/100 trong
                            // JS ra 0.15539999999999998, ghi vào Excel là lệch.
                            // ⚠️ BẪY (19/08/2026): mso-number-format PHẢI nằm trong INLINE STYLE của ô.
                            // Excel khi nhập HTML chỉ đọc CLASS ĐẦU TIÊN trong danh sách class. Ô ở đây
                            // luôn là class="col-value xnum" → Excel lấy 'col-value' (không có định dạng)
                            // rồi bỏ qua 'xnum' → mọi ô về General: cột tiền hiện 103293720 thay vì
                            // 103,293,720, cột % hiện 0.0029 thay vì 0.29%.
                            // Đã dựng lại đúng ca này trong Excel thật: class="xnum" một mình thì CHẠY,
                            // class="col-value xnum" thì HỎNG — nên đừng test bằng ô chỉ có một class.
                            // Vẫn giữ class .xnum/.xpct trong <style> cho tương thích ngược, nhưng thứ
                            // thực sự có tác dụng là inline dưới đây.
                            const fmt = (f) => cc.setAttribute('style', st + 'mso-number-format:' + f + ';');
                            if (/^[\d,]+(\.\d+)?\s*%$/.test(txt)) {
                                const numTxt = txt.slice(0, -1).trim().replace(/,/g, '');
                                const dec = Math.min((numTxt.split('.')[1] || '').length, 4);
                                cc.classList.add('xpct' + dec);
                                cc.textContent = (isNeg ? '-' : '') + (parseFloat(numTxt) / 100).toFixed(dec + 2);
                                fmt(dec > 0 ? ('0\\.' + '0'.repeat(dec) + '\\%') : '0\\%');
                            }
                            // ── Ô TIỀN ─────────────────────────────────────────────────────────────
                            // Bỏ dấu phẩy ngăn nghìn để value là 1000000, format #,##0 lo phần hiển thị.
                            else if (oc.classList.contains('col-value') || oc.classList.contains('col-rate')
                                     || oc.classList.contains('text-right')) {
                                cc.classList.add('xnum');
                                if (txt && /^[\d,]+(\.\d+)?$/.test(txt)) {
                                    cc.textContent = (isNeg ? '-' : '') + txt.replace(/,/g, '');
                                    fmt('\\#\\,\\#\\#0');
                                }
                            }
                            // Mã TK / số chứng từ: ép text để Excel không ăn mất số 0 đứng đầu.
                            else if (oc.classList.contains('col-code') || oc.classList.contains('text-center')) {
                                cc.classList.add('xtext');
                                fmt('\\@');
                            }
                        }
                    }
                }
                toRemove.forEach(tr => tr.remove());

                const theadEl = clone.querySelector('thead');
                const theadHTML = theadEl ? theadEl.outerHTML : '';
                const bodyTrs = Array.from(clone.querySelectorAll('tbody tr'));
                const totalTr = clone.querySelectorAll('tr').length;

                // Tính số cột max để set colspan cho header & footer
                const headerTr = table.querySelector('thead tr') || table.querySelector('tbody tr');
                let maxCols = 0;
                if (headerTr) {
                    headerTr.querySelectorAll('th, td').forEach(cell => {
                        maxCols += parseInt(cell.getAttribute('colspan') || '1', 10);
                    });
                }
                if (maxCols <= 0) maxCols = 8;

                const companyName = (meta.company && meta.company.name)
                    || (meta.orgs && meta.orgs.find(o => o.id === '00')?.name)
                    || "CÔNG TY TNHH DUONG THANH LONG";
                let unitName = "Tất cả đơn vị";
                let unitAddress = "";
                if (filters.org_ids && filters.org_ids.length > 0) {
                    const org = (meta && meta.orgs) ? meta.orgs.find(o => o.id === filters.org_ids[0]) : null;
                    unitName = org ? org.name : 'Đơn vị: ' + filters.org_ids[0];
                    unitAddress = org ? org.address : '';
                } else {
                    unitAddress = (meta.company && meta.company.address)
                        || (meta.orgs && meta.orgs.find(o => o.id === '00')?.address)
                        || "";
                    const taxCode = (meta.company && meta.company.tax_code) || "";
                    if (taxCode && unitAddress) {
                        unitAddress += " — MST: " + taxCode;
                    }
                }

                const REPORT_PATTERNS = {
                    BC005: 'Mẫu B01 - DN', BC006: 'Mẫu B09 - DN',
                    BC007: 'Mẫu S03a - DN', BC008: 'Mẫu S38 - DN',
                    BC009: 'Mẫu B03 - DN', BC010: 'Mẫu B03 - DN', BC011: 'Mẫu B03 - DN',
                    BC012: 'Mẫu S07 - DN', BC013: 'Mẫu S05 - DN', BC014: 'Mẫu 01-1/GTGT',
                    BC015: '', BC016: ''
                };
                const reportPattern = REPORT_PATTERNS[reportType] !== undefined ? REPORT_PATTERNS[reportType] : 'Mẫu B02 - DN';

                let reportTitle = "";
                if (reportType === 'BC006') reportTitle = 'BẢNG CÂN ĐỐI PHÁT SINH';
                else if (reportType === 'BC005') reportTitle = 'BẢNG CÂN ĐỐI KẾ TOÁN';
                else if (['BC009', 'BC010', 'BC011'].includes(reportType)) {
                    reportTitle = `BÁO CÁO LƯU CHUYỂN TIỀN TỆ (${reportType === 'BC009' ? 'Trực tiếp' : reportType === 'BC011' ? 'Gián tiếp - Chú Long' : 'Gián tiếp'})`;
                }
                else if (reportType === 'BC007') reportTitle = 'SỔ NHẬT KÝ CHUNG';
                else if (reportType === 'BC008') reportTitle = 'SỔ CHI TIẾT TÀI KHOẢN';
                else if (reportType === 'BC012') reportTitle = 'SỔ TIỀN MẶT VÀ TIỀN NGÂN HÀNG';
                else if (reportType === 'BC013') reportTitle = 'BẢNG TỔNG HỢP PHÁT SINH CÔNG NỢ';
                else if (reportType === 'BC014') reportTitle = '6.2 - BẢNG KÊ HÓA ĐƠN, CHỨNG TỪ HÀNG HÓA, DỊCH VỤ BÁN RA';
                else if (reportType === 'BC015') reportTitle = 'BÁO CÁO BÁN HÀNG THEO NGUỒN ĐƠN';
                else if (reportType === 'BC016') reportTitle = 'BÁO CÁO NHẬP XUẤT TỒN NHÀ HÀNG';
                else if (['BC002', 'BC004'].includes(reportType)) reportTitle = 'BÁO CÁO KẾT QUẢ KINH DOANH THEO CÔNG VIỆC';
                else reportTitle = 'BÁO CÁO KẾT QUẢ KINH DOANH THEO THÁNG';

                let periodText = "";
                if (period.type === 'month') periodText = `Tháng ${period.value} Năm ${period.year}`;
                else if (period.type === 'quarter') periodText = `Quý ${period.value} Năm ${period.year}`;
                else if (period.type === 'year') periodText = `Năm ${period.year}`;
                else periodText = `Từ ngày ${filters.from_date} Đến ngày ${filters.to_date}`;

                let subInfoHtml = "";
                if (reportType === 'BC012' || reportType === 'BC013' || reportType === 'BC014') {
                    const accText = filters.acc_ids && filters.acc_ids.length > 0 ? filters.acc_ids.map(id => {
                        const a = meta.accounts.find(x => x.id === id);
                        return a ? `${id} - ${a.name}` : id;
                    }).join(', ') : (reportType === 'BC012' ? '111, 112, 113' : (reportType === 'BC014' ? '33311' : '—'));
                    subInfoHtml += `<tr><td colspan="${maxCols}" style="text-align:center; font-weight:bold; font-size:10px; color:#475569; border:none;">Tài khoản: ${accText}</td></tr>`;
                }
                if (reportType === 'BC013') {
                    const prText = filters.pr_detail_ids && filters.pr_detail_ids.length > 0 ? filters.pr_detail_ids.map(id => {
                        const p = meta.pr_details.find(x => x.id === id);
                        return p ? `${id} - ${p.name}` : id;
                    }).join(', ') : 'Tất cả';
                    subInfoHtml += `<tr><td colspan="${maxCols}" style="text-align:center; font-weight:bold; font-size:10px; color:#475569; border:none;">Đối tượng: ${prText}</td></tr>`;
                }
                if (['BC002', 'BC004'].includes(reportType) && filters.job_ids && filters.job_ids.length > 0) {
                    const jobText = filters.job_ids.map(id => {
                        const j = meta.jobs ? meta.jobs.find(x => x.id === id) : null;
                        return j ? `${id} - ${j.name}` : id;
                    }).join(', ');
                    subInfoHtml += `<tr><td colspan="${maxCols}" style="text-align:center; font-weight:bold; font-size:10px; color:#475569; border:none;">Công việc: ${jobText}</td></tr>`;
                }
                if (reportType === 'BC015') {
                    subInfoHtml += `<tr><td colspan="${maxCols}" style="text-align:center; font-weight:bold; font-size:10px; color:#475569; border:none;">Nguồn đơn: Tất cả</td></tr>`;
                }
                const orgText = filters.org_ids && filters.org_ids.length > 0 ? filters.org_ids.map(id => {
                    const org = meta.orgs.find(o => o.id === id);
                    return org ? `${id} - ${org.name}` : id;
                }).join(', ') : 'Tất cả';
                subInfoHtml += `<tr><td colspan="${maxCols}" style="text-align:center; font-weight:bold; font-size:10px; color:#475569; border:none;">Đơn vị: ${orgText}</td></tr>`;

                const headerHtml = `
                    <tr>
                        <td colspan="${maxCols - 2}" style="font-weight:bold; font-size:11px; text-align:left; border:none;">${companyName}</td>
                        <td colspan="2" style="font-weight:bold; font-size:10px; text-align:right; font-style:italic; text-decoration:underline; border:none;">${reportPattern}</td>
                    </tr>
                    <tr>
                        <td colspan="${maxCols}" style="font-weight:bold; font-size:9px; color:#475569; text-align:left; border:none;">${unitName}</td>
                    </tr>
                    ${unitAddress ? `<tr><td colspan="${maxCols}" style="font-style:italic; font-size:9px; color:#64748b; text-align:left; border:none;">${unitAddress}</td></tr>` : ''}
                    <tr><td colspan="${maxCols}" style="border:none;"></td></tr>
                    <tr>
                        <td colspan="${maxCols}" style="font-weight:bold; font-size:15px; text-align:center; text-transform:uppercase; border:none;">${reportTitle}</td>
                    </tr>
                    ${subInfoHtml}
                    <tr>
                        <td colspan="${maxCols}" style="font-weight:bold; font-size:11px; color:#1e3a8a; text-align:center; text-transform:uppercase; border:none;">${periodText}</td>
                    </tr>
                    <tr><td colspan="${maxCols}" style="border:none;"></td></tr>
                `;

                const now = new Date();
                const dateStr = `TP. HCM, Ngày ${now.getDate()} Tháng ${now.getMonth() + 1} Năm ${now.getFullYear()}`;

                const colsPerSig = Math.floor(maxCols / 3);
                const remCols = maxCols - (colsPerSig * 2);

                const footerHtml = `
                    <tr><td colspan="${maxCols}" style="border:none;"></td></tr>
                    <tr>
                        <td colspan="${maxCols - remCols}" style="border:none;"></td>
                        <td colspan="${remCols}" style="text-align:center; font-style:italic; font-size:10px; color:#64748b; border:none;">${dateStr}</td>
                    </tr>
                    <tr>
                        <td colspan="${colsPerSig}" style="text-align:center; font-weight:bold; font-size:11px; border:none;">NGƯỜI LẬP BIỂU</td>
                        <td colspan="${colsPerSig}" style="text-align:center; font-weight:bold; font-size:11px; border:none;">KẾ TOÁN TRƯỞNG</td>
                        <td colspan="${remCols}" style="text-align:center; font-weight:bold; font-size:11px; border:none;">GIÁM ĐỐC</td>
                    </tr>
                    <tr>
                        <td colspan="${colsPerSig}" style="text-align:center; font-style:italic; font-size:9px; color:#94a3b8; border:none;">(Ký, họ tên)</td>
                        <td colspan="${colsPerSig}" style="text-align:center; font-style:italic; font-size:9px; color:#94a3b8; border:none;">(Ký, họ tên)</td>
                        <td colspan="${remCols}" style="text-align:center; font-style:italic; font-size:9px; color:#94a3b8; border:none;">(Ký, họ tên)</td>
                    </tr>
                    <tr><td colspan="${maxCols}" style="height:50px; border:none;"></td></tr>
                `;

                const getSheetHtml = (tbodyContent) => {
                    return `<table style="border-collapse:collapse;border:1px solid #000">
                        <thead>
                            ${headerHtml}
                            ${theadHTML}
                        </thead>
                        <tbody>
                            ${tbodyContent}
                            ${footerHtml}
                        </tbody>
                    </table>`;
                };

                const sheets = [];
                if (totalTr <= SHEET_LIMIT) {
                    sheets.push({ name: 'Data', html: getSheetHtml(clone.querySelector('tbody') ? clone.querySelector('tbody').innerHTML : clone.innerHTML) });
                } else {
                    const per = Math.max(1, SHEET_LIMIT - theadEl.querySelectorAll('tr').length - 15);
                    let idx = 1;
                    for (let i = 0; i < bodyTrs.length; i += per) {
                        const chunk = bodyTrs.slice(i, i + per).map(tr => tr.outerHTML).join('');
                        sheets.push({ name: 'Sheet ' + (idx++), html: getSheetHtml(chunk) });
                    }
                }
                
                // BC016 rất nhiều cột: đặt luôn khổ ngang + co vừa 1 trang bề ngang ngay trong
                // WorksheetOptions, để mở file ra là in được, không phải vào Page Setup chỉnh tay.
                const wsPrint = reportType === 'BC016'
                    ? '<x:Print><x:ValidPrinterInfo/><x:Orientation>Landscape</x:Orientation>'
                      + '<x:FitWidth>1</x:FitWidth><x:FitHeight>0</x:FitHeight><x:Scale>0</x:Scale></x:Print>'
                    : '';
                const wsXml = sheets.map(s =>
                    '<x:ExcelWorksheet><x:Name>' + s.name + '</x:Name><x:WorksheetOptions><x:DisplayGridlines/>' + wsPrint + '</x:WorksheetOptions></x:ExcelWorksheet>'
                ).join('');
                const bodyHtml = sheets.map(s => s.html).join('<br clear="all"/>');
                const html =
                    '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">' +
                    '<head><meta charset="utf-8"><meta name="ProgId" content="Excel.Sheet">' +
                    '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>' + wsXml +
                    '</x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->' +
                    '<style>table{border-collapse:collapse}th,td{border:1px solid #000}' +
                    '.xnum{mso-number-format:"\\#\\,\\#\\#0"}.xtext{mso-number-format:"\\@"}' +
                    '.xpct0{mso-number-format:"0\\%"}.xpct1{mso-number-format:"0\\.0\\%"}' +
                    '.xpct2{mso-number-format:"0\\.00\\%"}.xpct3{mso-number-format:"0\\.000\\%"}' +
                    '.xpct4{mso-number-format:"0\\.0000\\%"}' +
                    // BC016 có 51–59 cột ⇒ ngoài khổ ngang còn phải ép vừa 1 trang chiều rộng,
                    // không thì Excel cắt bảng thành hàng chục trang dọc rời rạc.
                    ((reportType === 'BC015' || reportType === 'BC016') ? '@page{mso-page-orientation:landscape;}' : '') +
                    (reportType === 'BC016' ? 'td,th{font-size:8pt}' : '') +
                    '</style>' +
                    '</head><body>' + bodyHtml + '</body></html>';

                const dateSuffix = period.type === 'custom' 
                    ? `${filters.from_date.replace(/\//g,'')}-${filters.to_date.replace(/\//g,'')}`
                    : `${period.year}_Thang${period.value}`;
                const fname = `${REPORT_FILE[reportType] || reportType}_${dateSuffix}.xls`;

                setExportModal({ open: true, progress: 30, status: 'exporting', filename: fname });

                const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = fname;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                setExportModal({ open: true, progress: 70, status: 'exporting', filename: fname });

                fetch('/api/save_export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: fname, content: html })
                }).then(r => r.json()).then(res => {
                    if (res.status === 'ok') {
                        setExportModal({ open: true, progress: 100, status: 'done', path: res.path, filename: res.filename });
                    } else {
                        setExportModal({ open: true, progress: 100, status: 'done', path: '', filename: fname });
                    }
                }).catch(() => {
                    setExportModal({ open: true, progress: 100, status: 'done', path: '', filename: fname });
                });
            };

            const downloadBlobAndSave = async (apiUrl, defaultFilename) => {
                try {
                    setExportModal({ open: true, progress: 15, status: 'exporting', filename: defaultFilename });
                    const timer1 = setTimeout(() => setExportModal(m => m ? { ...m, progress: 45 } : m), 250);
                    const timer2 = setTimeout(() => setExportModal(m => m ? { ...m, progress: 75 } : m), 600);

                    const r = await fetch(apiUrl);
                    clearTimeout(timer1);
                    clearTimeout(timer2);

                    if (!r.ok) {
                        alert('Lỗi xuất file: ' + r.statusText);
                        setExportModal(null);
                        return;
                    }

                    let filename = defaultFilename;
                    const cd = r.headers.get('Content-Disposition');
                    if (cd) {
                        const match = cd.match(/filename=["']?([^"';]+)["']?/);
                        if (match && match[1]) filename = match[1];
                    }

                    setExportModal({ open: true, progress: 88, status: 'exporting', filename });

                    const blob = await r.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

                    const reader = new FileReader();
                    reader.onload = async () => {
                        try {
                            let textContent = reader.result;
                            if (typeof textContent === 'string') {
                                textContent = textContent.replace(/\r\r\n/g, '\r\n');
                            }
                            const res = await fetch('/api/save_export', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ filename, content: textContent })
                            }).then(res => res.json());

                            if (res.status === 'ok') {
                                setExportModal({ open: true, progress: 100, status: 'done', path: res.path, filename: res.filename });
                            } else {
                                setExportModal({ open: true, progress: 100, status: 'done', path: '', filename });
                            }
                        } catch (e) {
                            setExportModal({ open: true, progress: 100, status: 'done', path: '', filename });
                        }
                    };
                    reader.readAsText(blob);
                } catch (err) {
                    alert('Lỗi xuất file: ' + err.message);
                    setExportModal(null);
                }
            };

const exportJournalCsv = (mode) => {
                const q = new URLSearchParams({ report_type: 'BC007', mode, journal_view_mode: journalViewMode, from_date: filters.from_date,
                    to_date: filters.to_date, org_ids: filters.org_ids.join(','), account_id: filters.acc_ids.join(',') });
                const fname = `BC007_Nhat_Ky_Chung_${filters.from_date.replace(/\//g,'')}-${filters.to_date.replace(/\//g,'')}.csv`;
                downloadBlobAndSave(`/api/report_export_csv?${q.toString()}`, fname);
                setShowJournalExport(false);
            };

            // Xuất .xlsx MỘT FILE nhiều sheet cho BC007. Backend ghi file ở thread riêng
            // (2,85 triệu dòng mất khoảng 4-5 phút) nên không tải trực tiếp được như CSV:
            // nhận job_id rồi poll /api/export/status để chạy thanh tiến trình, xong thì
            // hiện nút Mở file / Mở thư mục của exportModal có sẵn.
            const exportJournalXlsx = async (mode) => {
                setShowJournalExport(false);
                const q = new URLSearchParams({ report_type: 'BC007', mode, journal_view_mode: journalViewMode,
                    from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','),
                    account_id: filters.acc_ids.join(','), format: 'xlsx' });
                const dateSfx = `${filters.from_date.replace(/\//g,'')}-${filters.to_date.replace(/\//g,'')}`;
                const fname = mode === 'detail'
                    ? `BC007_Nhat_Ky_Chung_ChiTiet_${dateSfx}.xlsx`
                    : `BC007_So_Nhat_Ky_Chung_${dateSfx}.xlsx`;
                setExportModal({ open: true, progress: 2, status: 'exporting', filename: fname });
                try {
                    const r = await fetch(`/api/report_export_csv?${q.toString()}`);
                    if (r.status === 401) { setExportModal(null); alert('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.'); return; }
                    const res = await r.json();
                    if (res.status !== 'ok' || !res.job_id) { setExportModal(null); alert('Lỗi khởi tạo xuất file: ' + (res.message || '')); return; }
                    while (true) {
                        await new Promise(k => setTimeout(k, 700));
                        const sr = await fetch(`/api/export/status?job_id=${res.job_id}`);
                        if (sr.status === 404) { setExportModal(null); alert('Job xuất file đã bị xoá.'); return; }
                        const sj = await sr.json();
                        if (sj.status === 'done') {
                            setExportModal({ open: true, progress: 100, status: 'done', path: sj.file_path, filename: sj.filename });
                            return;
                        }
                        if (sj.status === 'error') { setExportModal(null); alert('Lỗi xuất file: ' + (sj.error || '')); return; }
                        // Không biết trước tổng số dòng ⇒ bò dần theo số dòng đã ghi, chặn ở 95%
                        // để thanh không đứng im ở 0% suốt mấy phút.
                        setExportModal(m => m ? { ...m, progress: Math.min(95, 2 + Math.floor((sj.current || 0) / 30000)) } : m);
                    }
                } catch (err) {
                    setExportModal(null);
                    if (window.isNetworkError && window.isNetworkError(err)) window.showConnectionLost();
                    else alert('Lỗi xuất file: ' + err.message);
                }
            };

            // ── Xuất .xls GIỮ NGUYÊN FORM cho báo cáo CÓ PHÂN TRANG (BC008 / BC012 / BC013) ──
            // exportReportXls() đọc bảng .report-table đang hiển thị, mà DOM chỉ có TRANG HIỆN TẠI →
            // file sẽ thiếu dòng mà không báo lỗi. Cách xử lý (pattern exportBC014Xls của LedgerReport):
            // gọi API với page_size=0 (server trả toàn bộ) → nạp vào DOM qua fullExportRows →
            // useLayoutEffect xuất rồi trả DOM về trạng thái phân trang (dùng useLayoutEffect nên không nháy màn hình).
            const FULL_XLS_WARN_ROWS = 50000;
            const exportFullXls = async (apiUrl, pickRows) => {
                setFullExporting(true);
                try {
                    const r = await fetch(apiUrl);
                    if (r.status === 401) { alert('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.'); setFullExporting(false); return; }
                    const res = await r.json();
                    if (res.status !== 'ok') { alert('Lỗi tải dữ liệu để xuất: ' + (res.message || '')); setFullExporting(false); return; }
                    const rows = pickRows(res) || [];
                    // BC016 trả nguyên payload (có cột động + cây nhóm) chứ không phải mảng dòng phẳng
                    // như các báo cáo khác ⇒ đếm dòng qua pagination.
                    const nRows = Array.isArray(rows) ? rows.length : ((res.pagination && res.pagination.total_rows) || 0);
                    if (!nRows) { alert('Không có dữ liệu để xuất.'); setFullExporting(false); return; }
                    if (nRows > FULL_XLS_WARN_ROWS && !confirm(
                        `Báo cáo có ${nRows.toLocaleString('vi-VN')} dòng. Nạp hết vào bảng để giữ nguyên form Excel `
                        + `có thể làm ứng dụng chậm hoặc treo.\n\nNên chọn "Xuất toàn bộ CSV" thay thế. Vẫn tiếp tục xuất Excel?`)) {
                        setFullExporting(false); return;
                    }
                    setFullExportRows(rows);
                } catch (err) {
                    if (window.isNetworkError && window.isNetworkError(err)) window.showConnectionLost();
                    else alert('Lỗi xuất Excel: ' + err.message);
                    setFullExporting(false);
                }
            };

            React.useLayoutEffect(() => {
                if (!fullExportRows) return;
                try { exportReportXls(); } finally { setFullExportRows(null); setFullExporting(false); }
            }, [fullExportRows]);

            const buildFullExportReq = (rptType, modeArg) => {
                const base = { from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(',') };
                if (rptType === 'BC008') {
                    const q = new URLSearchParams({ ...base, account_id: filters.acc_ids.join(','), page: 1, page_size: 0 });
                    return [`/api/account_details?${q.toString()}`, res => res.data];
                }
                if (rptType === 'BC012') {
                    const q = new URLSearchParams({ ...base, acc_ids: filters.acc_ids.join(','),
                        contra_acc_ids: filters.contra_acc_ids.join(','), tran_no: filters.tran_no || '', page: 1, page_size: 0 });
                    return [`/api/cash_book?${q.toString()}`, res => res.rows];
                }
                if (rptType === 'BC015') {
                    const q = new URLSearchParams({ ...base, mode: modeArg || saleSourceMode || 'summary', page: 1, page_size: 0 });
                    return [`/api/sale_by_source?${q.toString()}`, res => res.rows];
                }
                if (rptType === 'BC016') {
                    // page_size=0 ⇒ lấy MỌI nhóm, không chỉ trang đang xem (Bẫy 9: DOM chỉ có trang hiện tại).
                    const q = new URLSearchParams({ ...base, group_by: modeArg || nxtGroupBy || 'class', page: 1, page_size: 0 });
                    return [`/api/nxt?${q.toString()}`, res => res];
                }

        // ===== ĐIỀU HƯỚNG 2 TẦNG — GĐ3 giao diện PROOFTRAIL (Đại Ca chốt 25/09/2026) =====

        // Phân hệ KHÔNG giữ state riêng — suy ra từ activeTab, nên hai tầng không bao giờ lệch nhau.
        //
        // ⛔ Thêm tab danh sách mới thì gắn nó vào một phân hệ ở đây. Quên cũng KHÔNG mất tab: tab

        // Mở app / đăng nhập xong là vào đây. Đại Ca chốt "tạm thời lên mẫu, chưa lấy số liệu" ⇒ trang
        // này KHÔNG gọi truy vấn SQL nào: chỉ lời chào + thẻ phân hệ. Số trên thẻ (số màn hình, số báo
        // cáo) đếm từ PHAN_HE / REPORT_TYPES theo QUYỀN của người đang đăng nhập — không đụng DB.
        // ⏭️ Lúc thêm khối số liệu ("Việc cần xử lý" trong phác thảo): kỳ = THÁNG HIỆN TẠI (Đại Ca chốt);
        //    mỗi ô là truy vấn 6–8 giây ⇒ phải tải NGẦM, đừng bắt trang chờ.
        const THU_TRONG_TUAN = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
        const TrangChu = ({ the, nguoiDung, onMo }) => {
            const now = new Date();
            const gio = now.getHours();
            const buoi = gio < 11 ? 'buổi sáng' : gio < 13 ? 'buổi trưa' : gio < 18 ? 'buổi chiều' : 'buổi tối';
            const ngay = `${THU_TRONG_TUAN[now.getDay()]}, ${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;

        // Một nút trên cột phân hệ: icon + chữ 10px bên dưới (10px là cỡ tối thiểu — Bẫy 27).
        // ⚠️ Rê chuột CHỈ đổi màu chữ, KHÔNG tô nền: nền white/5 trên navy tối trông gần y hệt
        //    nền #1e3a8a của mục đang chọn ⇒ rê qua "Kho" là tưởng đang ở Kho (đã thấy khi chụp thử).
        const NutPhanHe = ({ icon, ten, dangChon, onClick }) => (

                className={`w-[58px] h-[50px] shrink-0 rounded-lg flex flex-col items-center justify-center gap-[5px] transition-colors ${dangChon ? 'text-white' : 'text-[#93c5fd] hover:text-white'}`}
                style={dangChon ? { background: '#1e3a8a' } : undefined}>

        // Cột phân hệ, rộng 64px (Đại Ca chốt — cột bảng vốn đã hẹp, không lấy 84px như phác thảo).
        // Đáy cột: Phân quyền (chỉ ai có quyền mới thấy) rồi tới ô tài khoản.
        const ThanhPhanHe = ({ dsPhanHe, phanHeDangMo, onChon, dangOTrangChu, onTrangChu, coPhanQuyen, dangOPhanQuyen, onPhanQuyen, taiKhoan }) => (

                <svg viewBox="0 0 200 200" className="w-8 h-8 shrink-0 mb-3" role="img" aria-label="PROOFTRAIL">
                    <rect width="200" height="200" rx="45" fill="#FF9D3D"/>

        // Hàng tab ngang. Trái: màn hình của phân hệ đang mở. Phải (`phai`): phần việc của thanh đen
        // cũ — tên DB, phiên bản, Danh mục, Tải lại (Đại Ca chốt gộp để đỡ tốn chiều cao).
        const HangTab = ({ tabs, dangChon, onChon, phai }) => (
            <div className="shrink-0 bg-white flex items-stretch gap-6 pl-6 pr-3 z-[1000]" style={{ height: 44, boxShadow: 'inset 0 -1px 0 #e2e8f0' }}>
                <div role="tablist" className="flex items-stretch gap-6 min-w-0 overflow-x-auto overflow-y-hidden">
                    {tabs.map(t => {
                        const on = t.id === dangChon;
                        return (
                            <button key={t.id} type="button" role="tab" aria-selected={on} onClick={() => onChon(t.id)}
                                className={`shrink-0 flex items-center gap-2 pt-[2px] text-[13px] whitespace-nowrap border-b-2 transition-colors ${on ? 'font-bold text-slate-900' : 'text-slate-500 border-transparent hover:text-slate-900'}`}
                                style={on ? { borderBottomColor: '#1e3a8a' } : undefined}>
                                <Icon name={t.icon} size={14} strokeWidth="1.8" />
                                {t.ten}
                                {t.so != null && <span className={`text-[11px] font-bold rounded-full px-[7px] py-[2px] tabular-nums ${on ? 'bg-blue-100 text-[#1e3a8a]' : 'bg-slate-100 text-slate-600'}`}>{t.so}</span>}
                            </button>

                    })}
                </div>
                <div className="ml-auto flex items-center gap-2 shrink-0">{phai}</div>

        );
        
        const PageSizeDropdown = ({ value, onChange }) => {
            const [open, setOpen] = useState(false);
            const ref = React.useRef(null);
            
            React.useEffect(() => {
                const handler = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
                if (open) document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [open]);

            const options = [
                { value: 1000, label: '1,000 dòng' },
                { value: 10000, label: '10,000 dòng' },
                { value: 50000, label: '50,000 dòng' },
                { value: 100000, label: '100,000 dòng' },
                { value: 200000, label: '200,000 dòng' },
                { value: 500000, label: '500,000 dòng' },
            ];

            return (
                <div className="relative" ref={ref}>
                    <div 
                        onClick={() => setOpen(!open)}
                        className="flex items-center gap-1 bg-transparent text-[11px] font-black text-slate-700 outline-none cursor-pointer pr-1 select-none"
                    >
                        <span>{value.toLocaleString()} dòng</span>
                        <Icon name="chevron-down" size={12} className={`text-slate-400 transition-transform duration-300 ${open ? 'rotate-180' : ''}`} />
                    </div>
                    
                    {open && (
                        <div className="absolute top-full mt-2 left-0 bg-white/90 backdrop-blur-xl border border-white/50 shadow-[0_8px_30px_rgb(0,0,0,0.12)] rounded-2xl z-[6000] min-w-[130px] overflow-hidden origin-top animate-in fade-in zoom-in-95 duration-200">
                            <div className="p-1 flex flex-col gap-0.5">
                                {options.map(opt => (
                                    <div
                                        key={opt.value}
                                        onClick={() => { onChange(opt.value); setOpen(false); }}
                                        className={`px-3 py-2.5 rounded-xl text-[11px] font-bold cursor-pointer transition-all ${value === opt.value ? 'bg-indigo-50 text-indigo-700 shadow-sm' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}`}
                                    >
                                        {opt.label}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // Kiểu dùng chung cho tab Phân quyền (giao diện mới 25/09/2026). Khai ở ngoài component để màn
        // Mở khoá (return sớm) cũng dùng được. Chỉ độ đậm 700 — Bẫy 27.
        const PQ_NHAN = 'block text-[11px] font-bold text-slate-600 mb-1.5';
        const PQ_O = 'w-full h-10 px-3 rounded-lg border border-slate-300 bg-white text-[13px] text-slate-900 outline-none focus:border-[#1e3a8a] focus:ring-2 focus:ring-blue-100 disabled:bg-slate-50 disabled:text-slate-500';
        const PQ_TICK = 'w-4 h-4 shrink-0 accent-[#1e3a8a] cursor-pointer';
        const PQ_DONG_TICK = 'flex items-center gap-2.5 h-[30px] px-2 rounded-md text-[12.5px] text-slate-700 cursor-pointer hover:bg-slate-50 min-w-0';
        const PQ_NUT = 'h-8 px-3 rounded-lg border border-slate-200 bg-white text-slate-700 text-[12px] font-bold hover:bg-slate-50 flex items-center gap-1.5 shrink-0';
        const PQ_NUT_CHINH = 'h-8 px-3 rounded-lg bg-[#1e3a8a] text-white text-[12px] font-bold hover:bg-[#172554] disabled:opacity-60 disabled:cursor-not-allowed flex items-center gap-1.5 shrink-0';
        const PQ_TH = 'text-left px-4 h-10 text-[11px] font-bold text-slate-600';
        const PQ_TD = 'px-4 h-[52px] text-[13px] text-slate-700';
        const pqChip = (on) => `h-[30px] px-3 rounded-full border text-[12px] font-bold flex items-center gap-1.5 transition-colors ${on ? 'bg-[#1e3a8a] border-[#1e3a8a] text-white' : 'bg-white border-slate-200 text-slate-600 hover:border-slate-300'}`;

        // ===== TAB PHÂN QUYỀN (chỉ ADMIN thấy) — quản lý người dùng + gán nhóm, app tự lưu file =====
        // Giao diện mới (Đại Ca duyệt phác thảo 25/09/2026, mục 05 — PHÂN QUYỀN): hai màn Tài khoản /
        // Chức vụ nằm trên HÀNG TAB NGANG của app (`tabCon` do App giữ), mỗi màn = danh sách bên trái +
        // khung sửa bên phải (thay hộp thoại giữa màn). Mọi logic lưu/xoá/lưới an toàn giữ nguyên.
        const PermAdminPanel = ({ onPermsChanged, orgs = [], tabCon = 'user', onDem }) => {
            const [cfg, setCfg] = useState({ users: [], groups: [] });
            const [loading, setLoading] = useState(false);
            const [editing, setEditing] = useState(null);
            const [msg, setMsg] = useState('');
            // Từ 21/09/2026 chỉ còn MỘT nguồn: Google Sheet, quyền do CHỨC VỤ quyết định.
            // Chế độ file (phanquyen.json) đã bỏ hẳn — backend thiếu cấu hình là chặn đăng nhập.
            // Mật khẩu quản trị chỉ nằm trong bộ nhớ React, KHÔNG ghi localStorage/cookie/session.
            const [admPass, setAdmPass] = useState('');
            const [canMatKhau, setCanMatKhau] = useState(false);
            const [goMk, setGoMk] = useState('');
            const [roleEdit, setRoleEdit] = useState(null);
            // Lọc danh sách tài khoản: ô tìm + chip chức vụ + chip "Đang khoá".
            const [locTk, setLocTk] = useState({ q: '', chucVu: '', khoa: false });
            // Màn SỬA: ô mật khẩu ẩn sau dòng "Đặt lại mật khẩu" (admin đặt mk mới, không cần mk cũ —
            // Đại Ca chốt giữ 25/09). Tài khoản MỚI thì ô mật khẩu luôn hiện.
            const [datLaiMk, setDatLaiMk] = useState(false);
            // Bản gốc lúc mở khung sửa — bấm dòng khác / Huỷ / ✕ mà có thay đổi chưa lưu thì HỎI trước.
            const gocTk = useRef('');
            const gocCv = useRef('');
            useEffect(() => { setMsg(''); }, [tabCon]);
            // Mọi lệnh ghi đều đi vòng qua Google Apps Script, mất 4–7 GIÂY. Không có trạng thái
            // chờ thì nút đứng yên, người dùng tưởng hỏng rồi bấm lại → ghi hai lần.
            // Giá trị: '' | 'user' | 'role' | 'xoa:<uid>' | 'xoarole:<ma>'.
            const [dangLuu, setDangLuu] = useState('');
            // Nhãn 24 mục để hiển thị checklist (lấy từ chính DOC_TABS + REPORT_TYPES + tab quản trị)
            const ITEM_LABEL = {}; DOC_TABS.forEach(t => ITEM_LABEL[t.id] = t.name); REPORT_TYPES.forEach(r => ITEM_LABEL[r.id] = r.id + ' — ' + r.name); ITEM_LABEL['perm_admin'] = 'Tab Phân quyền (quản trị)';
            const ITEM_SECTIONS = [
                { title: 'Danh sách chứng từ', ids: DOC_TABS.map(t => t.id), cot2: true },
                { title: 'Báo cáo tài chính', ids: REPORT_TYPES.map(r => r.id) },
                { title: 'Quản trị', ids: ['perm_admin'] },
            ];
            // Nhãn NGẮN cho ô tick trong khung sửa chức vụ (ITEM_LABEL giữ tên đầy đủ cho lời cảnh báo).
            const nhanMuc = (code) => {
                const t = DOC_TABS.find(x => x.id === code);
                if (t) return <span className="truncate">{t.short || t.name}</span>;
                const r = REPORT_TYPES.find(x => x.id === code);
                if (r) return <><span className="w-[42px] shrink-0 text-[11px] text-slate-500 tabular-nums">{r.id}</span><span className="truncate">{r.ten || r.name}</span></>;
                return <span className="truncate">{code === 'perm_admin' ? 'Tab Phân quyền' : code}</span>;
            };
            // Đơn vị: editing.orgs === null nghĩa TẤT CẢ (không giới hạn, gồm cả đơn vị thêm sau này).
            const orgChecked = (id) => !editing || editing.orgs === null || editing.orgs.includes(id);
            const toggleOrg = (id) => setEditing(ed => { const cur = ed.orgs === null ? orgs.map(o => o.id) : ed.orgs; const has = cur.includes(id); return { ...ed, orgs: has ? cur.filter(x => x !== id) : [...cur, id] }; });
            const setAllOrgs = (all) => setEditing(ed => ({ ...ed, orgs: all ? null : [] }));
            // POST chứ không GET: mật khẩu quản trị phải đi trong body, TUYỆT ĐỐI không nhét lên URL.
            const load = async (mkThu) => {
                const mk = (mkThu !== undefined) ? mkThu : admPass;
                setLoading(true);
                try {
                    const r = await fetch('/api/perm/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ admin_pass: mk }) });
                    const j = await r.json();
                    if (j.status === 'ok') {
                        setCfg({ users: j.users || [], groups: j.groups || [] });
                        onDem && onDem((j.users || []).length, (j.groups || []).length);   // số trên hàng tab
                        setCanMatKhau(false);
                        if (mkThu !== undefined) { setAdmPass(mkThu); setMsg(''); }
                        return j;                       // trả về để chỗ gọi đối chiếu được (xem kiemMucBiVutBo)
                    } else if (j.can_mat_khau) {
                        setCanMatKhau(true);
                        setMsg(mkThu !== undefined ? (j.message || 'Sai mật khẩu quản trị') : '');
                    } else setMsg(j.message || 'Lỗi tải danh sách');
                } catch (e) { setMsg('Lỗi kết nối'); } finally { setLoading(false); }
                return null;
            };

            /* ⚠️ LƯỚI AN TOÀN — Google có thể VỨT BỎ mã quyền trong im lặng.
               `PERM` trong phanquyen_gas/Code.gs ghi cứng danh sách mã TRÊN GOOGLE, còn checklist
               ở đây dựng từ DOC_TABS/REPORT_TYPES ở MÁY. Thêm tab mới vào app mà chưa cập nhật
               Code.gs + thêm cột vào Sheet thì `_apiLuuChucVu` lặp `PERM.forEach` sẽ **bỏ qua mã
               lạ, không báo lỗi** — app hiện "lưu thành công" mà Sheet không đổi gì.
               Đã vấp thật 21/09/2026 với dcnb_reconcile / po_list.
               ⇒ Sau khi lưu, đọc lại từ Google và đối chiếu. Mất mã nào thì NÓI RA. */
            const kiemMucBiVutBo = (maChucVu, daGui, jSauKhiLuu) => {
                if (!jSauKhiLuu) return false;
                const g = (jSauKhiLuu.groups || []).find(x => (x.id || '').toUpperCase() === (maChucVu || '').toUpperCase());
                if (!g) return false;
                const nhan = g.items || [];
                const mat = (daGui || []).filter(c => !nhan.includes(c));
                if (!mat.length) return false;
                setMsg('Google chưa biết ' + mat.length + ' mục nên đã BỎ QUA khi lưu: '
                       + mat.map(c => ITEM_LABEL[c] || c).join(', ')
                       + '. Các mục còn lại đã lưu bình thường. Muốn cấp được các mục này thì phải bổ sung mã vào '
                       + 'phanquyen_gas/Code.gs (danh sách PERM) rồi Triển khai lại — hoặc dùng chức vụ ADMIN (luôn thấy đủ mọi mục).');
                return true;
            };
            useEffect(() => { load(); }, []);
            const boThayDoiTk = () => !editing || JSON.stringify(editing) === gocTk.current || window.confirm('Tài khoản đang sửa có thay đổi CHƯA LƯU. Bỏ thay đổi đó?');
            const boThayDoiCv = () => !roleEdit || JSON.stringify(roleEdit) === gocCv.current || window.confirm('Chức vụ đang sửa có thay đổi CHƯA LƯU. Bỏ thay đổi đó?');
            const moTk = (ed) => { if (!boThayDoiTk()) return; setMsg(''); setDatLaiMk(false); gocTk.current = JSON.stringify(ed); setEditing(ed); };
            const dongTk = () => { if (!boThayDoiTk()) return; setMsg(''); setEditing(null); };
            const startAdd = () => moTk({ uid: '', name: '', group: '', items: [], orgs: null, active: true, password: '', isNew: true });
            const startEdit = (u) => moTk({ uid: u.uid, name: u.name, group: u.group || '', items: u.items ? [...u.items] : [], orgs: u.orgs ? [...u.orgs] : null, active: u.active, password: '', isNew: false });
            const save = async () => {
                if (dangLuu) return;                    // chặn bấm hai lần khi Google đang quay 4–7s
                setMsg('');
                setDangLuu('user');
                const body = { uid: (editing.uid || '').trim(), name: editing.name, group: editing.group, items: editing.items, active: editing.active, admin_pass: admPass };
                if (editing.password) body.password = editing.password;
                // Tick hết đơn vị = không giới hạn (null) → user thấy cả đơn vị thêm sau này.
                let orgsToSend = editing.orgs;
                if (orgsToSend !== null && orgs.length && orgsToSend.length === orgs.length) orgsToSend = null;
                body.orgs = orgsToSend;
                try {
                    const r = await fetch('/api/perm/user', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    const j = await r.json();
                    if (j.status === 'ok') { setEditing(null); await load(); onPermsChanged && onPermsChanged(); }
                    else setMsg(j.message || 'Lỗi lưu');
                } catch (e) { setMsg('Lỗi kết nối'); } finally { setDangLuu(''); }
            };
            const del = async (uid) => {
                if (dangLuu) return;
                if (!window.confirm('Xoá tài khoản "' + uid + '"?')) return;
                setDangLuu('xoa:' + uid);
                try {
                    const r = await fetch('/api/perm/user/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid, admin_pass: admPass }) });
                    const j = await r.json();
                    if (j.status !== 'ok') { alert(j.message || 'Lỗi xoá'); return; }
                    setEditing(ed => (ed && ed.uid === uid) ? null : ed);   // vừa xoá đúng người đang mở ⇒ đóng khung
                    await load(); onPermsChanged && onPermsChanged();
                } catch (e) { alert('Lỗi kết nối'); } finally { setDangLuu(''); }
            };

            // ---- CHỨC VỤ (chỉ có khi nguồn là Google Sheet) ----
            // Chốt 19/09/2026: chức vụ quyết định quyền. Sửa 1 chức vụ = cả nhóm đổi theo,
            // nhưng chỉ có hiệu lực khi từng người ĐĂNG NHẬP LẠI.
            const moCv = (rd) => { if (!boThayDoiCv()) return; setMsg(''); gocCv.current = JSON.stringify(rd); setRoleEdit(rd); };
            const dongCv = () => { if (!boThayDoiCv()) return; setMsg(''); setRoleEdit(null); };
            const startAddRole = () => moCv({ ma: '', ten: '', items: [], isNew: true });
            const startEditRole = (g) => moCv({ ma: g.id, ten: g.name, items: [...(g.items || [])], isNew: false });
            const toggleRoleItem = (code) => setRoleEdit(rd => { const has = rd.items.includes(code); return { ...rd, items: has ? rd.items.filter(x => x !== code) : [...rd.items, code] }; });
            const saveRole = async () => {
                if (dangLuu) return;                    // chặn bấm hai lần khi Google đang quay 4–7s
                setMsg('');
                setDangLuu('role');
                const ma = (roleEdit.ma || '').trim();
                const daGui = [...roleEdit.items];
                try {
                    const r = await fetch('/api/perm/role', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ma, ten: roleEdit.ten, items: daGui, admin_pass: admPass }) });
                    const j = await r.json();
                    if (j.status === 'ok') {
                        const sau = await load();
                        onPermsChanged && onPermsChanged();
                        // Chỉ đóng hộp thoại khi Google nhận ĐỦ. Mất mã nào thì giữ hộp lại
                        // kèm lời cảnh báo — đóng im lặng là lặp lại đúng con bug này.
                        if (!kiemMucBiVutBo(ma, daGui, sau)) setRoleEdit(null);
                    }
                    else setMsg(j.message || 'Lỗi lưu chức vụ');
                } catch (e) { setMsg('Lỗi kết nối'); } finally { setDangLuu(''); }
            };
            const delRole = async (ma) => {
                if (dangLuu) return;
                if (!window.confirm('Xoá chức vụ "' + ma + '"?')) return;
                setDangLuu('xoarole:' + ma);
                try {
                    const r = await fetch('/api/perm/role/delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ma, admin_pass: admPass }) });
                    const j = await r.json();
                    if (j.status !== 'ok') { alert(j.message || 'Lỗi xoá'); return; }
                    setRoleEdit(rd => (rd && rd.ma === ma) ? null : rd);
                    await load(); onPermsChanged && onPermsChanged();
                } catch (e) { alert('Lỗi kết nối'); } finally { setDangLuu(''); }
            };

            // được lưu trong phiên (luật từ đầu) nên phải hỏi lại đúng một lần ở đây.
            if (canMatKhau) {

                                <h1 className="text-[20px] font-bold text-slate-900">Mở khoá tab Phân quyền</h1>

                            </div>
                            <label className="block">
                                <span className={PQ_NHAN}>Mật khẩu quản trị</span>
                                <input type="password" autoFocus value={goMk} onChange={e => setGoMk(e.target.value)} placeholder="Mật khẩu của tài khoản đang đăng nhập" className={PQ_O + ' h-11'}/>

                            {msg && <div className="text-[12px] font-bold text-red-700">{msg}</div>}
                            <button type="submit" disabled={loading || !goMk} className="w-full h-11 rounded-lg bg-[#1e3a8a] hover:bg-[#172554] text-white text-[13px] font-bold disabled:opacity-50">

                            </button>
                            <p className="text-[12px] text-slate-500 leading-relaxed border-t border-slate-100 pt-3.5">Mật khẩu chỉ giữ trong phiên làm việc này, không ghi xuống máy. Đóng app là mất.</p>
                        </form>
                    </div>
                );
            }

            // ---- Dữ liệu dẫn xuất cho hai màn ----
            const laAdmin = (ma) => (ma || '').toUpperCase() === 'ADMIN';   // app tự tính đủ mọi mục cho ADMIN (Bẫy 22)
            const tenDonVi = (id) => { const o = orgs.find(x => x.id === id); return o ? o.name : ''; };

                if (u.orgs.length === 1) return <span><span className="tabular-nums">{u.orgs[0]}</span> <span className="text-[12px] text-slate-500">&middot; {tenDonVi(u.orgs[0])}</span></span>;

                                    const on = (locTk.chucVu || '').toUpperCase() === (g.id || '').toUpperCase();
                                    return <button key={g.id} type="button" title={g.name} onClick={() => setLocTk({ ...locTk, chucVu: on ? '' : g.id })} className={pqChip(on)}>{g.id} <span className="tabular-nums opacity-80">{soNguoiGiu(g.id)}</span></button>;

                                </>}
                            </div>
                            {loiNgoai && <div className="bg-red-50 border border-red-100 text-red-700 p-3 rounded-lg text-[12px]">{msg}</div>}

                                                    <td className={PQ_TD + mo}>{veChucVu(u.group)}</td>
                                                    <td className={PQ_TD + mo}>{veDonVi(u)}</td>
                                                    <td className={PQ_TD}>{u.active
                                                        ? <span className="inline-flex items-center gap-1.5 text-[12px] font-bold text-green-700"><span className="w-[7px] h-[7px] rounded-full bg-green-600"></span>Hoạt động</span>
                                                        : <span className="inline-flex items-center gap-1.5 text-[12px] font-bold text-slate-600"><span className="w-[7px] h-[7px] rounded-full border-[1.5px] border-slate-500"></span>Đang khoá</span>}</td>
                                                    <td className={PQ_TD}>{veMuiTen(chon)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </>) : (<>
                            <div className="flex items-end gap-4">
                                <div className="flex-1 min-w-0">
                                    <h1 className="text-[22px] font-bold text-slate-900" style={{ letterSpacing: '-0.01em' }}>Chức vụ</h1>
                                    <p className="text-[13px] text-slate-500 mt-1">Chức vụ quyết định được xem mục nào. Sửa một chức vụ là mọi người mang chức vụ đó đổi theo khi đăng nhập lại.</p>
                                </div>
                                <button type="button" onClick={startAddRole} className={PQ_NUT_CHINH + ' h-[34px]'}><Icon name="plus" size={14} strokeWidth="2.2"/>Thêm chức vụ</button>
                            </div>
                            {loiNgoai && <div className="bg-red-50 border border-red-100 text-red-700 p-3 rounded-lg text-[12px]">{msg}</div>}
                            <div className="bg-white border border-slate-200 rounded-xl overflow-hidden">
                                <table className="w-full">
                                    <thead><tr className="bg-slate-50 border-b border-slate-200">
                                        <th className={PQ_TH} style={{ width: 130 }}>Mã</th>
                                        <th className={PQ_TH}>Tên chức vụ</th>
                                        <th className={PQ_TH} style={{ width: 170 }}>Được xem</th>
                                        <th className={PQ_TH} style={{ width: 140 }}>Đang dùng</th>
                                        <th className={PQ_TH} style={{ width: 36 }}></th>
                                    </tr></thead>
                                    <tbody>
                                        {cfg.groups.length === 0 && (<tr><td colSpan={5} className="text-center py-10 text-slate-500 text-[12.5px]">{loading ? 'Đang tải...' : 'Chưa có chức vụ nào.'}</td></tr>)}
                                        {cfg.groups.map(g => {

                                            return (
                                                <tr key={g.id} tabIndex={0} onClick={() => startEditRole(g)} onKeyDown={e => bamDong(e, () => startEditRole(g))}

                                                </tr>

                                </table>
                            </div>

                    </div>

                    {/* ===== KHUNG PHẢI: sửa / thêm TÀI KHOẢN ===== */}
                    {tabCon === 'user' && editing && (
                        <aside aria-label={editing.isNew ? 'Thêm tài khoản' : 'Sửa tài khoản'} className="w-[460px] shrink-0 bg-white border-l border-slate-200 flex flex-col min-h-0">
                            <div className="px-6 pt-[18px] pb-4 border-b border-slate-100 flex items-start gap-3">

                                        <input type="password" className={PQ_O} value={editing.password} autoFocus={!editing.isNew} autoComplete="new-password"
                                            placeholder={editing.isNew ? 'Mật khẩu đăng nhập lần đầu' : 'Gõ mật khẩu mới rồi bấm Lưu'} onChange={e => setEditing({ ...editing, password: e.target.value })}/>
                                        {!editing.isNew && <span className="block text-[11.5px] text-slate-500 mt-1">Không cần mật khẩu cũ. Lưu xong báo mật khẩu mới cho người dùng.</span>}

        // ===== MODAL ĐỔI MẬT KHẨU (chính chủ tự đổi) =====

        // ⚠️ Gọi Google nên mất 4–7 giây — phải có trạng thái chờ, không thì người dùng
        //    bấm lại nhiều lần, mà mỗi lần sai là một lần bị tính vào lưới chống dò.
        const ModalDoiMatKhau = ({ uid, onDong }) => {
            const [cu, setCu] = useState('');
            const [moi, setMoi] = useState('');
            const [lai, setLai] = useState('');
            const [loi, setLoi] = useState('');
            const [dangLuu, setDangLuu] = useState(false);
            const [xong, setXong] = useState(false);

            const luu = async (e) => {
                e.preventDefault();
                setLoi('');
                if (!cu) return setLoi('Nhập mật khẩu hiện tại');
                if (moi.length < 6) return setLoi('Mật khẩu mới phải từ 6 ký tự trở lên');
                if (moi !== lai) return setLoi('Hai ô mật khẩu mới không giống nhau');
                if (moi === cu) return setLoi('Mật khẩu mới trùng mật khẩu hiện tại');
                setDangLuu(true);
                try {
                    const r = await fetch('/api/perm/password', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ uid, old_password: cu, password: moi }) });
                    const j = await r.json();
                    if (j.status === 'ok') setXong(true);
                    else setLoi(j.message || 'Không đổi được mật khẩu');

                                    <button type="submit" disabled={dangLuu}
