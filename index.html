            // ⚠️ CỐ Ý không tự chọn "ODBC Driver 18": nó mặc định bật mã hoá TLS, máy chủ
            //    không có chứng chỉ hợp lệ là nối không được. Ai cần thì tự chọn trong danh sách.
            const UU_TIEN_DRIVER = [
                "ODBC Driver 17 for SQL Server",
                "ODBC Driver 13 for SQL Server",
                "SQL Server"
            ];
            const [driverOptions, setDriverOptions] = useState([
                { value: "ODBC Driver 17 for SQL Server", label: "ODBC Driver 17 for SQL Server" },
                { value: "ODBC Driver 13 for SQL Server", label: "ODBC Driver 13 for SQL Server" },
                { value: "SQL Server", label: "SQL Server (đời cũ, chậm)" }
            ]);

            // AbortController để hủy request cũ khi có request mới
            const abortRef = useRef(null);

            // Debounce colSearch 400ms — chờ người dùng ngừng gõ mới bắn query
            const debouncedColSearch = useDebounce(colSearch, 400);

            useEffect(() => {
                // Check driver khi app load
                // .catch bắt buộc: server tắt/chưa sẵn sàng -> hiện banner "Mất kết nối", KHÔNG để
                // rơi xuống handler unhandledrejection (đổ stack trace đỏ ra màn hình người dùng).
                fetch('/api/check_driver').then(r => r.json()).then(res => {
                    if (!res.has_driver) {
                        setShowDriverDialog(true);
                    }
                    // Chỉ liệt kê driver CÓ THẬT trên máy này, rồi tự chọn cái tốt nhất.
                    const coTrenMay = (res.drivers || []).filter(d => /SQL Server/i.test(d));
                    if (!coTrenMay.length) return;
                    setDriverOptions(coTrenMay.map(d => ({
                        value: d, label: d === 'SQL Server' ? 'SQL Server (đời cũ, chậm)' : d
                    })));
                    setLoginData(ld => {
                        // Đại Ca đã tự chọn lần trước và driver đó vẫn còn → tôn trọng, đừng đổi.
                        const daChon = localStorage.getItem('iacc_driver');
                        if (daChon && coTrenMay.includes(daChon)) return { ...ld, driver: daChon };
                        const tot = UU_TIEN_DRIVER.find(d => coTrenMay.includes(d));
                        return tot ? { ...ld, driver: tot } : ld;
                    });
                }).catch(err => { if (window.isNetworkError(err)) window.showConnectionLost(); });

                fetch('/api/metadata').then(r => {
                    if (r.status === 401) { setIsLoggedIn(false); }
                    else return r.json();
                }).then(res => { if(res) { setMeta(res); setIsLoggedIn(true); loadPerms(); } })
                  .catch(err => { if (window.isNetworkError(err)) window.showConnectionLost(); });
            }, []);

            useEffect(() => {
                if (period.type === 'custom') return;
                const { year, type, value } = period;
                let s, e;
                if (type==='month') { s = new Date(year, value-1, 1); e = new Date(year, value, 0); }
                else if (type==='quarter') { s = new Date(year, (value-1)*3, 1); e = new Date(year, value*3, 0); }
                else { s = new Date(year, 0, 1); e = new Date(year, 11, 31); }
                const f = (d) => `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
                setFilters(p => ({ ...p, from_date: f(s), to_date: f(e) }));
            }, [period]);

            // Nhóm bị hạn chế: nếu tab/báo cáo đang mở không được phép thì nhảy về mục ĐƯỢC phép,
            // tránh việc auto-load một mục bị cấm rồi nhận 403. Giai đoạn khung (ADMIN thấy hết) không kích hoạt.
            useEffect(() => {
                if (!allowedItems) return;
                const visDoc = DOC_TABS.filter(t => canSee(t.id));
                const visRep = REPORT_TYPES.filter(r => canSee(r.id));
                if (activeTab === 'report') {
                    if (!visRep.length && visDoc.length) setActiveTab(visDoc[0].id);
                } else if (DOC_TABS.some(t => t.id === activeTab) && !canSee(activeTab)) {
                    if (visDoc.length) setActiveTab(visDoc[0].id);
                    else if (visRep.length) setActiveTab('report');
                }
                if (!canSee(reportType) && visRep.length) setReportType(visRep[0].id);
            }, [allowedItems]);

            // Quyền theo mục: mục nào KHÔNG nằm trong allowedItems thì ẩn khỏi menu.
            // null (chưa nạp) coi như thấy hết — tránh nháy menu rỗng ngay sau đăng nhập.
            const canSee = (id) => !allowedItems || allowedItems.includes(id);

            // ===== ĐIỀU HƯỚNG 2 TẦNG (GĐ3) — xem PHAN_HE / DanhSachBaoCao =====
            // Nhớ màn hình mở gần nhất của TỪNG phân hệ: quay lại phân hệ là về đúng chỗ đang dở.
            const tabCuoiRef = useRef({});
            // Báo cáo TC có 2 trạng thái: trang liệt kê thẻ (true) hoặc đang xem một báo cáo (false).
            // ReportTab KHÔNG bị tháo khi về trang liệt kê — chỉ ẩn đi — nên số liệu, hộp xuất file
            // đang chạy… đều còn nguyên khi quay lại.
            const [xemDsBaoCao, setXemDsBaoCao] = useState(true);
            // Tab Phân quyền: hai màn con nằm trên hàng tab ngang (giao diện mới 25/09/2026).
            // Số đếm do PermAdminPanel báo lên sau mỗi lần tải danh sách từ Google (null = chưa tải).
            const [tabPhanQuyen, setTabPhanQuyen] = useState('user');
            const [demPhanQuyen, setDemPhanQuyen] = useState({ user: null, role: null });
            const [daMoBaoCao, setDaMoBaoCao] = useState(false);
            const phanHeDangMo = activeTab === 'report' ? 'baocao'
                : ((PHAN_HE.find(p => p.tabs && p.tabs.includes(activeTab)) || {}).id || null);
            useEffect(() => { if (phanHeDangMo && phanHeDangMo !== 'baocao') tabCuoiRef.current[phanHeDangMo] = activeTab; }, [activeTab]);
            const dsPhanHe = PHAN_HE.filter(p => p.tabs ? p.tabs.some(canSee) : REPORT_TYPES.some(r => canSee(r.id)));
            const chonPhanHe = (id) => {
                if (id === 'baocao') { setActiveTab('report'); return; }
                const p = PHAN_HE.find(x => x.id === id);
                const cuoi = tabCuoiRef.current[id];
                const dich = (cuoi && canSee(cuoi)) ? cuoi : p.tabs.find(canSee);
                if (dich) setActiveTab(dich);
            };
            // Bấm thẻ trên trang liệt kê. Cùng luật với ô chọn báo cáo: đang có số liệu mà sang báo
            // cáo KHÁC thì HỎI trước khi xoá (bấm Huỷ ⇒ vẫn xem báo cáo cũ, số liệu còn nguyên).
            const moBaoCao = (id) => {
                if (id !== reportType) {
                    if (Object.keys(reportData).length > 0) { setPendingReportType(id); setShowClearModal(true); }
                    else setReportType(id);
                }
                setXemDsBaoCao(false);
                setDaMoBaoCao(true);
            };
            const baoCaoDangMo = REPORT_TYPES.find(r => r.id === reportType);
            // Thẻ trên Trang chủ = đúng các phân hệ người này thấy ở cột trái (+ Phân quyền nếu có quyền).
            const theTrangChu = dsPhanHe.map(p => ({
                id: p.id, ten: p.ten_day || p.ten, icon: p.icon, mo_ta: p.mo_ta,
                mau: p.mau || { nen: '#f1f5f9', chu: '#475569' },
                nhan: p.tabs ? `${p.tabs.filter(canSee).length} màn hình` : `${REPORT_TYPES.filter(r => canSee(r.id)).length} báo cáo`,
            })).concat(canSee('perm_admin') ? [{
                id: 'perm_admin', ten: 'Phân quyền', icon: 'lock', mo_ta: 'Tài khoản, chức vụ và quyền xem theo từng đơn vị',
                mau: { nen: '#f1f5f9', chu: '#475569' }, nhan: 'Quản trị',
            }] : []);
            const moTuTrangChu = (id) => { if (id === 'perm_admin') setActiveTab('perm_admin'); else chonPhanHe(id); };
            const tabHangNgang = activeTab === 'home'
                ? [{ id: 'home', ten: 'Trang chủ', icon: 'home' }]
                : activeTab === 'perm_admin'
                ? [{ id: 'pq_user', ten: 'Tài khoản', icon: 'user', so: demPhanQuyen.user },
                   { id: 'pq_role', ten: 'Chức vụ', icon: 'shield', so: demPhanQuyen.role }]
                : activeTab === 'report'
                    ? [{ id: 'ds_bao_cao', ten: 'Tất cả báo cáo', icon: 'grid' }].concat(
                        daMoBaoCao && !xemDsBaoCao && baoCaoDangMo && canSee(reportType)   // đang ở trang liệt kê thì ẩn (Đại Ca chốt 25/09)
                            ? [{ id: 'bao_cao', ten: reportType + ' · ' + (baoCaoDangMo.ten || baoCaoDangMo.name), icon: 'file-text' }] : [])
                    : (((PHAN_HE.find(p => p.id === phanHeDangMo) || {}).tabs) || []).filter(canSee).map(id => {
                        const t = DOC_TABS.find(x => x.id === id);
                        return { id, ten: t.short || t.name, icon: t.icon || 'table' };
                    });
            const tabDangChon = activeTab === 'report' ? (xemDsBaoCao ? 'ds_bao_cao' : 'bao_cao')
                : activeTab === 'perm_admin' ? (tabPhanQuyen === 'role' ? 'pq_role' : 'pq_user') : activeTab;
            const chonTab = (id) => {
                if (activeTab === 'perm_admin') { setTabPhanQuyen(id === 'pq_role' ? 'role' : 'user'); return; }
                if (activeTab === 'report') setXemDsBaoCao(id === 'ds_bao_cao');
                else if (id !== 'perm_admin') setActiveTab(id);
            };

            const loadPerms = async () => {
                try {
                    const r = await fetch('/api/my_perms');
                    if (!r.ok) return;
                    const j = await r.json();
                    if (j.status === 'ok') {
                        setAllowedItems(j.items);
                        setNguoiDung({ app_user: j.app_user, name: j.name, group: j.group,
                                       items: j.items, allowed_orgs: j.allowed_orgs });
                    }
                } catch (e) { /* server chưa sẵn sàng — giữ null, không lọc */ }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginLoading(true);
                setLoginError("");
                setLoginErrorChiTiet("");
                setHienChiTietLoi(false);
                try {
                    const r = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(loginData)
                    });
                    const res = await r.json();
                    if (res.status === 'ok') {
                        setCanhBaoOffline(res.canh_bao || "");
                        localStorage.setItem("iacc_server", loginData.server);
                        localStorage.setItem("iacc_db", loginData.database);
                        localStorage.setItem("iacc_driver", loginData.driver);   // nhớ driver cho lần sau
                        await loadPerms();                 // nạp quyền TRƯỚC khi vào app → menu + tab mặc định đúng ngay
                        setActiveTab('home');              // đăng nhập xong luôn về Trang chủ, kể cả khi trước đó đăng xuất ở màn khác
                        setIsLoggedIn(true);
                        const metaRes = await fetch('/api/metadata').then(r => r.json());
                        setMeta(metaRes);
                    } else {
                        setLoginError(res.message);
                        setLoginErrorChiTiet(res.chi_tiet || "");
                    }
                } catch (err) {
                    setLoginError("Không gọi được máy chủ của phần mềm. Thử đóng phần mềm rồi mở lại.");
                    setLoginErrorChiTiet(String(err && err.message || err));
                } finally {
                    setLoginLoading(false);
                }
            };

            const handleLogout = async () => {
                await fetch('/api/logout', { method: 'POST' });
                setIsLoggedIn(false);
                setAllowedItems(null);
                setNguoiDung(null);
                setHienDoiMatKhau(false);
                setMeta({ accounts: [], orgs: [], pr_details: [], tran_ids: [], jobs: [], items: [], products: [], expenses: [], warehouses: [], db_info: {}, global_total: 0 });
            };

            const refreshMeta = async () => {
                setRefreshing(true);
                try {
                    await fetch('/api/metadata/refresh', { method: 'POST' });
                    const res = await fetch('/api/metadata').then(r => r.json());
                    if (res.status === 'ok') {
                        setMeta(res);
                        // Hiệu ứng "Done" nhẹ
                        const btn = document.getElementById('btn-refresh-meta');
                        if(btn) {
                            btn.classList.add('bg-emerald-50', 'text-emerald-700');
                            setTimeout(() => btn.classList.remove('bg-emerald-50', 'text-emerald-700'), 2000);
                        }
                    }
                } finally {
                    setRefreshing(false);
                }
            };

            /* Nút "Tải lại" — app chạy trong Chrome chế độ --app nên KHÔNG có thanh địa chỉ,
               không có nút F5. Làm đúng việc của F5 nhưng KHÔNG mất phiên đăng nhập:
                 1) đọc lại quyền  → menu hiện đúng, kể cả mục vừa được thêm vào app
                 2) đọc lại danh mục (đơn vị, kho, hàng hoá…)
                 3) nạp lại dữ liệu của đúng tab đang mở
               ⚠️ GIỚI HẠN phải biết: quyền của NGƯỜI KHÁC chốt một lần lúc họ đăng nhập
               (_current_perms đọc session, cố ý không gọi mạng ở mọi request — gọi thì mỗi
               cú bấm phải chờ Google 1–3 giây). Sửa quyền cho ai thì NGƯỜI ĐÓ vẫn phải
               đăng nhập lại. Nút này chỉ làm mới phiên của CHÍNH MÌNH. */
            const [dangTaiLai, setDangTaiLai] = useState(false);
            const taiLaiTrang = async () => {
                if (dangTaiLai) return;
                setDangTaiLai(true);
                try {
                    await loadPerms();
                    try {
                        const res = await fetch('/api/metadata').then(r => r.json());
                        if (res.status === 'ok') setMeta(res);
                    } catch (e) { /* danh mục lỗi thì vẫn nạp tiếp dữ liệu tab */ }
                    const nap = {
                        ledger: loadData, sale: loadSaleData, voucher: loadVoucherData,
                        purchase: loadPurchaseData, warehouse: loadWarehouseData,
                        warehouse_balance: loadWarehouseBalanceData,
                        btp_reconcile: loadBtpData, dcnb_reconcile: loadDcnbData,
                        po_list: loadPoData,
                    }[activeTab];
                    if (nap) await nap(1, filters.page_size);
                } finally { setDangTaiLai(false); }
            };

            const loadData = async (targetPage = 1, targetPageSize = filters.page_size, searchOverride = null) => {
                // Hủy request đang chạy nếu có
                if (abortRef.current) abortRef.current.abort();
                const _ctrl = new AbortController(); abortRef.current = _ctrl;

                setLoading(true);
                const cs = searchOverride !== null ? searchOverride : colSearch;
                // Các field TEXT dài cần tối thiểu 2 ký tự để tránh scan toàn bảng
                // Các field ID ngắn cho phép 1 ký tự (ví dụ: gõ "5" tìm TK bắt đầu bằng 5)
                const LONG_FIELDS = new Set(['s_desc','s_pr_name','s_exp_name','s_org_name','s_item_name','s_prod_name','tran_no']);
                const take = (key, val) => {
                    const v = (val || '').trim();
                    if (!v) return null;
                    if (LONG_FIELDS.has(key) && v.length < 2) return null;
                    return v;
                };
                const searchParams = {
                    s_date:     take('s_date',     cs.TRAN_DATE),
                    tran_no:    take('tran_no',    cs.TRAN_NO),
                    s_tran_id:  take('s_tran_id',  cs.TRAN_ID),
                    s_acc_id:   take('s_acc_id',   cs.ACCOUNT_ID),
                    s_contra_id:take('s_contra_id',cs.ACCOUNT_ID_CONTRA),
                    s_desc:     take('s_desc',     cs.DESCRIPTION),
                    s_pr_name:  take('s_pr_name',  cs.PR_DETAIL_NAME),
                    s_exp_name: take('s_exp_name', cs.EXPENSE_NAME),
                    s_org_id:   take('s_org_id',   cs.ORGANIZATION_ID),
                    s_org_name: take('s_org_name', cs.ORGANIZATION_NAME),
                    s_item_name:take('s_item_name',cs.ITEM_NAME),
                    s_prod_name:take('s_prod_name',cs.PRODUCT_NAME)
                };
                const cleanSearch = {};
                Object.keys(searchParams).forEach(k => { if(searchParams[k]) cleanSearch[k] = searchParams[k]; });

                const isGrouped = groupByLedger.length > 0;
                const isSearched = Object.keys(cleanSearch).length > 0;
                // Skip COUNT: chỉ đổi trang (page>1) khi filter không đổi — frontend biết total
                const extras = {};
                if (targetPage > 1 && targetPageSize === filters.page_size && pagination.total_rows > 0) {
                    extras.known_total = pagination.total_rows;
                    extras.known_deb   = summary.total_debit;
                    extras.known_crd   = summary.total_credit;
                }

                // Construct query parameters conditionally
                const query = new URLSearchParams();
                Object.keys(filters).forEach(k => {
                    if (k === 'page_size') {
                        query.set(k, targetPageSize);
                    } else if (k === 'page') {
                        query.set(k, targetPage);
                    } else if (Array.isArray(filters[k])) {
                        query.set(k, filters[k].join(','));
                    } else {
                        query.set(k, filters[k]);
                    }
                });
                Object.keys(cleanSearch).forEach(k => { query.set(k, cleanSearch[k]); });
                Object.keys(extras).forEach(k => { query.set(k, extras[k]); });
                
                if (ledgerSort.field) { query.set('order_by', ledgerSort.field); query.set('order_dir', ledgerSort.dir); }

                try {
                    const r = await fetch(`/api/ledger?${query.toString()}`, { signal: abortRef.current.signal });
                    if (r.status === 401) { setIsLoggedIn(false); return; }
                    const res = await r.json();
                    if (res.status === 'ok') {
                        setData(res.data);
                        setPagination(res.pagination);
                        setSummary(res.summary);
                        setFilters(p => ({ ...p, page: targetPage, page_size: targetPageSize }));
                    } else {
                        alert('Lỗi truy vấn LEDGER:\n\n' + (res.message || JSON.stringify(res)));
                    }
                } catch (err) {
                    if (err.name === 'AbortError' || _ctrl.signal.aborted) return; // Request bị hủy — bình thường, bỏ qua
                    alert('Lỗi kết nối API LEDGER:\n\n' + err.message);
                } finally { setLoading(false); }
            };

            
            // Reload khi sort đổi
            useEffect(() => {
                if (isLoggedIn && activeTab === 'ledger') loadData(1, filters.page_size);
            }, [ledgerSort]);
            

            // ============ PURCHASE TAB STATE & LOADER ============
            const [purchaseData, setPurchaseData] = useState([]);
            const [purchasePagination, setPurchasePagination] = useState({ total_rows: 0, total_pages: 1, page: 1 });
            const [purchaseSummary, setPurchaseSummary] = useState({ quantity: 0, quantity_wh: 0, discount: 0, vat_tax: 0, total: 0 });
            const [purchaseColSearch, setPurchaseColSearch] = useState({});
            const [purchaseFilters, setPurchaseFilters] = useState({ wh_ids: [], tran_no_search: '' });
            
            // PURCHASE VIRTUAL SCROLL & GROUPING
            const purchaseFlatData = useMemo(() => {
                let filteredData = purchaseData;
                const searchKeys = Object.keys(purchaseColSearch).filter(k => (purchaseColSearch[k] || '').trim() !== '');
                if (searchKeys.length > 0) {
                    filteredData = filteredData.filter(row => {
                        return searchKeys.every(k => {
                            const val = String(row[k] || '').toLowerCase();
                            const query = purchaseColSearch[k].trim().toLowerCase();
                            return val.includes(query);
                        });
                    });
                }
                return buildGroupedData(filteredData, groupByPurchase, ['TOTAL_AMOUNT']);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [purchaseData, groupByPurchase, toggleGroupRenderPurchase, purchaseColSearch]);
            
            const purchaseRowHeight = 28;
            const purchaseVS = useVirtualScroll(purchaseFlatData, purchaseRowHeight, purchaseScrollRef);

            const handleTogglePurchaseGroup = (id) => {
                expandState.set(id, !(expandState.has(id) ? expandState.get(id) : true));
                setToggleGroupRenderPurchase(v => v + 1);
            };


            // ============ SALE TAB STATE & LOADER ============
            const [groupBySale, setGroupBySale] = useState([]);
            const [toggleGroupRenderSale, setToggleGroupRenderSale] = useState(0);
            const saleScrollRef = useRef();
            const [saleSort, setSaleSort] = useState({ field: null, dir: 'desc' });
            const [saleData, setSaleData] = useState([]);
            const [salePagination, setSalePagination] = useState({ total_rows: 0, total_pages: 1, page: 1 });
            const [saleSummary, setSaleSummary] = useState({ quantity: 0, amount: 0, discount: 0, vat_tax: 0, total: 0, cog: 0 });
            const [saleColSearch, setSaleColSearch] = useState({});
            const [saleFilters, setSaleFilters] = useState({ wh_ids: [], tran_no_search: '', is_return: '' });
            const [saleLoading, setSaleLoading] = useState(false);
            const debouncedSaleColSearch = useDebounce(saleColSearch, 400);

            const saleFlatData = useMemo(() => {
                let filteredData = saleData;
                const searchKeys = Object.keys(saleColSearch).filter(k => (saleColSearch[k] || '').trim() !== '');
                if (searchKeys.length > 0) {
                    filteredData = filteredData.filter(row => {
                        return searchKeys.every(k => {
                            const val = String(row[k] || '').toLowerCase();
                            const query = saleColSearch[k].trim().toLowerCase();
                            return val.includes(query);
                        });
                    });
                }
                return buildGroupedData(filteredData, groupBySale, ['TOTAL_AMOUNT']);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [saleData, groupBySale, toggleGroupRenderSale, saleColSearch]);

            const saleRowHeight = 28;
            const saleVS = useVirtualScroll(saleFlatData, saleRowHeight, saleScrollRef);

            const handleToggleSaleGroup = (id) => {
                expandState.set(id, !(expandState.has(id) ? expandState.get(id) : true));
                setToggleGroupRenderSale(v => v + 1);
            };

            const toggleSaleFilter = (key, id) => {
                setSaleFilters(p => {
                    if (Array.isArray(p[key])) return { ...p, [key]: p[key].includes(id) ? p[key].filter(x=>x!==id) : [...p[key], id] };
                    return { ...p, [key]: id };
                });
            };

            // Đặt = 0 để mọi lần "1 sheet" đều đi đường server stream → không còn giới hạn 500.000 dòng.
            const SERVER_STREAM_THRESHOLD = 0;

            const colLetter = (idx) => {

                idx = idx + 1;
                while (idx > 0) {
                    const m = (idx - 1) % 26;
                    s = String.fromCharCode(65 + m) + s;
                    idx = Math.floor((idx - 1) / 26);
                }
                return s;

            // Trả về ws object dạng {!ref, A1:{v,t}, ...} compatible XLSX writer.
            const buildSheetManual = async (cols, rows, extractor, onProgress) => {
                const headers = cols.map(([_, label]) => label);
                const truncate = rows.length > EXCEL_MAX_ROWS;
                const useRows = truncate ? rows.slice(0, EXCEL_MAX_ROWS) : rows;
                const ws = {};
                const nCols = headers.length;
                const nRows = useRows.length + 1; // +header

                // Header row
                for (let c = 0; c < nCols; c++) {
                    ws[colLetter(c) + '1'] = { v: headers[c], t: 's' };
                }

                const CHUNK = 10000;
                for (let i = 0; i < useRows.length; i++) {
                    const arr = extractor(useRows[i]);
                    const rowExcel = i + 2; // 1-based, +header
                    for (let c = 0; c < nCols; c++) {
                        const v = arr[c];
                        if (v === '' || v == null) continue; // skip empty cell
                        const ref = colLetter(c) + rowExcel;
                        if (typeof v === 'number') ws[ref] = { v, t: 'n' };
                        else                       ws[ref] = { v: String(v), t: 's' };
                    }
                    if (i > 0 && i % CHUNK === 0) {
                        if (onProgress) onProgress(i, useRows.length);
                        await yieldToUI();
                    }
                }
                if (onProgress) onProgress(useRows.length, useRows.length);

                ws['!ref'] = `A1:${colLetter(nCols - 1)}${nRows}`;
                return { ws, truncated: truncate ? rows.length - EXCEL_MAX_ROWS : 0 };

                    const res = await r.json();
                    if (res.status !== 'ok' || !res.job_id) {
                        alert('Lỗi khởi tạo job xuất: ' + (res.message || 'unknown'));
                        return;
                    }
                    const jobId = res.job_id;
                    // Poll status mỗi 500ms cho đến khi done/error
                    while (true) {
                        await new Promise(r => setTimeout(r, 500));
                        const sr = await fetch(`/api/export/status?job_id=${jobId}`);
                        if (sr.status === 404) { alert('Job đã bị xóa.'); break; }
                        const sj = await sr.json();
                        setExportProgress({ phase: 'stream', current: sj.current || 0, total: sj.total || total });
                        if (sj.status === 'done') {
                            setExporting(false);
                            setExportProgress(null);
                            setExportDone({ file_path: sj.file_path, filename: sj.filename, total: sj.current });
                            break;
                        }
                        if (sj.status === 'error') {
                            alert('Lỗi xuất CSV: ' + (sj.error || ''));
                            break;
                        }
                    }
                } catch (err) {
                    alert('Lỗi: ' + err.message);
                } finally {
                    setExporting(false);
                    setExportProgress(null);
                }
            };

            const openExportedFile = async (path) => {
                try {
                    const r = await fetch('/api/open_file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path })
                    });
                    const j = await r.json();
                    if (j.status !== 'ok') alert('Không mở được file: ' + (j.message || ''));
                } catch (e) { alert('Lỗi: ' + e.message); }
            };
            const openExportedFolder = async (path) => {
                try {
                    const r = await fetch('/api/open_folder', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path })
                    });
                    const j = await r.json();
                    if (j.status !== 'ok') alert('Không mở được folder: ' + (j.message || ''));
                } catch (e) { alert('Lỗi: ' + e.message); }
            };

            const doExport = async (kind, mode, format = 'xlsx') => {
                // kind: 'ledger' | 'purchase' | 'warehouse' | 'sale' | 'voucher' ; mode: 'single' | 'by_org' ; format: 'xlsx' | 'csv'
                if (typeof XLSX === 'undefined' && mode === 'by_org') { alert('Thư viện XLSX chưa tải được. Vui lòng kiểm tra kết nối.'); return; }
                setExporting(true);
                setExportOpen(null);
                setExportProgress({ phase: 'fetch', current: 0, total: 0 });
                try {
                    // ===== BƯỚC 1: Lấy số dòng trước =====
                    const countQuery = buildExportQuery(kind);
                    const countRes = await fetch(`/api/${kind}/count?${countQuery.toString()}`).then(r => r.json()).catch(() => null);
                    const totalRows = countRes && countRes.status === 'ok' ? countRes.total : 0;

                    if (!totalRows) {
                        alert('Không có dữ liệu để xuất.');
                        setExporting(false);
                        setExportProgress(null);
                        return;
                    }

                    // ===== BƯỚC 2: SERVER-SIDE STREAM EXPORT CHO MỌI ĐƠN FILE (xlsx hoặc csv) =====
                    // Luôn chạy ngầm server background job → có tiến trình 0-100% + modal Mở file / Mở folder khi xong
                    if (mode === 'single') {
                        await startServerExport(kind, totalRows, format);
                        return;
                    }

                    // ===== BƯỚC 3: client-side xlsx multi-sheet (by_org) =====
                    let url;
                    if (kind === 'ledger') {
                        url = `/api/ledger/export?${countQuery.toString()}`;
                    } else if (kind === 'purchase') {
                        url = `/api/purchase?${buildPurchaseQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'sale') {
                        url = `/api/sale?${buildSaleQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'voucher') {
                        url = `/api/voucher?${buildVoucherQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'warehouse_balance') {
                        url = `/api/warehouse_balance?${buildWarehouseBalanceQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'btp_reconcile') {
                        url = `/api/btp_reconcile?${buildBtpQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'dcnb_reconcile') {
                        url = `/api/dcnb_reconcile?${buildDcnbQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'po_list') {
                        url = `/api/po_list?${buildPoQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else {
                        url = `/api/warehouse?${buildWarehouseQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    }

                    setExportProgress({ phase: 'fetch', current: 0, total: totalRows });
                    const r = await fetch(url);
                    if (r.status === 401) { setIsLoggedIn(false); return; }
                    const res = await r.json();
                    if (res.status !== 'ok') { alert('Lỗi xuất Excel: ' + (res.message || '')); return; }
                    const rows = res.data || [];
                    if (!rows.length) { alert('Không có dữ liệu để xuất.'); return; }

                    const colsGoc = kind === 'ledger' ? LEDGER_EXPORT_COLS
                               : kind === 'purchase' ? PURCHASE_EXPORT_COLS
                               : kind === 'sale' ? SALE_EXPORT_COLS
                               : kind === 'voucher' ? VOUCHER_EXPORT_COLS
                               : kind === 'warehouse_balance' ? WAREHOUSE_BALANCE_EXPORT_COLS
                               : kind === 'btp_reconcile' ? BTP_EXPORT_COLS
                               : kind === 'dcnb_reconcile' ? DCNB_EXPORT_COLS
                               : kind === 'po_list' ? PO_EXPORT_COLS
                               : WAREHOUSE_EXPORT_COLS;
                    // Bỏ cột đang ẩn trên màn hình (Đại Ca chốt 25/09: Excel xuất đúng các cột đang hiện).
                    const boXuat = new Set(anXuat(kind));
                    const cols = colsGoc.filter(([k]) => !boXuat.has(k));
                    const extractor = kind === 'ledger' ? (r) => extractLedgerRow(r, cols) : (r) => extractRowGeneric(cols, r);

                    const prefix = kind === 'ledger' ? 'ChungTuTongHop_' : (kind === 'purchase' ? 'PhieuNhapKho_' : (kind === 'sale' ? 'ChungTuBanHang_' : (kind === 'voucher' ? 'ChungTuTien_' : (kind === 'warehouse_balance' ? 'TonKhoThucTe_' : (kind === 'btp_reconcile' ? 'DoiChieuXuatSX_NhapTP_' : (kind === 'dcnb_reconcile' ? 'DoiChieuDieuChuyenNoiBo_' : (kind === 'po_list' ? 'DanhSachPO_' : 'ChungTuKho_')))))));
                    const fname = prefix + filters.from_date.replace(/\//g,'') + '-' + filters.to_date.replace(/\//g,'') + '.xlsx';

                    setExportProgress({ phase: 'build', current: 0, total: rows.length });
                    await yieldToUI();

                    const wb = XLSX.utils.book_new();

                    // Group theo ORGANIZATION_ID
                    const groups = new Map();
                    for (let i = 0; i < rows.length; i++) {
                        const id = (rows[i].ORGANIZATION_ID || '').toString().trim() || '__NONE__';
                        let g = groups.get(id);
                        if (!g) { g = []; groups.set(id, g); }
                        g.push(rows[i]);
                    }
                    const onm = orgNameMap();
                    const ids = [...groups.keys()].sort();
                    if (!ids.length) { alert('Không có dữ liệu để xuất.'); return; }

                    // Cảnh báo nếu có sheet con vượt PER_SHEET_WARN
                    const oversize = ids.filter(id => groups.get(id).length > PER_SHEET_WARN);
                    if (oversize.length) {
                        alert(
                            `Cảnh báo: ${oversize.length} đơn vị có dữ liệu vượt ${PER_SHEET_WARN.toLocaleString()} dòng — có thể gây nặng khi mở.\n\n` +
                            `Tiếp tục xuất bình thường, nhưng nên thu hẹp khoảng ngày.`
                        );
                    }

                    let done = 0;
                    for (const id of ids) {
                        const grp = groups.get(id);
                        const { ws } = await buildSheetManual(cols, grp, extractor, (c) => {
                            setExportProgress({ phase: 'build', current: done + c, total: rows.length });
                        });
                        const orgName = id === '__NONE__' ? 'Khac' : (onm[id] || id);
                        XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName(`${id}-${orgName}`));
                        done += grp.length;
                        setExportProgress({ phase: 'build', current: done, total: rows.length });
                        await yieldToUI();
                    }

                    setExportProgress({ phase: 'write', current: rows.length, total: rows.length });
                    await yieldToUI();

                    // Dùng XLSX.write + Blob → tránh writeFile internal heavy enumeration
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
                    const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fname;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 100);
                } catch (err) {
                    alert('Lỗi xuất Excel: ' + (err && err.message ? err.message : String(err)));
                } finally {
                    setExporting(false);
                    setExportProgress(null);
                }
            };

            const ExportButton = ({ kind }) => {
                const ref = useRef(null);
                useEffect(() => {
                    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setExportOpen(null); };
                    if (exportOpen === kind) document.addEventListener('mousedown', onDown);
                    return () => document.removeEventListener('mousedown', onDown);
                }, [exportOpen]);
                return (
                    <div className="relative shrink-0" ref={ref}>
                        <button

                            title={exporting ? 'Đang xuất...' : 'Xuất Excel — chỉ các cột đang hiện'} aria-label="Xuất Excel" aria-haspopup="menu" aria-expanded={exportOpen === kind}
                            className={`h-[32px] pl-2.5 pr-2 rounded-lg border flex items-center gap-1 shrink-0 transition-colors disabled:opacity-60 ${exportOpen === kind ? 'border-emerald-400 bg-emerald-50 text-emerald-800' : 'border-slate-200 bg-white text-emerald-700 hover:border-emerald-300'}`}
                        >
                            {/* Thu thành ô icon 32px như mẫu iPOS (25/09/2026) — menu chọn kiểu xuất bên dưới giữ nguyên */}
                            {exporting ? <Icon name="loader" className="animate-spin" size={15}/> : <Icon name="file-spreadsheet" size={15} strokeWidth="2"/>}
                            <Icon name="chevron-down" size={11} className={`transition-transform ${exportOpen === kind ? 'rotate-180' : ''}`} />
                        </button>
                        {exportOpen === kind && (
                            <div className="absolute top-full right-0 mt-2 w-72 bg-white rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] border border-slate-200 z-[600] overflow-hidden animate-fadeIn">
                                <div className="px-4 py-3 bg-emerald-50/50 border-b border-emerald-100">
                                    <div className="text-[9px] font-black text-emerald-700 uppercase tracking-widest">Chọn kiểu & định dạng xuất</div>
                                </div>
                                <button onClick={() => doExport(kind, 'single', 'xlsx')} className="w-full text-left px-4 py-3 hover:bg-emerald-50/60 transition-all border-b border-slate-100 flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-black text-[10px] shrink-0">XLSX</div>
                                    <div>
                                        <div className="text-[12px] font-black text-slate-800">Xuất Excel (.xlsx)</div>
                                        <div className="text-[10px] font-bold text-slate-400 mt-0.5">Định dạng Excel chuẩn đẹp · Hiện tiến trình & Mở file</div>
                                    </div>
                                </button>
                                <button onClick={() => doExport(kind, 'single', 'csv')} className="w-full text-left px-4 py-3 hover:bg-blue-50/60 transition-all border-b border-slate-100 flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center font-black text-[10px] shrink-0">CSV</div>
                                    <div>
                                        <div className="text-[12px] font-black text-slate-800">Xuất CSV (.csv)</div>
                                        <div className="text-[10px] font-bold text-slate-400 mt-0.5">Định dạng CSV nhẹ · Tải siêu tốc</div>
                                    </div>
                                </button>
                                <button onClick={() => doExport(kind, 'by_org')} className="w-full text-left px-4 py-3 hover:bg-indigo-50/60 transition-all flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center font-black text-[10px] shrink-0">ORG</div>
                                    <div>
                                        <div className="text-[12px] font-black text-slate-800">Tách sheet theo đơn vị (.xlsx)</div>
                                        <div className="text-[10px] font-bold text-slate-400 mt-0.5">Mỗi đơn vị 1 sheet trong 1 file Excel</div>
                                    </div>
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            const loadReportData = async (pageArg, modeArg) => {
                // pageArg là số -> nhảy thẳng tới trang đó (dùng cho pager). Không phải số (vd event) -> dùng filters.page.
                const _page = (typeof pageArg === 'number' && pageArg > 0) ? pageArg : filters.page;
                if (typeof pageArg === 'number' && pageArg !== filters.page) setFilters(f => ({ ...f, page: pageArg }));
                if (abortRef.current) abortRef.current.abort();
                // BC008 (sổ chi tiết) bắt buộc chọn tài khoản
                if (reportType === 'BC008' && filters.acc_ids.length === 0) {
                    alert('Vui lòng chọn Tài khoản để xem Sổ chi tiết tài khoản.');
                    return;
                }
                // BC013 (tổng hợp công nợ) bắt buộc chọn tài khoản
                if (reportType === 'BC013' && filters.acc_ids.length === 0) {
                    alert('Vui lòng chọn Tài khoản để xem báo cáo tổng hợp công nợ.');
                    return;
                }
                const _ctrl = new AbortController(); abortRef.current = _ctrl;
                setLoading(true);
                // BC007/BC008/BC014 render dạng bảng thường (không ảo hoá) → giới hạn 1000 dòng/trang
                // cho mượt, dùng nút phân trang để xem tiếp (xuất Excel vẫn lấy toàn bộ).
                const rptPageSize = reportType === 'BC015' ? Math.min(filters.page_size, 500)
                    : (reportType === 'BC007' || reportType === 'BC008' || reportType === 'BC014') ? Math.min(filters.page_size, 1000)
                    : filters.page_size;
                const query = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), job_ids: filters.job_ids.join(','), page: _page, page_size: rptPageSize });
                try {
                    if (reportType === 'BC006') {
                        const r = await fetch(`/api/trial_balance?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setTrialBalanceData(res.data);
                            setTrialBalanceTotal(res.total);
                        }
                    } else if (reportType === 'BC005') {
                        const r = await fetch(`/api/balance_sheet?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res.data);
                            setMonthList([]);
                            setMonthlyData({});
                            setJobList([]);
                            setJobData({});
                        }
                    } else if (reportType === 'BC007') {
                        const r = await fetch(`/api/journal?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res);
                        }
                    } else if (reportType === 'BC008') {
                        const r = await fetch(`/api/account_details?${query.toString()}&account_id=${filters.acc_ids.join(',')}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res);
                        } else {
                            alert('Lỗi xem Sổ chi tiết: ' + (res.message || 'không có dữ liệu'));
                        }
                    } else if (reportType === 'BC011') {
                        const r = await fetch(`/api/cash_flow_cl?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res.data);
                            setMonthList([]);
                            setMonthlyData({});
                            setJobList([]);
                            setJobData({});
                        } else {
                            alert('Lỗi tải BC011: ' + (res.message || 'không có dữ liệu'));
                        }
                    } else if (reportType === 'BC013') {
                        const q2 = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), acc_ids: filters.acc_ids.join(','), pr_detail_ids: filters.pr_detail_ids.join(',') });
                        const r = await fetch(`/api/debt_summary?${q2.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setTrialBalanceData(res.data);
                            setTrialBalanceTotal(res.total);
                        } else {
                            alert('Lỗi xem báo cáo công nợ: ' + (res.message || 'không có dữ liệu'));
                        }
                    } else if (reportType === 'BC014') {
                        const activeMode = modeArg || vatSalesMode || 'detail';
                        const q2 = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), acc_ids: filters.acc_ids.join(','), mode: activeMode, page: _page, page_size: rptPageSize });
                        const r = await fetch(`/api/vat_sales_report?${q2.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();

                            alert('Lỗi xem bảng kê bán ra: ' + (res.message || 'không có dữ liệu'));

                    } else if (reportType === 'BC015') {
                        // modeArg phải truyền qua tham số: state vừa setSaleSourceMode chưa kịp cập nhật
                        // trong closure này (bẫy stale closure đã trả giá ở BC014).
                        const activeMode = modeArg || saleSourceMode || 'summary';

                        const r = await fetch(`/api/sale_by_source?${q2.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }

                        const gb = modeArg || nxtGroupBy || 'class';
                        // 1000 dòng chi tiết/trang. Gom theo kho ra 5.700–9.400 dòng × ~50 cột: trả hết
                        // một lượt là ~6 MB JSON và vài trăm nghìn ô DOM → treo trình duyệt.
                        // Nhóm bị cắt ngang trang vẫn đúng số vì tổng nhóm là tổng đầy đủ (xem /api/nxt).
                        const q2 = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), group_by: gb, page: _page, page_size: 1000 });
                        const r = await fetch(`/api/nxt?${q2.toString()}`, { signal: abortRef.current.signal });

                    } else if (reportType === 'BC009' || reportType === 'BC010') {
                        const r = await fetch(`/api/cash_flow?${query.toString()}&report=${reportType}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {

                            setMonthList([]); setMonthlyData({}); setJobList([]); setJobData({});

                    } else if (['BC002', 'BC004'].includes(reportType)) {
                        const r = await fetch(`/api/report_by_job?${query.toString()}&report=${reportType}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();

                            alert('Lỗi tải ' + reportType + ': ' + (res.message || 'không có dữ liệu'));

                    } else {
                        // BC001 và BC003
                        const r = await fetch(`/api/report?${query.toString()}&report=${reportType}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
                            setReportData(res.data);
                            setMonthList(res.month_list || []);
                            setMonthlyData(res.monthly || {});
                        } else {
                            alert('Lỗi tải ' + reportType + ': ' + (res.message || 'không có dữ liệu'));
                        }
                    }
                } catch (err) {
                    if (err.name === 'AbortError' || _ctrl.signal.aborted) return;
                } finally { setLoading(false); }
            };

            
            // LEDGER VIRTUAL SCROLL & GROUPING
            const ledgerFlatData = useMemo(() => {
                let filteredData = data;
                const searchKeys = Object.keys(colSearch).filter(k => (colSearch[k] || '').trim() !== '');
                if (searchKeys.length > 0) {
                    filteredData = filteredData.filter(row => {
                        return searchKeys.every(k => {
                            const val = String(row[k] || '').toLowerCase();
                            const query = colSearch[k].trim().toLowerCase();
                            return val.includes(query);
                        });
                    });
                }
                return buildGroupedData(filteredData, groupByLedger, ['DEBIT', 'CREDIT']);
                // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [data, groupByLedger, toggleGroupRender, colSearch]);
            
            const ledgerRowHeight = 28; // Chiều cao thực tế của <tr> không đổi theo filtersExpanded
            const ledgerVS = useVirtualScroll(ledgerFlatData, ledgerRowHeight, ledgerScrollRef);

            const handleToggleLedgerGroup = (id) => {
                expandState.set(id, !(expandState.has(id) ? expandState.get(id) : true));
                setToggleGroupRender(v => v + 1);
            };

            const toggleFilter = (key, id) => {
                if (key === 'from_date' || key === 'to_date') {
                    setFilters(p => ({ ...p, [key]: id }));
                } else {
                    setFilters(p => ({ ...p, [key]: p[key].includes(id) ? p[key].filter(x => x!==id) : [...p[key], id] }));
                }
            };

            // Danh sach "Loai CT" RIENG cho tung tab — backend tra ve meta.tran_ids_by_tab
            // (nguon dbo.SYS_TRAN, phan theo OUTPUT_FORM + IS_SALE, hop them ma thuc su co
            // trong VIEW ma tab do doc: SALE_VIEW / PURCHASE_VIEW / WAREHOUSE_VIEW / VOUCHER).
            // Do 15/09/2026 tren IACC_CHULONG: tab Chung tu tien chi co 9 ma that, tab Ban hang 8,
            // tab Mua hang 5 — nhung ban cu hien ca 39 ma cua LEDGER cho ca 5 tab.
            // Fallback ve meta.tran_ids de van chay duoc voi ban server cu.
            const tranItemsFor = (tab) => {
                const scoped = (meta.tran_ids_by_tab && meta.tran_ids_by_tab[tab]) || meta.tran_ids || [];
                // Ma dang duoc chon o tab khac phai van hien ra, khong thi nguoi dung
                // thay "1 muc" ma khong biet la muc nao, cung khong bo chon duoc.
                const missing = (filters.tran_ids || []).filter(id => !scoped.some(i => i.id === id));
                if (!missing.length) return scoped;
                const all = meta.tran_ids || [];
                return scoped.concat(missing.map(id => all.find(i => i.id === id) || { id, name: id }));
            };

            // ===== THANH LỌC 9 MÀN DANH SÁCH (Đại Ca chốt 25/09/2026, theo mẫu iPOS "Đặt mua hàng") =====
            // Cùng khuôn Báo cáo TC: ô Thời gian gộp luôn ở ngoài + tối đa 2 ô khác = TỔNG 3 ô (danh sách chật
            // hơn báo cáo vì còn nút Lọc / Excel), phần còn lại vào Bộ lọc nâng cao. Thứ tự khai dưới đây =
            // thứ tự MẶC ĐỊNH (giữ đúng hàng 1 của bản cũ). Nhớ riêng từng màn, trên máy ('lr_loc_ngoai_ds_<tab>').
            // ⛔ Thêm ô lọc cho danh sách thì khai trong oLocDs — đừng viết thẳng vào hàng điều kiện.
            const TOI_DA_O_NGOAI_DS = 3;
            const [cauHinhLocDs, setCauHinhLocDs] = useState({});

            // ===== CẤU HÌNH CỘT 9 BẢNG DANH SÁCH: ẩn/hiện + kéo giãn (Đại Ca chốt 25/09/2026) =====
            // { [tab]: { an: [khoá cột đang ẩn], rong: { khoá: px } } } — nhớ riêng từng màn, TRÊN MÁY ('lr_cot_<tab>').
            // Ẩn cột = CSS :nth-child theo vị trí trong COT_BANG; dòng gom nhóm (.dong-nhom) và dòng tổng tự tính
            // lại colSpan qua hienCot / nhipCot. Excel (cả xuất 1 file ở máy chủ lẫn chia sheet) bỏ đúng các cột đang ẩn.
            const [cauHinhCot, setCauHinhCot] = useState(() => {
                const o = {};
                Object.keys(COT_BANG).forEach(tab => {
                    try {
                        const v = JSON.parse(localStorage.getItem('lr_cot_' + tab) || 'null');
                        if (v) o[tab] = { an: Array.isArray(v.an) ? v.an : [], rong: (v.rong && typeof v.rong === 'object') ? v.rong : {} };
                    } catch (e) { /* ẩn danh / hỏng: về mặc định */ }
                });
                return o;
            });
            const cauHinhCotRef = useRef(cauHinhCot);
            cauHinhCotRef.current = cauHinhCot;
            const luuCot = (tab, moi) => {
                setCauHinhCot(p => ({ ...p, [tab]: moi }));
                try { localStorage.setItem('lr_cot_' + tab, JSON.stringify(moi)); } catch (e) { /* vẫn chạy, chỉ không nhớ */ }
            };
            const anCot = (tab) => new Set(((cauHinhCot[tab] || {}).an || []).filter(k => k !== '_stt'));   // cột # không bao giờ ẩn
            const hienCot = (tab, i) => { const c = COT_BANG[tab]; return !c || !c[i] || !anCot(tab).has(c[i][0]); };
            const nhipCot = (tab, a, b) => { let n = 0; for (let i = a; i <= b; i++) if (hienCot(tab, i)) n++; return n; };
            const cotCua = (tab) => ({ hien: (i) => hienCot(tab, i), nhip: (a, b) => nhipCot(tab, a, b) });
            // Khoá cột FILE XUẤT tương ứng các cột đang ẩn (một cột màn hình có thể = 2 cột file: mã + tên).
            const anXuat = (tab) => { const s = anCot(tab); return (COT_BANG[tab] || []).filter(c => s.has(c[0])).flatMap(c => c[3]); };
            const cssCot = Object.keys(COT_BANG).map(tab => {
                const c = cauHinhCot[tab]; if (!c) return '';
                const an = new Set(c.an || []), rong = c.rong || {}, b = `table[data-bang="${tab}"]`;
                return COT_BANG[tab].map(([k], i) => {
                    const n = i + 1;
                    if (an.has(k) && k !== '_stt') return `${b}>thead>tr>:nth-child(${n}),${b}>tbody>tr:not(.dong-nhom)>:nth-child(${n}){display:none}`;
                    if (rong[k]) return `${b}>thead>tr:first-child>:nth-child(${n}){width:${rong[k]}px;min-width:${rong[k]}px}`;
                    return '';
                }).join('');
            }).join('');
            // Kéo mép phải tiêu đề cột để đổi độ rộng; bấm đúp mép để về độ rộng gốc. Bảng tự nở theo nội dung
            // (không cắt chữ) nên kéo HẸP chỉ tới mức vừa nội dung thì dừng — cố ý, để không mất số liệu.
            // Lúc đang kéo ghi thẳng vào <style id="cot-keo"> (không setState mỗi lần rê chuột — vẽ lại cả App sẽ giật);
            // thả chuột mới lưu vào state + máy.
            useEffect(() => {
                let keo = null, vuaKeo = false;
                const tim = (e) => {
                    const th = e.target && e.target.closest && e.target.closest('table[data-bang] > thead > tr:first-child > th');
                    if (!th || th.cellIndex <= 0) return null;
                    const r = th.getBoundingClientRect();
                    if (e.clientX < r.right - 6) return null;               // chỉ ăn ở dải mép phải
                    const bang = th.closest('table').dataset.bang, cot = (COT_BANG[bang] || [])[th.cellIndex];
                    return cot ? { th, bang, n: th.cellIndex + 1, khoa: cot[0], w0: r.width } : null;
                };
                const theTam = () => { let s = document.getElementById('cot-keo'); if (!s) { s = document.createElement('style'); s.id = 'cot-keo'; document.head.appendChild(s); } return s; };
                const xoaTam = () => { const s = document.getElementById('cot-keo'); if (s) s.textContent = ''; };
                const xuong = (e) => {
                    if (e.button !== 0) return;
                    const h = tim(e); if (!h) return;
                    e.preventDefault(); e.stopPropagation();
                    keo = { ...h, x0: e.clientX, w: Math.round(h.w0) };
                    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
                };
                const di = (e) => {
                    if (!keo) return;
                    keo.w = Math.max(40, Math.round(keo.w0 + e.clientX - keo.x0));
                    theTam().textContent = `table[data-bang="${keo.bang}"]>thead>tr:first-child>:nth-child(${keo.n}){width:${keo.w}px!important;min-width:${keo.w}px!important}`;
                };
                const len = () => {
                    if (!keo) return;
                    const { bang, khoa, w } = keo; keo = null; vuaKeo = true;
                    document.body.style.cursor = ''; document.body.style.userSelect = '';
                    const c = cauHinhCotRef.current[bang] || { an: [], rong: {} };
                    luuCot(bang, { ...c, rong: { ...(c.rong || {}), [khoa]: w } });
                    // ⚠️ Dọn thẻ tạm bằng setTimeout, KHÔNG dùng requestAnimationFrame: rAF không chạy khi trang đang ẩn
                    //    (chuyển cửa sổ đúng lúc thả chuột) ⇒ thẻ tạm còn "!important" đè mãi, bấm đúp cũng không về gốc
                    //    được (đã bắt được khi thử 25/09/2026).
                    setTimeout(xoaTam, 30);
                    setTimeout(() => { vuaKeo = false; }, 0);
                };
                // Thả chuột xong trình duyệt bắn 'click' lên tiêu đề ⇒ chặn ở pha capture, không thì cột bị sắp xếp.
                const bam = (e) => { if (vuaKeo) { e.preventDefault(); e.stopPropagation(); vuaKeo = false; } };
                const dup = (e) => {
                    const h = tim(e); if (!h) return;
                    e.preventDefault(); e.stopPropagation();
                    const c = cauHinhCotRef.current[h.bang] || { an: [], rong: {} };
                    const rong = { ...(c.rong || {}) }; delete rong[h.khoa];
                    xoaTam();
                    luuCot(h.bang, { ...c, rong });
                };
                const keoTha = (e) => { if (keo) e.preventDefault(); };   // tiêu đề kéo-thả để gom nhóm: đừng khởi động lúc đang giãn cột
                document.addEventListener('mousedown', xuong, true);
                document.addEventListener('mousemove', di, true);
                document.addEventListener('mouseup', len, true);
                document.addEventListener('click', bam, true);
                document.addEventListener('dblclick', dup, true);
                document.addEventListener('dragstart', keoTha, true);
                return () => {
                    document.removeEventListener('mousedown', xuong, true); document.removeEventListener('mousemove', di, true);
                    document.removeEventListener('mouseup', len, true); document.removeEventListener('click', bam, true);
                    document.removeEventListener('dblclick', dup, true); document.removeEventListener('dragstart', keoTha, true);
                };
            }, []);
            const oLocDs = (tab) => {
                const ds = (id, ten, nguon, gt, chon, xoa) => ({ id, ten, loai: 'ds', nguon: nguon || [], gt: gt || [], chon, xoa });
                const chung = (id, ten, khoa, nguon) => ds(id, ten, nguon, filters[khoa], v => toggleFilter(khoa, v), () => setFilters(p => ({ ...p, [khoa]: [] })));
                const soCt = (st, setSt) => ({ id: 'soct', ten: 'Số chứng từ', loai: 'go', gt: st.tran_no_search || '',
                    dat: v => setSt(p => ({ ...p, tran_no_search: v })), xoa: () => setSt(p => ({ ...p, tran_no_search: '' })) });
                const kho = (ten, st, toggle, setSt, khoa = 'wh_ids') => ds(khoa === 'wh_ids' ? 'kho' : 'kho_nhap', ten, meta.warehouses, st[khoa],
                    v => toggle(khoa, v), () => setSt(p => ({ ...p, [khoa]: [] })));
                const loaiCt = chung('loaict', 'Loại CT', 'tran_ids', tranItemsFor(tab));
                const donVi = (ten = 'Đơn vị') => chung('donvi', ten, 'org_ids', meta.orgs);
                const tk = chung('tk', 'Tài khoản', 'acc_ids', meta.accounts);
                const dt = chung('dt', 'Đối tượng', 'pr_detail_ids', meta.pr_details);
                const cv = chung('cv', 'Công việc', 'job_ids', meta.jobs);
                const mcp = chung('mcp', 'Mục chi phí', 'expense_ids', meta.expenses);
                const hh = (ten = 'Hàng hóa') => chung('hh', ten, 'item_ids', meta.items);
                const sp = chung('sp', 'Sản phẩm', 'product_ids', meta.products);
                switch (tab) {
                    case 'ledger':   return [loaiCt, donVi(), tk, dt, cv, mcp, hh(), sp];
                    case 'sale':     return [soCt(saleFilters, setSaleFilters), donVi(), loaiCt, kho('Kho', saleFilters, toggleSaleFilter, setSaleFilters), hh(), mcp, cv, dt];
                    case 'voucher':  return [soCt(voucherFilters, setVoucherFilters), donVi(), loaiCt, tk, dt, mcp, cv];
                    case 'purchase': return [loaiCt, donVi(), soCt(purchaseFilters, setPurchaseFilters), kho('Kho nhập', purchaseFilters, togglePurchaseFilter, setPurchaseFilters), hh(), mcp, cv, dt];
                    case 'warehouse': return [loaiCt, donVi(), soCt(warehouseFilters, setWarehouseFilters), kho('Kho', warehouseFilters, toggleWarehouseFilter, setWarehouseFilters), hh(), sp, mcp, cv, dt];
                    case 'warehouse_balance': return [donVi(), kho('Kho', warehouseBalanceFilters, toggleWarehouseBalanceFilter, setWarehouseBalanceFilters), hh(), tk];
                    case 'btp_reconcile': return [donVi(), kho('Kho xuất', btpFilters, toggleBtpFilter, setBtpFilters), hh('Nguyên liệu'),
                        ds('btp', 'Bán thành phẩm', meta.products, btpFilters.btp_ids, v => toggleBtpFilter('btp_ids', v), () => setBtpFilters(p => ({ ...p, btp_ids: [] })))];
                    case 'dcnb_reconcile': return [donVi('Đơn vị xuất'), kho('Kho xuất', dcnbFilters, toggleDcnbFilter, setDcnbFilters),
                        kho('Kho nhập', dcnbFilters, toggleDcnbFilter, setDcnbFilters, 'wh_nhap_ids'), hh('Hàng hoá')];
                    case 'po_list':  return [donVi(), kho('Kho', poFilters, togglePoFilter, setPoFilters), hh('Hàng hoá')];
                    default: return [];
                }
            };
            // Ô Thời gian chọn xong: tháng / quý / năm ⇒ period đúng loại; còn lại ⇒ 'custom' (giống Báo cáo TC).
            const datThoiGianDs = (a, b, ky) => {
                setPeriod(ky ? { year: ky.year, type: ky.type, value: ky.value } : { ...period, year: a.getFullYear(), type: 'custom', value: 1 });
                setFilters(p => ({ ...p, from_date: TG.dmy(a), to_date: TG.dmy(b) }));
            };
            // Hàm vẽ thường (KHÔNG phải component lồng — bài học OThoiGian): trái = kết quả + số dòng/trang;
            // phải = Thời gian + ô ngoài + phễu + Lọc + Excel. Nút cấu hình cột thêm ở chặng sau.
            const veHangLocDs = (tab, { onLoc, dangTai, tongDong }) => {
                const dsO = oLocDs(tab);
                const cfg = cauHinhLocDs[tab] || docCauHinhLoc('ds_' + tab, dsO.map(o => o.id), TOI_DA_O_NGOAI_DS);
                const luu = (moi) => {
                    setCauHinhLocDs(p => ({ ...p, [tab]: moi }));
                    try { localStorage.setItem('lr_loc_ngoai_ds_' + tab, JSON.stringify(moi)); } catch (e) { /* ẩn danh / bị chặn: vẫn chạy, chỉ không nhớ */ }
                };
                const tenO = {}; dsO.forEach(o => { tenO[o.id] = o.ten; });
                const coGt = (o) => !!o && (o.loai === 'go' ? !!String(o.gt || '').trim() : o.gt.length > 0);
                // ⚠️ Số trên nút phễu = ô ĐANG CÓ GIÁ TRỊ mà bị giấu trong bảng — bắt buộc, như Báo cáo TC.
                const soTrong = cfg.thuTu.filter(id => !cfg.ngoai.includes(id) && coGt(dsO.find(o => o.id === id))).length;
                const veO = (id, trongBang, canhPhai) => {
                    const o = dsO.find(x => x.id === id);
                    if (!o) return null;
                    const lop = trongBang ? '' : (o.loai === 'go' ? 'basis-36 min-w-[110px]' : 'basis-40 min-w-[120px]');
                    if (o.loai === 'go') return (
                        <div key={id} className={lop}>
                            <div className="label-text">{o.ten}</div>
                            <input value={o.gt} onChange={e => o.dat(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') onLoc(); }} placeholder="Nhập số chứng từ"
                                className="w-full h-[32px] px-3 rounded-lg border border-slate-200 text-[12px] text-slate-700 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400" />
                        </div>
                    );
                    return (
                        <div key={id} className={lop}>
                            <PremiumDropdown label={o.ten} items={o.nguon} selectedItems={o.gt} onSelect={o.chon} isActive={activeDropdown === o.ten} onToggle={setActiveDropdown} align={trongBang && !canhPhai ? 'left' : 'right'} />
                        </div>
                    );
                };
                return (
                    <div className="flex items-end gap-3">
                        <div className="flex items-end gap-4 mr-auto shrink-0">
                            <div>
                                <div className="label-text">Kết quả</div>
                                <div className="h-[32px] flex items-center text-[13px] font-bold text-slate-900 tabular-nums whitespace-nowrap">{Number(tongDong || 0).toLocaleString('vi-VN')}<span className="ml-1 text-[12px] font-normal text-slate-500">dòng</span></div>
                            </div>
                            <div>
                                <div className="label-text">Hiển thị</div>
                                <div className="h-[32px] flex items-center"><PageSizeDropdown value={filters.page_size} onChange={n => setFilters(p => ({ ...p, page_size: n, page: 1 }))} /></div>
                            </div>
                        </div>
                        <div className="flex items-end justify-end gap-3 min-w-0">
                            <div className="basis-[200px] min-w-[186px]"><OThoiGian period={period} fromDate={filters.from_date} toDate={filters.to_date} onChon={datThoiGianDs} isActive={activeDropdown === 'period'} onToggle={setActiveDropdown} /></div>
                            {cfg.thuTu.filter(id => cfg.ngoai.includes(id)).map(id => veO(id, false, true))}
                        </div>
                        <div className="flex items-end gap-1.5 shrink-0">
                            <BoLocNangCao cfg={cfg} onDoiCfg={luu} tenO={tenO} soDangLocTrong={soTrong} veO={veO} toiDa={TOI_DA_O_NGOAI_DS}
                                goiYThoiGian="Danh sách nào cũng cần kỳ — luôn hiện ngoài"
                                onXoaTatCa={() => dsO.forEach(o => o.xoa())} onXem={onLoc} nhanXem="Lọc" dangTai={dangTai} onMo={() => setActiveDropdown(null)} />
                            {/* Nút "Lọc" navy đặc — thay "TRUY VẤN" gradient navy→tím (Đại Ca chốt 25/09, đóng việc 17) */}
                            <button type="button" onClick={onLoc} disabled={dangTai}
                                className="h-[32px] px-4 rounded-lg bg-[#1e3a8a] hover:bg-[#172554] text-white text-[12px] font-bold flex items-center gap-1.5 disabled:opacity-60 shrink-0">
                                {dangTai && <Icon name="loader" size={12} className="animate-spin" />}Lọc
                            </button>
                            <CauHinhCot ds={COT_BANG[tab]} an={anCot(tab)} coDoiRong={Object.keys((cauHinhCot[tab] || {}).rong || {}).length > 0}
                                onDoi={an => luuCot(tab, { ...(cauHinhCot[tab] || { rong: {} }), an })} onMacDinh={() => luuCot(tab, { an: [], rong: {} })} />
                            <ExportButton kind={tab} />
                        </div>
                    </div>
                );
            };

            if (!isLoggedIn) {
                return (
                    <div className="h-screen bg-white flex flex-col relative overflow-hidden">
                        {!autoUpdate.dismissed && (
                            <AutoUpdateBanner
                                updateInfo={autoUpdate.updateInfo}
                                onStartUpdate={autoUpdate.startUpdate}
                                onDismiss={() => autoUpdate.setDismissed(true)}
                            />
                        )}
                        <div className="flex-1 flex relative overflow-hidden">

                            {/* Tam trai: navy, hoa tiet luoi 24px + hinh hoc. Khong dung do bong. */}
                            <div className="hidden lg:flex shrink-0 w-[480px] flex-col justify-between relative overflow-hidden"
                                 style={{ background: '#172554', backgroundImage: 'linear-gradient(#1e3a8a 1px, transparent 1px), linear-gradient(90deg, #1e3a8a 1px, transparent 1px)', backgroundSize: '24px 24px', padding: '52px' }}>
                                <div className="absolute rounded-full" style={{ top: '210px', right: '-120px', width: '300px', height: '300px', border: '1px solid #1e40af' }}></div>
                                <div className="absolute" style={{ top: '262px', right: '-68px', width: '196px', height: '196px', border: '1px solid #1e40af' }}></div>
                                <div className="absolute" style={{ bottom: '112px', left: '52px', width: '140px', height: '56px', backgroundImage: 'radial-gradient(#1e40af 1.4px, transparent 1.4px)', backgroundSize: '14px 14px' }}></div>

                                <div className="flex items-center gap-3 relative">
                                    <svg viewBox="0 0 200 200" className="h-[34px] w-[34px] shrink-0">
                                        <rect width="200" height="200" rx="45" fill="#FF9D3D"/>
