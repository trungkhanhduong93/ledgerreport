<!DOCTYPE html>
<html lang="vi">
<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
window.addEventListener("error", function(e) {
    console.error("GLOBAL ERROR:", e.error);
    var errDiv = document.createElement("div");
    errDiv.style = "color:red; background:white; padding:20px; z-index:999999; position:fixed; top:0; left:0; width:100%; border-bottom: 5px solid red; font-family: monospace; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);";
    errDiv.innerHTML = "<b>LỖI XẢY RA:</b> " + e.message + " <br><b>Tại file:</b> " + e.filename + " <br><b>Dòng:</b> " + e.lineno + ":" + e.colno + "<br><pre>" + (e.error && e.error.stack ? e.error.stack : '') + "</pre>";
    document.documentElement.appendChild(errDiv);
});
window.addEventListener("unhandledrejection", function(e) {
    console.error("UNHANDLED PROMISE:", e.reason);
    // Mất kết nối server (server tắt / chưa khởi động xong) -> báo tiếng Việt, KHÔNG đổ stack trace ra màn hình.
    if (window.isNetworkError(e.reason)) { window.showConnectionLost(); return; }
    var errDiv = document.createElement("div");
    errDiv.style = "color:red; background:white; padding:20px; z-index:999999; position:fixed; top:0; left:0; width:100%; border-bottom: 5px solid red; font-family: monospace; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);";
    errDiv.innerHTML = "<b>UNHANDLED PROMISE REJECTION:</b> " + e.reason + "<br><pre>" + (e.reason && e.reason.stack ? e.reason.stack : '') + "</pre>";
    document.documentElement.appendChild(errDiv);
});

// "Failed to fetch" = không gọi được server ở :5050 (EXE đã tắt, hoặc đang khởi động).
// Đây KHÔNG phải lỗi code -> hiện banner hướng dẫn thay vì stack trace debug.
window.isNetworkError = function(x) {
    return !!x && (x.name === "TypeError") && /fetch|network|load failed/i.test(String(x.message || ""));
};
window.showConnectionLost = function() {
    if (document.getElementById("conn-lost")) return;   // chỉ hiện 1 lần dù nhiều request cùng fail
    var d = document.createElement("div");
    d.id = "conn-lost";
    d.style = "position:fixed; inset:0; z-index:999999; background:rgba(15,23,42,.92); color:#fff; display:flex; align-items:center; justify-content:center; font-family:system-ui,Segoe UI,sans-serif;";
    d.innerHTML =
        '<div style="max-width:520px; text-align:center; padding:32px">' +
        '<div style="font-size:44px; margin-bottom:12px">⚠️</div>' +
        '<div style="font-size:20px; font-weight:800; letter-spacing:.5px; margin-bottom:10px">MẤT KẾT NỐI TỚI MÁY CHỦ</div>' +
        '<div style="font-size:14px; line-height:1.7; color:#cbd5e1">Ứng dụng không gọi được server (cổng 5050).<br>Thường do <b>đã tắt ứng dụng</b> nhưng cửa sổ này còn mở, hoặc server <b>chưa khởi động xong</b>.<br>Hãy bấm Thử lại, hoặc đóng cửa sổ này rồi mở lại ứng dụng.</div>' +
        '<button id="conn-lost-retry" style="margin-top:20px; padding:10px 22px; border:0; border-radius:10px; background:#4f46e5; color:#fff; font-weight:700; cursor:pointer">Thử lại</button>' +
        '</div>';
    document.documentElement.appendChild(d);
    var b = document.getElementById("conn-lost-retry");
    if (b) b.onclick = function() { location.reload(); };
};
</script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo, memo } = React;

        // ===== Global format helpers — tránh tạo closure mỗi render =====
        const fmtNum = (v, d = 2) => {
            if (v === null || v === undefined || v === '') return '';
            const n = Number(v);
            return Number.isFinite(n) ? n.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }) : '';
        };
        

        const fmtInt = (v) => {
            if (v === null || v === undefined || v === '') return '';
            const n = Number(v);
            return Number.isFinite(n) ? Math.round(n).toLocaleString('en-US') : '';
        };
        
        const { createPortal } = ReactDOM;


        // Chunked spacer rows for virtual scroll - splits large heights into multiple <tr>
        // to avoid browser ignoring large single-row heights in <table>
        // Dùng SVG làm spacer: SVG là replaced element, browser LUÔN respect height attribute
        // dù rất lớn (1M+ px) — tránh được trường hợp <tr style="height"> bị collapse trong table layout
        const VirtualSpacer = ({ height }) => {
            if (height <= 0) return null;
            return (
                <tr aria-hidden="true">
                    <td colSpan="100" style={{ padding: 0, border: 0, lineHeight: 0, fontSize: 0, verticalAlign: 'top' }}>
                        <svg width="1" height={height} style={{ display: 'block' }} aria-hidden="true" />
                    </td>
                </tr>
            );
        };

        function useVirtualScroll(dataArray, itemHeight, containerRef) {
            const totalItems = Array.isArray(dataArray) ? dataArray.length : (Number(dataArray) || 0);
            const [scrollTop, setScrollTop] = React.useState(0);
            const [containerHeight, setContainerHeight] = React.useState(() => (typeof window !== 'undefined' ? window.innerHeight : 800));
            // Chiều cao dòng THỰC TẾ đo từ DOM. Hằng số itemHeight truyền vào chỉ là ước lượng ban đầu;
            // dùng sai (vd 28 trong khi dòng thật ~20) làm topPadding/startIndex lệch tích lũy qua hàng nghìn
            // dòng → khối render trôi khỏi viewport → "trắng bên dưới". Đo thật để tự khớp mọi danh sách.
            const [rowH, setRowH] = React.useState(itemHeight);
            const calibRef = React.useRef(0);   // số lần đo liên tiếp đã khớp → ngừng đo (tránh reflow mỗi lần cuộn)
            React.useLayoutEffect(() => {
                const c = containerRef.current;
                if (!c) return;
                // GIỚI HẠN CỨNG số lần đo/1 dataset: dù dòng cao thấp lệch nhau cũng KHÔNG lặp setRowH vô hạn
                // -> chặn crash "Maximum update depth exceeded" (React ném ra 'Script error' qua CDN). Reset khi đổi data.
                if (calibRef.current > 12) return;
                calibRef.current += 1;
                const rows = [...c.querySelectorAll('tbody tr')].filter(tr => tr.children.length > 1);
                const hs = rows.slice(0, 16).map(tr => tr.getBoundingClientRect().height).filter(h => h > 4 && h < 200);
                if (hs.length) {
                    hs.sort((a, b) => a - b);
                    const med = hs[Math.floor(hs.length / 2)];   // trung vị: bền với dòng lẻ cao bất thường
                    if (med > 4 && Math.abs(med - rowH) > 0.5) setRowH(med);
                }
            });

            // Gắn scroll listener + ResizeObserver — KHÔNG phụ thuộc totalItems để tránh tear-down lặp
            React.useEffect(() => {
                const container = containerRef.current;
                if (!container) return;
                const handleScroll = () => setScrollTop(container.scrollTop);
                container.addEventListener('scroll', handleScroll, { passive: true });

                const measure = () => {
                    const h = container.clientHeight || container.getBoundingClientRect().height;
                    if (h > 0) setContainerHeight(h);
                };
                const ro = new ResizeObserver(() => measure());
                ro.observe(container);

                measure();
                const raf1 = requestAnimationFrame(measure);
                const raf2 = requestAnimationFrame(() => requestAnimationFrame(measure));
                const onResize = () => measure();
                window.addEventListener('resize', onResize);

                return () => {
                    container.removeEventListener('scroll', handleScroll);
                    ro.disconnect();
                    cancelAnimationFrame(raf1);
                    cancelAnimationFrame(raf2);
                    window.removeEventListener('resize', onResize);
                };
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [containerRef.current]);

            // Khi data đổi → reset scroll về đầu + đo lại để tránh state lệch DOM
            React.useLayoutEffect(() => {
                const container = containerRef.current;
                if (!container) return;
                container.scrollTop = 0;
                setScrollTop(0);
                calibRef.current = 0;   // data đổi → đo lại chiều cao dòng
                const h = container.clientHeight || container.getBoundingClientRect().height;
                if (h > 0) setContainerHeight(h);
            // eslint-disable-next-line react-hooks/exhaustive-deps
            }, [dataArray, containerRef]);

            const eff = rowH > 4 ? rowH : itemHeight;   // chiều cao dòng hiệu dụng (đo thật)
            const overscan = 50;
            let startIndex = Math.max(0, Math.floor(scrollTop / eff) - overscan);
            let endIndex = Math.min(totalItems - 1, Math.floor((scrollTop + containerHeight) / eff) + overscan);
            if(totalItems === 0) { startIndex=0; endIndex=-1; }

            const topPadding = startIndex * eff;
            const totalHeight = totalItems * eff;
            const bottomPadding = Math.max(0, totalHeight - (endIndex + 1) * eff);

            return { startIndex, endIndex, topPadding, bottomPadding, totalHeight };
        }

        // State global cho expand/collapse node
        const expandState = new Map();

        function buildGroupedData(rawData, groupCols, sumFields) {
            if (!groupCols || groupCols.length === 0) return rawData;
            const rootGroups = new Map();
            for(let i=0; i<rawData.length; i++) {
                const row = rawData[i];
                let currentMap = rootGroups;
                let parentKey = '';
                for(let j=0; j<groupCols.length; j++) {
                    const col = groupCols[j];
                    const val = row[col] || '(Trống)';
                    
                    let key = parentKey ? parentKey + '|' + val : val;
                    parentKey = key; // Save for next level

                    if (!currentMap.has(key)) {
                        let exp = expandState.has(key) ? expandState.get(key) : true;
                        currentMap.set(key, { id: key, name: val, col, level: j, sums: {}, children: [], map: new Map(), expanded: exp });
                        if(sumFields) sumFields.forEach(f => currentMap.get(key).sums[f] = 0);
                    }
                    const node = currentMap.get(key);
                    if(sumFields) {
                        if(row.DEBIT_CREDIT === 'DEB') node.sums.DEBIT = (node.sums.DEBIT || 0) + (parseFloat(row.AMOUNT) || 0);
                        if(row.DEBIT_CREDIT === 'CRD') node.sums.CREDIT = (node.sums.CREDIT || 0) + (parseFloat(row.AMOUNT) || 0);
                        if(row.TOTAL_AMOUNT) node.sums.TOTAL_AMOUNT = (node.sums.TOTAL_AMOUNT || 0) + (parseFloat(row.TOTAL_AMOUNT) || 0);
                        if(row.AMOUNT && row.DEBIT_CREDIT !== 'DEB' && row.DEBIT_CREDIT !== 'CRD') node.sums.AMOUNT = (node.sums.AMOUNT || 0) + (parseFloat(row.AMOUNT) || 0);
                    }
                    
                    if (j === groupCols.length - 1) {
                        node.children.push(row);
                    } else {
                        currentMap = node.map;
                    }
                }
            }
            const flat = [];
            const flatten = (map) => {
                for (const [key, node] of map.entries()) {
                    flat.push({ isGroup: true, ...node });
                    if (node.expanded) {
                        if (node.children.length > 0) {
                            for(let i = 0; i < node.children.length; i++) {
                                flat.push(node.children[i]);
                            }
                        }
                        else flatten(node.map);
                    }
                }
            };
            flatten(rootGroups);
            return flat;
        }

        const LedgerGroupRow = ({ node, toggleExpand }) => {
            return (
                <tr className={`border-b border-slate-200 font-bold text-[11px] cursor-pointer transition-colors ${node.level === 0 ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-indigo-50 text-indigo-900 hover:bg-indigo-100'}`} onClick={() => toggleExpand(node.id)}>
                    <td colSpan={8} className="px-4 py-1.5 border-r border-indigo-200/30 whitespace-nowrap">
                        <div className="flex items-center gap-2" style={{ paddingLeft: `${node.level * 20}px` }}>
                            <span className={`inline-flex items-center justify-center w-3 h-3 border rounded-sm font-mono text-[9px] leading-none ${node.level === 0 ? 'border-indigo-400 bg-indigo-500' : 'border-indigo-300 bg-white'}`}>
                                {node.expanded ? '-' : '+'}
                            </span>
                            <span>{node.col}: {node.name}</span>
                            <span className={`text-[10px] ml-2 ${node.level === 0 ? 'text-indigo-200' : 'text-indigo-400'}`}>({node.children ? node.children.length : 0} dòng)</span>
                        </div>

        // ==============================================================================
        // AUTO-UPDATE HOOK & COMPONENTS (iOS Glassmorphism Notification & Progress)
        // ==============================================================================
        const useAutoUpdate = () => {
            const [updateInfo, setUpdateInfo] = React.useState(null);
            const [dismissed, setDismissed] = React.useState(false);
            const [isUpdating, setIsUpdating] = React.useState(false);
            const [progress, setProgress] = React.useState({ progress: 0, status: 'idle', downloaded_bytes: 0, total_bytes: 0, error_message: '' });

            React.useEffect(() => {
                let alive = true;
                // Kiểm tra update ngầm sau khi app mở 1 giây
                const timer = setTimeout(() => {
                    fetch('/api/check_update')
                        .then(r => r.json())
                        .then(data => {
                            if (alive && data && data.has_update) {
                                setUpdateInfo(data);
                            }
                        })
                        .catch(() => {});
                }, 1000);

                return () => { alive = false; clearTimeout(timer); };
            }, []);

            const startUpdate = async () => {
                setIsUpdating(true);
                setProgress({ progress: 0, status: 'downloading', downloaded_bytes: 0, total_bytes: 0, error_message: '' });
                try {
                    const r = await fetch('/api/apply_update', { method: 'POST' });
                    const res = await r.json();
                    if (res.status !== 'ok') {
                        setProgress(p => ({ ...p, status: 'error', error_message: res.message || 'Lỗi khởi động tải bản mới' }));
                        return;
                    }

                    // Bắt đầu poll tiến độ mỗi 400ms
                    const pollInterval = setInterval(async () => {
                        try {
                            const pr = await fetch('/api/update_progress');
                            const pd = await pr.json();
                            setProgress(pd);

                            if (pd.status === 'ready') {
                                clearInterval(pollInterval);
                                setTimeout(() => {
                                    window.location.reload();
                                }, 3000);
                            } else if (pd.status === 'error') {
                                clearInterval(pollInterval);
                            }
                        } catch (e) {
                            clearInterval(pollInterval);
                            setProgress(p => ({ ...p, status: 'ready', progress: 100 }));
                            setTimeout(() => {
                                window.location.reload();
                            }, 3500);
                        }
                    }, 400);

                } catch (err) {
                    setProgress(p => ({ ...p, status: 'error', error_message: 'Không thể kết nối máy chủ để cập nhật.' }));
                }
            };

            return {
                updateInfo,
                dismissed,
                setDismissed,
                isUpdating,
                setIsUpdating,
                progress,
                startUpdate
            };
        };

            // Xuất CSV chung: đọc bảng .report-table đang hiển thị -> CSV (UTF-8 BOM). Số âm "(x)" -> "-x".
            const exportReportCsv = () => {
                const table = document.querySelector(".report-table");
                if (!table) return;
                const lines = [];
                table.querySelectorAll("tr").forEach(tr => {
                    const cells = [];
                    tr.querySelectorAll("th,td").forEach(td => {
                        const span = parseInt(td.getAttribute('colspan') || '1', 10);
                        let txt = (td.innerText || '').replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
                        const isVal = td.classList.contains('col-value') || td.classList.contains('col-rate');
                        if (isVal) {
                            if (txt === '-') txt = '';
                            else {
                                const neg = /^\(.*\)$/.test(txt);
                                txt = txt.replace(/[(),]/g, '').replace('%', '');
                                if (neg && txt) txt = '-' + txt;
                            }
                        }
                        if (/[",\n]/.test(txt)) txt = '"' + txt.replace(/"/g, '""') + '"';
                        cells.push(txt);
                        for (let k = 1; k < span; k++) cells.push('');
                    });
                    lines.push(cells.join(','));
                });
                const csv = '﻿' + lines.join('\r\n');
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `${REPORT_FILE[reportType] || reportType}_${period.year}_${period.value}.csv`;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            // Xuất báo cáo ra XLS giống HỆT giao diện web: dựng file Excel dạng HTML (mso), nội tuyến toàn bộ
            // computed-style (font, màu chữ/nền, viền, canh lề, padding, merge colspan/rowspan). Kèm cả khối
            // tiêu đề (công ty, mẫu, tên báo cáo, kỳ) canh theo đúng cột. Ô số cột giá trị lưu SỐ THẬT
            // (bấm vào = 1000000) nhưng hiển thị #,##0. Tự tách sheet nếu vượt 60.000 dòng.
            const exportReportXls = () => {
                const table = document.querySelector(".report-table");
                if (!table) return;

                // ── Nội tuyến computed-style từ DOM gốc vào clone ──
                const clone = table.cloneNode(true);
                clone.querySelectorAll('colgroup').forEach(cg => cg.remove());
                const origRows = table.querySelectorAll('tr');
                const cloneRows = clone.querySelectorAll('tr');
                const toRemove = [];
                for (let ri = 0; ri < origRows.length && ri < cloneRows.length; ri++) {
                    const oTr = origRows[ri];
                    const cTr = cloneRows[ri];
                    const trCs = getComputedStyle(oTr);
                    if (trCs.display === 'none') { toRemove.push(cTr); continue; }
                    const oCells = oTr.querySelectorAll('th,td');
                    const cCells = cTr.querySelectorAll('th,td');
                    for (let ci = 0; ci < oCells.length && ci < cCells.length; ci++) {
                        const oc = oCells[ci]; const cc = cCells[ci];
                        const cs = getComputedStyle(oc);
                        const isHdr = oc.tagName === 'TH';
                        let st = 'border:1px solid #000;';
                        st += 'font-weight:' + cs.fontWeight + ';text-align:' + cs.textAlign + ';';
                        st += 'vertical-align:' + cs.verticalAlign + ';color:' + cs.color + ';';
                        st += 'font-size:' + cs.fontSize + ';';
                        st += 'padding:' + cs.paddingTop + ' ' + cs.paddingRight + ' ' + cs.paddingBottom + ' ' + cs.paddingLeft + ';';
                        if (cs.width && cs.width !== 'auto') st += 'width:' + cs.width + ';';
                        if (cs.height && cs.height !== 'auto') st += 'height:' + cs.height + ';';
                        const bg = cs.backgroundColor;
                        if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') st += 'background-color:' + bg + ';';
                        if (cs.fontStyle !== 'normal') st += 'font-style:' + cs.fontStyle + ';';
                        cc.setAttribute('style', st);
                        if (!isHdr) {
                            // Ô hiển thị số âm theo kiểu kế toán "(1,000,000)" → đưa về dấu trừ cho Excel.
                            let txt = (cc.textContent || '').trim();
                            let isNeg = false;
                            if (txt.startsWith('(') && txt.endsWith(')')) {
                                isNeg = true;
                                txt = txt.slice(1, -1).trim();
                            }
                            // ── Ô PHẦN TRĂM ("15.54%") ─────────────────────────────────────────────
                            // Excel phải giữ value THẬT là phân số (0.1554) rồi tự hiển thị 15.54%,
                            // nếu để nguyên chuỗi "15.54%" thì ô thành text, không tính toán được.
                            // Giữ đúng số chữ số thập phân đang hiển thị trên web (xpct0..xpct4).
                            // Dịch dấu thập phân bằng toFixed thay vì chia 100 trần — 15.54/100 trong
                            // JS ra 0.15539999999999998, ghi vào Excel là lệch.
                            // ⚠️ BẪY (19/08/2026): mso-number-format PHẢI nằm trong INLINE STYLE của ô.
                            // Excel khi nhập HTML chỉ đọc CLASS ĐẦU TIÊN trong danh sách class. Ô ở đây
                            // luôn là class="col-value xnum" → Excel lấy 'col-value' (không có định dạng)
                            // rồi bỏ qua 'xnum' → mọi ô về General: cột tiền hiện 103293720 thay vì
                            // 103,293,720, cột % hiện 0.0029 thay vì 0.29%.
                            // Đã dựng lại đúng ca này trong Excel thật: class="xnum" một mình thì CHẠY,
                            // class="col-value xnum" thì HỎNG — nên đừng test bằng ô chỉ có một class.
                            // Vẫn giữ class .xnum/.xpct trong <style> cho tương thích ngược, nhưng thứ
                            // thực sự có tác dụng là inline dưới đây.
                            const fmt = (f) => cc.setAttribute('style', st + 'mso-number-format:' + f + ';');
                            if (/^[\d,]+(\.\d+)?\s*%$/.test(txt)) {
                                const numTxt = txt.slice(0, -1).trim().replace(/,/g, '');
                                const dec = Math.min((numTxt.split('.')[1] || '').length, 4);
                                cc.classList.add('xpct' + dec);
                                cc.textContent = (isNeg ? '-' : '') + (parseFloat(numTxt) / 100).toFixed(dec + 2);
                                fmt(dec > 0 ? ('0\\.' + '0'.repeat(dec) + '\\%') : '0\\%');
                            }
                            // ── Ô TIỀN ─────────────────────────────────────────────────────────────
                            // Bỏ dấu phẩy ngăn nghìn để value là 1000000, format #,##0 lo phần hiển thị.
                            else if (oc.classList.contains('col-value') || oc.classList.contains('col-rate')
                                     || oc.classList.contains('text-right')) {
                                cc.classList.add('xnum');
                                if (txt && /^[\d,]+(\.\d+)?$/.test(txt)) {
                                    cc.textContent = (isNeg ? '-' : '') + txt.replace(/,/g, '');
                                    fmt('\\#\\,\\#\\#0');
                                }
                            }
                            // Mã TK / số chứng từ: ép text để Excel không ăn mất số 0 đứng đầu.
                            else if (oc.classList.contains('col-code') || oc.classList.contains('text-center')) {
                                cc.classList.add('xtext');
                                fmt('\\@');
                            }
                        }
                    }
                }
                toRemove.forEach(tr => tr.remove());

                    unitName = org ? org.name : 'Đơn vị: ' + filters.org_ids[0];

                const REPORT_PATTERNS = {

                    BC007: 'Mẫu S03a - DN', BC008: 'Mẫu S38 - DN',

                let reportTitle = "";

                else if (reportType === 'BC005') reportTitle = 'BẢNG CÂN ĐỐI KẾ TOÁN';
                else if (['BC009', 'BC010', 'BC011'].includes(reportType)) {
                    reportTitle = `BÁO CÁO LƯU CHUYỂN TIỀN TỆ (${reportType === 'BC009' ? 'Trực tiếp' : reportType === 'BC011' ? 'Gián tiếp - Chú Long' : 'Gián tiếp'})`;
                }
                else if (reportType === 'BC007') reportTitle = 'SỔ NHẬT KÝ CHUNG';

                subInfoHtml += `<tr><td colspan="${maxCols}" style="text-align:center; font-weight:bold; font-size:10px; color:#475569; border:none;">Đơn vị: ${orgText}</td></tr>`;

                const headerHtml = `

                    '.xpct2{mso-number-format:"0\\.00\\%"}.xpct3{mso-number-format:"0\\.000\\%"}' +
                    '.xpct4{mso-number-format:"0\\.0000\\%"}' +
                    // BC016 có 51–59 cột ⇒ ngoài khổ ngang còn phải ép vừa 1 trang chiều rộng,
                    // không thì Excel cắt bảng thành hàng chục trang dọc rời rạc.
                    ((reportType === 'BC015' || reportType === 'BC016') ? '@page{mso-page-orientation:landscape;}' : '') +
                    (reportType === 'BC016' ? 'td,th{font-size:8pt}' : '') +
                    '</style>' +
                    '</head><body>' + bodyHtml + '</body></html>';

                const dateSuffix = period.type === 'custom' 
                    ? `${filters.from_date.replace(/\//g,'')}-${filters.to_date.replace(/\//g,'')}`
                    : `${period.year}_Thang${period.value}`;
                const fname = `${REPORT_FILE[reportType] || reportType}_${dateSuffix}.xls`;

                setExportModal({ open: true, progress: 30, status: 'exporting', filename: fname });

                const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = fname;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);

                setExportModal({ open: true, progress: 70, status: 'exporting', filename: fname });

                fetch('/api/save_export', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename: fname, content: html })
                }).then(r => r.json()).then(res => {
                    if (res.status === 'ok') {
                        setExportModal({ open: true, progress: 100, status: 'done', path: res.path, filename: res.filename });
                    } else {
                        setExportModal({ open: true, progress: 100, status: 'done', path: '', filename: fname });
                    }
                }).catch(() => {
                    setExportModal({ open: true, progress: 100, status: 'done', path: '', filename: fname });
                });
            };

            const downloadBlobAndSave = async (apiUrl, defaultFilename) => {
                try {
                    setExportModal({ open: true, progress: 15, status: 'exporting', filename: defaultFilename });
                    const timer1 = setTimeout(() => setExportModal(m => m ? { ...m, progress: 45 } : m), 250);
                    const timer2 = setTimeout(() => setExportModal(m => m ? { ...m, progress: 75 } : m), 600);

                    const r = await fetch(apiUrl);
                    clearTimeout(timer1);
                    clearTimeout(timer2);

                    if (!r.ok) {
                        alert('Lỗi xuất file: ' + r.statusText);
                        setExportModal(null);
                        return;
                    }

                    let filename = defaultFilename;
                    const cd = r.headers.get('Content-Disposition');
                    if (cd) {
                        const match = cd.match(/filename=["']?([^"';]+)["']?/);
                        if (match && match[1]) filename = match[1];
                    }

                    setExportModal({ open: true, progress: 88, status: 'exporting', filename });

                    const blob = await r.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl; a.download = filename;
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);

                    const reader = new FileReader();
                    reader.onload = async () => {
                        try {
                            let textContent = reader.result;
                            if (typeof textContent === 'string') {
                                textContent = textContent.replace(/\r\r\n/g, '\r\n');
                            }
                            const res = await fetch('/api/save_export', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ filename, content: textContent })
                            }).then(res => res.json());

                            if (res.status === 'ok') {
                                setExportModal({ open: true, progress: 100, status: 'done', path: res.path, filename: res.filename });
                            } else {
                                setExportModal({ open: true, progress: 100, status: 'done', path: '', filename });
                            }
                        } catch (e) {
                            setExportModal({ open: true, progress: 100, status: 'done', path: '', filename });
                        }
                    };
                    reader.readAsText(blob);
                } catch (err) {
                    alert('Lỗi xuất file: ' + err.message);
                    setExportModal(null);
                }
            };

const exportJournalCsv = (mode) => {
                const q = new URLSearchParams({ report_type: 'BC007', mode, journal_view_mode: journalViewMode, from_date: filters.from_date,
                    to_date: filters.to_date, org_ids: filters.org_ids.join(','), account_id: filters.acc_ids.join(',') });
                const fname = `BC007_Nhat_Ky_Chung_${filters.from_date.replace(/\//g,'')}-${filters.to_date.replace(/\//g,'')}.csv`;
                downloadBlobAndSave(`/api/report_export_csv?${q.toString()}`, fname);
                setShowJournalExport(false);
            };

            // ── Xuất .xls GIỮ NGUYÊN FORM cho báo cáo CÓ PHÂN TRANG (BC008 / BC012 / BC013) ──
            // exportReportXls() đọc bảng .report-table đang hiển thị, mà DOM chỉ có TRANG HIỆN TẠI →
            // file sẽ thiếu dòng mà không báo lỗi. Cách xử lý (pattern exportBC014Xls của LedgerReport):
            // gọi API với page_size=0 (server trả toàn bộ) → nạp vào DOM qua fullExportRows →
            // useLayoutEffect xuất rồi trả DOM về trạng thái phân trang (dùng useLayoutEffect nên không nháy màn hình).
            const FULL_XLS_WARN_ROWS = 50000;
            const exportFullXls = async (apiUrl, pickRows) => {
                setFullExporting(true);
                try {
                    const r = await fetch(apiUrl);
                    if (r.status === 401) { alert('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.'); setFullExporting(false); return; }
                    const res = await r.json();
                    if (res.status !== 'ok') { alert('Lỗi tải dữ liệu để xuất: ' + (res.message || '')); setFullExporting(false); return; }
                    const rows = pickRows(res) || [];
                    // BC016 trả nguyên payload (có cột động + cây nhóm) chứ không phải mảng dòng phẳng
                    // như các báo cáo khác ⇒ đếm dòng qua pagination.
                    const nRows = Array.isArray(rows) ? rows.length : ((res.pagination && res.pagination.total_rows) || 0);
                    if (!nRows) { alert('Không có dữ liệu để xuất.'); setFullExporting(false); return; }
                    if (nRows > FULL_XLS_WARN_ROWS && !confirm(
                        `Báo cáo có ${nRows.toLocaleString('vi-VN')} dòng. Nạp hết vào bảng để giữ nguyên form Excel `
                        + `có thể làm ứng dụng chậm hoặc treo.\n\nNên chọn "Xuất toàn bộ CSV" thay thế. Vẫn tiếp tục xuất Excel?`)) {
                        setFullExporting(false); return;
                    }
                    setFullExportRows(rows);
                } catch (err) {
                    if (window.isNetworkError && window.isNetworkError(err)) window.showConnectionLost();
                    else alert('Lỗi xuất Excel: ' + err.message);
                    setFullExporting(false);
                }
            };

            React.useLayoutEffect(() => {
                if (!fullExportRows) return;
                try { exportReportXls(); } finally { setFullExportRows(null); setFullExporting(false); }
            }, [fullExportRows]);

            const buildFullExportReq = (rptType, modeArg) => {
                const base = { from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(',') };
                if (rptType === 'BC008') {
                    const q = new URLSearchParams({ ...base, account_id: filters.acc_ids.join(','), page: 1, page_size: 0 });
                    return [`/api/account_details?${q.toString()}`, res => res.data];
                }
                if (rptType === 'BC012') {
                    const q = new URLSearchParams({ ...base, acc_ids: filters.acc_ids.join(','),
                        contra_acc_ids: filters.contra_acc_ids.join(','), tran_no: filters.tran_no || '', page: 1, page_size: 0 });
                    return [`/api/cash_book?${q.toString()}`, res => res.rows];
                }
                if (rptType === 'BC015') {
                    const q = new URLSearchParams({ ...base, mode: modeArg || saleSourceMode || 'summary', page: 1, page_size: 0 });
                    return [`/api/sale_by_source?${q.toString()}`, res => res.rows];
                }
                if (rptType === 'BC016') {
                    // page_size=0 ⇒ lấy MỌI nhóm, không chỉ trang đang xem (Bẫy 9: DOM chỉ có trang hiện tại).
                    const q = new URLSearchParams({ ...base, group_by: modeArg || nxtGroupBy || 'class', page: 1, page_size: 0 });
                    return [`/api/nxt?${q.toString()}`, res => res];
                }
                const q = new URLSearchParams({ ...base, acc_ids: filters.acc_ids.join(','),
                    mode: modeArg || vatSalesMode || 'detail', page: 1, page_size: 0 });
                return [`/api/vat_sales_report?${q.toString()}`, res => res.data];
            };

            const exportPagedCsv = () => {
                setShowPagedExport(false);
                const dateSfx = `${filters.from_date.replace(/\//g,'')}-${filters.to_date.replace(/\//g,'')}`;
                if (reportType === 'BC008') {
                    const q = new URLSearchParams({ report_type: 'BC008', from_date: filters.from_date,
                        to_date: filters.to_date, org_ids: filters.org_ids.join(','), account_id: filters.acc_ids.join(',') });
                    downloadBlobAndSave(`/api/report_export_csv?${q.toString()}`,
                        `BC008_So_Chi_Tiet_${filters.acc_ids[0] || 'TK'}_${dateSfx}.csv`);
                } else {
                    const q = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date,
                        org_ids: filters.org_ids.join(','), acc_ids: filters.acc_ids.join(','),
                        contra_acc_ids: filters.contra_acc_ids.join(','), tran_no: filters.tran_no || '' });
                    downloadBlobAndSave(`/api/cash_book/export_csv?${q.toString()}`, `BC012_So_Quy_${dateSfx}.csv`);
                }
            };

            const exportToExcel = () => {
                if (reportType === 'BC007') {
                    setShowJournalExport(true);
                    return;
                }
                if (reportType === 'BC008' || reportType === 'BC012') {
                    setShowPagedExport(true);
                    return;
                }
                if (reportType === 'BC014') {
                    setShowVatSalesExport(true);
                    return;
                }
                if (reportType === 'BC015') {
                    const [url, pick] = buildFullExportReq('BC015', saleSourceMode);
                    exportFullXls(url, pick);
                    return;
                }
                if (reportType === 'BC016') {
                    const [url, pick] = buildFullExportReq('BC016', nxtGroupBy);
                    exportFullXls(url, pick);
                    return;
                }
                exportReportXls();
            };
            const exportToPDF = () => { window.print(); };

            const pagedDataRows = fullExportRows || (reportData.data || (Array.isArray(reportData) ? reportData : []));
            const cbRowsView = fullExportRows || cbRows;
            const ssRows = fullExportRows || (reportData && reportData.rows) || [];   // BC015

            // ── BC016 — Nhập xuất tồn ─────────────────────────────────────────────
            // fullExportRows mang nguyên payload /api/nxt của lần lấy-toàn-bộ (xuất Excel),
            // nên phải nhận cả dạng object, không chỉ mảng như các báo cáo khác.
            const nxt = (fullExportRows && fullExportRows.groups ? fullExportRows : nxtData) || null;
            const nxtColsIn = (nxt && nxt.columns && nxt.columns.in) || [];
            const nxtColsOut = (nxt && nxt.columns && nxt.columns.out) || [];
            const nxtGroups = (nxt && nxt.groups) || [];
            // 3 cột định danh + (đầu kỳ, cộng nhập, cộng xuất, cuối kỳ) × 2 ô + mỗi TRAN_ID 2 ô
            const nxtColSpan = 3 + 8 + (nxtColsIn.length + nxtColsOut.length) * 2;
            // Ô số của BC016: dùng chung formatNum nên 0 ra "-" và số âm nằm trong ngoặc ()
            // — số lượng xuất âm là xuất điều chỉnh, form kế toán trình bày bằng ngoặc đơn.
            const nxtCells = (o) => ([
                o.open_qty, o.open_amt, o.in_qty, o.in_amt,
                ...nxtColsIn.flatMap(c => (o.in && o.in[c.tran_id]) || [0, 0]),
                o.out_qty, o.out_amt,
                ...nxtColsOut.flatMap(c => (o.out && o.out[c.tran_id]) || [0, 0]),
                o.close_qty, o.close_amt,
            ]);

            return (
                <div className="flex-1 overflow-hidden flex flex-col">
                    <div className="bg-white border-b border-slate-200 p-3 px-6 shrink-0 shadow-sm z-[900] space-y-3">
                        <div className="flex items-end gap-3">
                            <div className="w-60"><PeriodDropdown period={period} setPeriod={setPeriod} isActive={activeDropdown === 'period'} onToggle={setActiveDropdown} /></div>
                            <div className="w-32">
                                <IOSDatePicker label="Từ ngày" value={filters.from_date} onChange={val => onToggleFilter('from_date', val)} disabled={period.type !== 'custom'} />
                            </div>
                            <div className="w-32">
                                <IOSDatePicker label="Đến ngày" value={filters.to_date} onChange={val => onToggleFilter('to_date', val)} disabled={period.type !== 'custom'} />
                            </div>
                            <div className="w-40"><PremiumDropdown label="Đơn vị" items={meta.orgs} selectedItems={filters.org_ids} onSelect={id => onToggleFilter('org_ids', id)} isActive={activeDropdown === 'Đơn vị'} onToggle={setActiveDropdown} /></div>
                            {(reportType === 'BC008' || reportType === 'BC012' || reportType === 'BC013' || reportType === 'BC014') ? (
                                <div className="w-40"><PremiumDropdown label="Tài khoản" items={meta.accounts} selectedItems={filters.acc_ids} onSelect={id => onToggleFilter('acc_ids', id)} isActive={activeDropdown === 'Tài khoản'} onToggle={setActiveDropdown} /></div>
                            ) : null}
                            {['BC002', 'BC004'].includes(reportType) && (
                                <div className="w-40"><PremiumDropdown label="Công việc" items={meta.jobs} selectedItems={filters.job_ids} onSelect={id => onToggleFilter('job_ids', id)} isActive={activeDropdown === 'Công việc'} onToggle={setActiveDropdown} /></div>
                            )}
                            {reportType === 'BC007' && (
                                <div className="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200 shrink-0 h-[32px] items-center">
                                    <button onClick={() => setJournalViewMode('detail')} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${journalViewMode === 'detail' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Chi tiết</button>
                                    <button onClick={() => setJournalViewMode('summary')} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${journalViewMode === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'}`}>Tổng hợp</button>
                                </div>
                            )}
                            {reportType === 'BC014' && (
                                <div className="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200 shrink-0 h-[32px] items-center">
                                    <button disabled={loading} onClick={() => { if (vatSalesMode === 'detail' || loading) return; setVatSalesMode('detail'); loadReportData(1, 'detail'); }} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${vatSalesMode === 'detail' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'} disabled:opacity-50`}>Chi tiết</button>
                                    <button disabled={loading} onClick={() => { if (vatSalesMode === 'summary' || loading) return; setVatSalesMode('summary'); loadReportData(1, 'summary'); }} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${vatSalesMode === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'} disabled:opacity-50`}>Tổng hợp</button>
                                </div>
                            )}
                            {reportType === 'BC015' && (
                                <div className="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200 shrink-0 h-[32px] items-center">
                                    <button disabled={loading} onClick={() => { if (saleSourceMode === 'summary' || loading) return; setSaleSourceMode('summary'); loadReportData(1, 'summary'); }} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${saleSourceMode === 'summary' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'} disabled:opacity-50`}>Tổng hợp</button>
                                    <button disabled={loading} onClick={() => { if (saleSourceMode === 'detail' || loading) return; setSaleSourceMode('detail'); loadReportData(1, 'detail'); }} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${saleSourceMode === 'detail' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'} disabled:opacity-50`}>Chi tiết</button>
                                </div>
                            )}
                            {reportType === 'BC016' && (
                                <div className="flex bg-slate-100 p-0.5 rounded-lg border border-slate-200 shrink-0 h-[32px] items-center">
                                    <span className="px-2 text-[9px] font-bold text-slate-400 uppercase tracking-wider">Gom theo</span>
                                    <button disabled={loading} onClick={() => { if (nxtGroupBy === 'class' || loading) return; setNxtGroupBy('class'); loadReportData(1, 'class'); }} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${nxtGroupBy === 'class' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'} disabled:opacity-50`}>Nhóm hàng hoá</button>
                                    <button disabled={loading} onClick={() => { if (nxtGroupBy === 'warehouse' || loading) return; setNxtGroupBy('warehouse'); loadReportData(1, 'warehouse'); }} className={`px-3 py-1 rounded-md text-[10px] font-bold transition-all ${nxtGroupBy === 'warehouse' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-800'} disabled:opacity-50`}>Kho</button>
                                </div>
                            )}
                            {reportType === 'BC013' ? (
                                <div className="w-40"><PremiumDropdown label="Đối tượng" items={meta.pr_details} selectedItems={filters.pr_detail_ids} onSelect={id => onToggleFilter('pr_detail_ids', id)} isActive={activeDropdown === 'Đối tượng'} onToggle={setActiveDropdown} /></div>
                            ) : null}
                            {reportType === 'BC012' ? (
                                <>
                                <div className="w-40"><PremiumDropdown label="TK đối ứng" items={meta.accounts} selectedItems={filters.contra_acc_ids} onSelect={id => onToggleFilter('contra_acc_ids', id)} isActive={activeDropdown === 'TK đối ứng'} onToggle={setActiveDropdown} /></div>
                                <div className="w-36">
                                    <input value={filters.tran_no || ''} onChange={e => onToggleFilter('tran_no', e.target.value)} placeholder="Số chứng từ"
                                        className="w-full h-[32px] px-3 rounded-lg border border-slate-200 text-[11px] font-bold text-slate-700 placeholder:text-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-400" />
                                </div>
                                </>
                            ) : null}
                            <div className="ml-auto"><ReportTypeDropdown value={reportType} onChange={(type) => { if (type !== reportType && Object.keys(reportData).length > 0) { setPendingReportType(type); setShowClearModal(true); } else { setReportType(type); } }} isActive={activeDropdown === 'reportType'} onToggle={setActiveDropdown} /></div>
                            <div className="flex gap-1.5">
                                <button onClick={() => loadReportData(1)} disabled={loading} className="bg-indigo-600 text-white px-5 h-[32px] rounded-lg font-black text-[9px] shadow-lg hover:bg-indigo-700 transition-all uppercase tracking-widest flex items-center gap-2">
                                    {loading && <Icon name="loader" className="animate-spin" />}
                                    Xem {reportType}
                                </button>
                                <button onClick={exportToExcel} disabled={reportType === 'BC016' ? !(nxtData && nxtData.groups && nxtData.groups.length) : reportType === 'BC012' ? cbRows.length === 0 : (reportType === 'BC006' || reportType === 'BC013') ? trialBalanceData.length === 0 : Object.keys(reportData).length === 0} className="bg-emerald-600 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 h-[32px] rounded-lg font-black text-[9px] shadow-lg hover:bg-emerald-700 hover:disabled:bg-emerald-600 transition-all flex items-center gap-2"><Icon name="file-spreadsheet" size={12}/> Excel</button>
                                <button onClick={exportToPDF} disabled={reportType === 'BC016' ? !(nxtData && nxtData.groups && nxtData.groups.length) : reportType === 'BC012' ? cbRows.length === 0 : (reportType === 'BC006' || reportType === 'BC013') ? trialBalanceData.length === 0 : Object.keys(reportData).length === 0} className="bg-red-600 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 h-[32px] rounded-lg font-black text-[9px] shadow-lg hover:bg-red-700 hover:disabled:bg-red-600 transition-all flex items-center gap-2"><Icon name="download" size={12}/> PDF</button>
                            </div>
                        </div>
                    </div>

                    <div className="flex-1 overflow-auto custom-scrollbar bg-slate-200 p-4 relative" ref={paperScrollRef}>
                        <div className={`report-paper ${['BC001', 'BC002', 'BC003', 'BC004', 'BC006', 'BC007', 'BC011', 'BC012', 'BC013', 'BC014', 'BC015', 'BC016'].includes(reportType) ? 'paper-landscape' : 'paper-portrait'}`}>
                            <div className="flex justify-between items-start mb-6">
                                <div>
                                    <div className="font-black text-[11px] uppercase">{(meta.company && meta.company.name) || ''}</div>
                                    <div className="text-[9px] text-slate-500 italic mt-0.5">
                                        {(meta.company && meta.company.address) || ''}{(meta.company && meta.company.tax_code) ? ` — MST: ${meta.company.tax_code}` : ''}
                                    </div>
                                    <div className="font-bold text-[9px] text-slate-500 uppercase mt-0.5">
                                        Đơn vị: {filters.org_ids.length > 0 ? (
                                            meta.orgs.find(o => o.id === filters.org_ids[0])?.name || filters.org_ids[0]
                                        ) : 'Tất cả'}
                                    </div>
                                </div>
                                <div className="text-right font-black text-[10px] text-slate-400 uppercase tracking-widest italic underline">{reportType === 'BC005' ? 'Mẫu B01 - DN' : reportType === 'BC006' ? 'Mẫu B09 - DN' : reportType === 'BC007' ? 'Mẫu S03a - DN' : reportType === 'BC008' ? 'Mẫu S38 - DN' : (reportType === 'BC009' || reportType === 'BC010' || reportType === 'BC011') ? 'Mẫu B03 - DN' : reportType === 'BC012' ? 'Mẫu S07 - DN' : reportType === 'BC013' ? 'Mẫu S05 - DN' : reportType === 'BC014' ? 'Mẫu 01-1/GTGT' : (reportType === 'BC015' || reportType === 'BC016') ? '' : 'Mẫu B02 - DN'}</div>

                ['ITEM_ID','Mã hàng hóa'],['ITEM_NAME','Tên hàng hóa'],['DESCRIPTION','Diễn giải'],
                ['UNIT_ID','ĐVT'],['UNIT_NAME','Tên đơn vị tính'],['QUANTITY','Số lượng'],['UNIT_PRICE','Đơn giá'],['AMOUNT','Thành tiền'],
                ['DISCOUNT_AMOUNT','Giảm giá'],['VAT_TAX_RATE','Thuế suất'],['VAT_TAX_AMOUNT','Tiền thuế VAT'],
                ['TOTAL_AMOUNT','Tổng thanh toán'],['COG_AMOUNT','Giá vốn'],
                ['ACCOUNT_ID','Tài khoản'],['ACCOUNT_ID_PR','Tài khoản công nợ'],['ACCOUNT_ID_COST','TK kho'],['ACCOUNT_ID_INCOME','TK doanh thu'],['ACCOUNT_ID_VAT','TK thuế'],
                ['EXPENSE_ID','Mã MCP'],['EXPENSE_NAME','Tên MCP'],
                ['JOB_ID','Mã công việc'],['JOB_NAME','Tên công việc'],
                ['IS_RETURN','Hàng trả'],['STATUS','Trạng thái'],
                ['PAYMENT_METHOD_ID','Mã HTTT'],['PAYMENT_METHOD_NAME','Hình thức thanh toán'],
                ['EXTRA_ID_2','Mã nguồn đơn'],['EXTRA_NAME_2','Nguồn đơn'],
                ['INCOME_AMOUNT','Doanh thu'],['VAT_INCOME_AMOUNT','Thuế doanh thu'],
                ['COMMENTS','Ghi chú']
            ];

            const VOUCHER_EXPORT_COLS = [
                ['ORGANIZATION_ID','Mã đơn vị'],['ORGANIZATION_NAME','Tên đơn vị'],
                ['TRAN_ID','Mã chứng từ'],['TRAN_NAME','Tên chứng từ'],['TRAN_NO','Số chứng từ'],['TRAN_DATE','Ngày chứng từ'],
                ['ACCOUNT_ID_DEBIT','Tài khoản'],['ACCOUNT_ID_CREDIT','TK đối ứng'],
                ['DESCRIPTION','Diễn giải'],['AMOUNT','Số tiền'],
                ['PR_DETAIL_ID_DEBIT','Mã Đối tượng'],['PR_DETAIL_NAME_DEBIT','Đối tượng'],
                ['PR_DETAIL_ID_CREDIT','Mã ĐT đối ứng'],['PR_DETAIL_NAME_CREDIT','Đối tượng đối ứng'],
                ['EXPENSE_ID_DEBIT','Mục chi phí'],['EXPENSE_ID_CREDIT','MCP đối ứng'],
                ['JOB_ID_DEBIT','Công việc'],['JOB_ID_CREDIT','CV đối ứng'],
                ['BANK_NAME_DEBIT','Ngân hàng'],['BANK_ACCOUNT_DEBIT','TK Ngân hàng'],
                ['BANK_NAME_CREDIT','Ngân hàng đối ứng'],['BANK_ACCOUNT_CREDIT','TKNH đối ứng'],
                ['CONTACT_PERSON','Người nộp/nhận'],['ADDRESS','Địa chỉ'],['REFERENCE_NO','Số tham chiếu'],
                ['EMPLOYEE_ID','Mã NV'],['CURRENCY_ID','Tiền tệ'],['STATUS','Trạng thái']
            ];


            const orgNameMap = () => {
                const m = {};
                (meta.orgs || []).forEach(o => { m[(o.id||'').trim()] = o.name || ''; });
                return m;
            };

            // Extractors trả về MẢNG giá trị theo thứ tự cột (nhanh hơn build object ~3-5x cho data lớn)
            const extractLedgerRow = (r) => LEDGER_EXPORT_COLS.map(([key]) => {
                if (key === 'DEBIT')  return r.DEBIT_CREDIT === 'DEB' ? Number(r.AMOUNT || 0) : '';
                if (key === 'CREDIT') return r.DEBIT_CREDIT === 'CRD' ? Number(r.AMOUNT || 0) : '';
                const v = r[key];
                return v == null ? '' : v;
            });
            const extractRowGeneric = (cols, r) => cols.map(([key]) => {
                const v = r[key];
                return v == null ? '' : v;
            });

            const sanitizeSheetName = (s) => {
                const cleaned = String(s || 'Sheet').replace(/[\\/?*[\]:]/g, '_').substring(0, 31);
                return cleaned || 'Sheet';
            };

            // Excel hard limit: 1.048.576 dòng/sheet (kể cả header)
            const EXCEL_MAX_ROWS = 1048575;
            // Mode "single" luôn xuất CSV server-side (CSV không giới hạn số dòng như xlsx).
            // Đặt = 0 để mọi lần "1 sheet" đều đi đường server stream → không còn giới hạn 500.000 dòng.
            const SERVER_STREAM_THRESHOLD = 0;
            // Ngưỡng cảnh báo per-sheet trong mode by_org
            const PER_SHEET_WARN = 200000;
            const yieldToUI = () => new Promise(r => setTimeout(r, 0));

            // Convert column index (0-based) → Excel column letter (A, B, ..., Z, AA, AB, ...)
            const colLetter = (idx) => {
                let s = '';
                idx = idx + 1;
                while (idx > 0) {
                    const m = (idx - 1) % 26;
                    s = String.fromCharCode(65 + m) + s;
                    idx = Math.floor((idx - 1) / 26);
                }
                return s;
            };

            // Tự build worksheet object — không gọi XLSX.utils.aoa_to_sheet (vốn enumerate properties).
            // Trả về ws object dạng {!ref, A1:{v,t}, ...} compatible XLSX writer.
            const buildSheetManual = async (cols, rows, extractor, onProgress) => {
                const headers = cols.map(([_, label]) => label);
                const truncate = rows.length > EXCEL_MAX_ROWS;
                const useRows = truncate ? rows.slice(0, EXCEL_MAX_ROWS) : rows;
                const ws = {};
                const nCols = headers.length;
                const nRows = useRows.length + 1; // +header

                // Header row
                for (let c = 0; c < nCols; c++) {
                    ws[colLetter(c) + '1'] = { v: headers[c], t: 's' };
                }

                const CHUNK = 10000;
                for (let i = 0; i < useRows.length; i++) {
                    const arr = extractor(useRows[i]);
                    const rowExcel = i + 2; // 1-based, +header
                    for (let c = 0; c < nCols; c++) {
                        const v = arr[c];
                        if (v === '' || v == null) continue; // skip empty cell
                        const ref = colLetter(c) + rowExcel;
                        if (typeof v === 'number') ws[ref] = { v, t: 'n' };
                        else                       ws[ref] = { v: String(v), t: 's' };
                    }
                    if (i > 0 && i % CHUNK === 0) {
                        if (onProgress) onProgress(i, useRows.length);
                        await yieldToUI();
                    }
                }
                if (onProgress) onProgress(useRows.length, useRows.length);

                ws['!ref'] = `A1:${colLetter(nCols - 1)}${nRows}`;
                return { ws, truncated: truncate ? rows.length - EXCEL_MAX_ROWS : 0 };
            };

            // Build query URLSearchParams cho count/stream — y hệt logic export-all của từng tab
            const buildExportQuery = (kind) => {
                if (kind === 'ledger') {
                    const query = new URLSearchParams({ ...filters });
                    Object.keys(filters).forEach(k => { if(Array.isArray(filters[k])) query.set(k, filters[k].join(',')); });
                    const cs = colSearch;
                    const map = {
                        s_date:cs.TRAN_DATE, tran_no:cs.TRAN_NO, s_tran_id:cs.TRAN_ID,
                        s_acc_id:cs.ACCOUNT_ID, s_contra_id:cs.ACCOUNT_ID_CONTRA,
                        s_desc:cs.DESCRIPTION, s_pr_name:cs.PR_DETAIL_NAME,
                        s_exp_name:cs.EXPENSE_NAME, s_org_id:cs.ORGANIZATION_ID,
                        s_org_name:cs.ORGANIZATION_NAME, s_item_name:cs.ITEM_NAME,
                        s_prod_name:cs.PRODUCT_NAME
                    };
                    Object.keys(map).forEach(k => { if((map[k]||'').trim()) query.set(k, map[k].trim()); });
                    if (ledgerSort.field) { query.set('order_by', ledgerSort.field); query.set('order_dir', ledgerSort.dir); }
                    return query;
                }
                if (kind === 'purchase') return buildPurchaseQuery(1, 1, null, {});
                if (kind === 'sale') return buildSaleQuery(1, 1, null, {});
                if (kind === 'voucher') return buildVoucherQuery(1, 1, null, {});
                if (kind === 'warehouse_balance') return buildWarehouseBalanceQuery(1, 1, null, {});
                if (kind === 'btp_reconcile') return buildBtpQuery(1, 1, null, {});
                return buildWarehouseQuery(1, 1, null, {});
            };

            // Trigger browser tải file qua URL (server-side stream). Không nạp vào RAM JS.
            const triggerDownload = (url, fname) => {
                const a = document.createElement('a');
                a.href = url;
                a.download = fname || '';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 200);
            };

            // Kick off server-side export job → poll status → khi done set exportDone modal
            const startServerExport = async (kind, total, format = 'csv') => {
                setExportConfirm(null);
                setExporting(true);
                setExportProgress({ phase: 'stream', current: 0, total });
                try {
                    const q = buildExportQuery(kind);
                    q.set('total', String(total));
                    q.set('format', format);
                    const r = await fetch(`/api/${kind}/stream_csv?${q.toString()}`, { method: 'POST' });
                    const res = await r.json();
                    if (res.status !== 'ok' || !res.job_id) {
                        alert('Lỗi khởi tạo job xuất: ' + (res.message || 'unknown'));
                        return;
                    }
                    const jobId = res.job_id;
                    // Poll status mỗi 500ms cho đến khi done/error
                    while (true) {
                        await new Promise(r => setTimeout(r, 500));
                        const sr = await fetch(`/api/export/status?job_id=${jobId}`);
                        if (sr.status === 404) { alert('Job đã bị xóa.'); break; }
                        const sj = await sr.json();
                        setExportProgress({ phase: 'stream', current: sj.current || 0, total: sj.total || total });
                        if (sj.status === 'done') {
                            setExporting(false);
                            setExportProgress(null);
                            setExportDone({ file_path: sj.file_path, filename: sj.filename, total: sj.current });
                            break;
                        }
                        if (sj.status === 'error') {
                            alert('Lỗi xuất CSV: ' + (sj.error || ''));
                            break;
                        }
                    }
                } catch (err) {
                    alert('Lỗi: ' + err.message);
                } finally {
                    setExporting(false);
                    setExportProgress(null);
                }
            };

            const openExportedFile = async (path) => {
                try {
                    const r = await fetch('/api/open_file', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path })
                    });
                    const j = await r.json();
                    if (j.status !== 'ok') alert('Không mở được file: ' + (j.message || ''));
                } catch (e) { alert('Lỗi: ' + e.message); }
            };
            const openExportedFolder = async (path) => {
                try {
                    const r = await fetch('/api/open_folder', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path })
                    });
                    const j = await r.json();
                    if (j.status !== 'ok') alert('Không mở được folder: ' + (j.message || ''));
                } catch (e) { alert('Lỗi: ' + e.message); }
            };

            const doExport = async (kind, mode, format = 'xlsx') => {
                // kind: 'ledger' | 'purchase' | 'warehouse' | 'sale' | 'voucher' ; mode: 'single' | 'by_org' ; format: 'xlsx' | 'csv'
                if (typeof XLSX === 'undefined' && mode === 'by_org') { alert('Thư viện XLSX chưa tải được. Vui lòng kiểm tra kết nối.'); return; }
                setExporting(true);
                setExportOpen(null);
                setExportProgress({ phase: 'fetch', current: 0, total: 0 });
                try {
                    // ===== BƯỚC 1: Lấy số dòng trước =====
                    const countQuery = buildExportQuery(kind);
                    const countRes = await fetch(`/api/${kind}/count?${countQuery.toString()}`).then(r => r.json()).catch(() => null);
                    const totalRows = countRes && countRes.status === 'ok' ? countRes.total : 0;

                    if (!totalRows) {
                        alert('Không có dữ liệu để xuất.');
                        setExporting(false);
                        setExportProgress(null);
                        return;
                    }

                    // ===== BƯỚC 2: SERVER-SIDE STREAM EXPORT CHO MỌI ĐƠN FILE (xlsx hoặc csv) =====
                    // Luôn chạy ngầm server background job → có tiến trình 0-100% + modal Mở file / Mở folder khi xong
                    if (mode === 'single') {
                        await startServerExport(kind, totalRows, format);
                        return;
                    }

                    // ===== BƯỚC 3: client-side xlsx multi-sheet (by_org) =====
                    let url;
                    if (kind === 'ledger') {
                        url = `/api/ledger/export?${countQuery.toString()}`;
                    } else if (kind === 'purchase') {
                        url = `/api/purchase?${buildPurchaseQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'sale') {
                        url = `/api/sale?${buildSaleQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'voucher') {
                        url = `/api/voucher?${buildVoucherQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'warehouse_balance') {
                        url = `/api/warehouse_balance?${buildWarehouseBalanceQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else if (kind === 'btp_reconcile') {
                        url = `/api/btp_reconcile?${buildBtpQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    } else {
                        url = `/api/warehouse?${buildWarehouseQuery(1, 1, null, { export_all: '1' }).toString()}`;
                    }

                    setExportProgress({ phase: 'fetch', current: 0, total: totalRows });
                    const r = await fetch(url);
                    if (r.status === 401) { setIsLoggedIn(false); return; }
                    const res = await r.json();
                    if (res.status !== 'ok') { alert('Lỗi xuất Excel: ' + (res.message || '')); return; }
                    const rows = res.data || [];
                    if (!rows.length) { alert('Không có dữ liệu để xuất.'); return; }

                    const cols = kind === 'ledger' ? LEDGER_EXPORT_COLS
                               : kind === 'purchase' ? PURCHASE_EXPORT_COLS
                               : kind === 'sale' ? SALE_EXPORT_COLS
                               : kind === 'voucher' ? VOUCHER_EXPORT_COLS
                               : kind === 'warehouse_balance' ? WAREHOUSE_BALANCE_EXPORT_COLS
                               : kind === 'btp_reconcile' ? BTP_EXPORT_COLS
                               : WAREHOUSE_EXPORT_COLS;
                    const extractor = kind === 'ledger' ? extractLedgerRow : (r) => extractRowGeneric(cols, r);

                    const prefix = kind === 'ledger' ? 'ChungTuTongHop_' : (kind === 'purchase' ? 'PhieuNhapKho_' : (kind === 'sale' ? 'ChungTuBanHang_' : (kind === 'voucher' ? 'ChungTuTien_' : (kind === 'warehouse_balance' ? 'TonKhoThucTe_' : (kind === 'btp_reconcile' ? 'DoiChieuXuatSX_NhapTP_' : 'ChungTuKho_')))));
                    const fname = prefix + filters.from_date.replace(/\//g,'') + '-' + filters.to_date.replace(/\//g,'') + '.xlsx';

                    setExportProgress({ phase: 'build', current: 0, total: rows.length });
                    await yieldToUI();

                    const wb = XLSX.utils.book_new();

                    // Group theo ORGANIZATION_ID
                    const groups = new Map();
                    for (let i = 0; i < rows.length; i++) {
                        const id = (rows[i].ORGANIZATION_ID || '').toString().trim() || '__NONE__';
                        let g = groups.get(id);
                        if (!g) { g = []; groups.set(id, g); }
                        g.push(rows[i]);
                    }
                    const onm = orgNameMap();
                    const ids = [...groups.keys()].sort();
                    if (!ids.length) { alert('Không có dữ liệu để xuất.'); return; }

                    // Cảnh báo nếu có sheet con vượt PER_SHEET_WARN
                    const oversize = ids.filter(id => groups.get(id).length > PER_SHEET_WARN);
                    if (oversize.length) {
                        alert(
                            `Cảnh báo: ${oversize.length} đơn vị có dữ liệu vượt ${PER_SHEET_WARN.toLocaleString()} dòng — có thể gây nặng khi mở.\n\n` +
                            `Tiếp tục xuất bình thường, nhưng nên thu hẹp khoảng ngày.`
                        );
                    }

                    let done = 0;
                    for (const id of ids) {
                        const grp = groups.get(id);
                        const { ws } = await buildSheetManual(cols, grp, extractor, (c) => {
                            setExportProgress({ phase: 'build', current: done + c, total: rows.length });
                        });
                        const orgName = id === '__NONE__' ? 'Khac' : (onm[id] || id);
                        XLSX.utils.book_append_sheet(wb, ws, sanitizeSheetName(`${id}-${orgName}`));
                        done += grp.length;
                        setExportProgress({ phase: 'build', current: done, total: rows.length });
                        await yieldToUI();
                    }

                    setExportProgress({ phase: 'write', current: rows.length, total: rows.length });
                    await yieldToUI();

                    // Dùng XLSX.write + Blob → tránh writeFile internal heavy enumeration
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array', compression: true });
                    const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    const blobUrl = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = blobUrl;
                    a.download = fname;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(blobUrl); }, 100);
                } catch (err) {
                    alert('Lỗi xuất Excel: ' + (err && err.message ? err.message : String(err)));
                } finally {
                    setExporting(false);
                    setExportProgress(null);
                }
            };

            const ExportButton = ({ kind }) => {
                const ref = useRef(null);
                useEffect(() => {
                    const onDown = (e) => { if (ref.current && !ref.current.contains(e.target)) setExportOpen(null); };
                    if (exportOpen === kind) document.addEventListener('mousedown', onDown);
                    return () => document.removeEventListener('mousedown', onDown);
                }, [exportOpen]);
                return (
                    <div className="relative shrink-0" ref={ref}>
                        <button
                            type="button"
                            disabled={exporting}
                            onClick={() => setExportOpen(exportOpen === kind ? null : kind)}
                            className="group relative overflow-hidden bg-emerald-600 text-white px-3 h-[40px] rounded-xl font-black text-[10px] uppercase tracking-wider transition-all hover:bg-emerald-700 active:scale-[0.98] shadow-lg shadow-emerald-500/20 flex items-center gap-1.5 shrink-0"
                        >
                            {exporting ? <Icon name="loader" className="animate-spin" size={12}/> : <Icon name="file-spreadsheet" size={12}/>}
                            <span>{exporting ? 'Đang xuất...' : 'Xuất Excel'}</span>
                            <Icon name="chevron-down" size={9} className={`transition-transform ${exportOpen === kind ? 'rotate-180' : ''}`} />
                        </button>
                        {exportOpen === kind && (
                            <div className="absolute top-full right-0 mt-2 w-72 bg-white rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,0.25)] border border-slate-200 z-[600] overflow-hidden animate-fadeIn">
                                <div className="px-4 py-3 bg-emerald-50/50 border-b border-emerald-100">
                                    <div className="text-[9px] font-black text-emerald-700 uppercase tracking-widest">Chọn kiểu & định dạng xuất</div>
                                </div>
                                <button onClick={() => doExport(kind, 'single', 'xlsx')} className="w-full text-left px-4 py-3 hover:bg-emerald-50/60 transition-all border-b border-slate-100 flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-black text-[10px] shrink-0">XLSX</div>
                                    <div>
                                        <div className="text-[12px] font-black text-slate-800">Xuất Excel (.xlsx)</div>
                                        <div className="text-[10px] font-bold text-slate-400 mt-0.5">Định dạng Excel chuẩn đẹp · Hiện tiến trình & Mở file</div>
                                    </div>
                                </button>
                                <button onClick={() => doExport(kind, 'single', 'csv')} className="w-full text-left px-4 py-3 hover:bg-blue-50/60 transition-all border-b border-slate-100 flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center font-black text-[10px] shrink-0">CSV</div>
                                    <div>
                                        <div className="text-[12px] font-black text-slate-800">Xuất CSV (.csv)</div>
                                        <div className="text-[10px] font-bold text-slate-400 mt-0.5">Định dạng CSV nhẹ · Tải siêu tốc</div>
                                    </div>
                                </button>
                                <button onClick={() => doExport(kind, 'by_org')} className="w-full text-left px-4 py-3 hover:bg-indigo-50/60 transition-all flex items-center gap-3">
                                    <div className="w-8 h-8 rounded-xl bg-indigo-100 text-indigo-700 flex items-center justify-center font-black text-[10px] shrink-0">ORG</div>
                                    <div>
                                        <div className="text-[12px] font-black text-slate-800">Tách sheet theo đơn vị (.xlsx)</div>
                                        <div className="text-[10px] font-bold text-slate-400 mt-0.5">Mỗi đơn vị 1 sheet trong 1 file Excel</div>
                                    </div>
                                </button>
                            </div>
                        )}
                    </div>
                );
            };

            const loadReportData = async (pageArg, modeArg) => {
                // pageArg là số -> nhảy thẳng tới trang đó (dùng cho pager). Không phải số (vd event) -> dùng filters.page.
                const _page = (typeof pageArg === 'number' && pageArg > 0) ? pageArg : filters.page;
                if (typeof pageArg === 'number' && pageArg !== filters.page) setFilters(f => ({ ...f, page: pageArg }));
                if (abortRef.current) abortRef.current.abort();
                // BC008 (sổ chi tiết) bắt buộc chọn tài khoản
                if (reportType === 'BC008' && filters.acc_ids.length === 0) {
                    alert('Vui lòng chọn Tài khoản để xem Sổ chi tiết tài khoản.');
                    return;
                }
                // BC013 (tổng hợp công nợ) bắt buộc chọn tài khoản
                if (reportType === 'BC013' && filters.acc_ids.length === 0) {
                    alert('Vui lòng chọn Tài khoản để xem báo cáo tổng hợp công nợ.');
                    return;
                }
                const _ctrl = new AbortController(); abortRef.current = _ctrl;
                setLoading(true);
                // BC007/BC008/BC014 render dạng bảng thường (không ảo hoá) → giới hạn 1000 dòng/trang
                // cho mượt, dùng nút phân trang để xem tiếp (xuất Excel vẫn lấy toàn bộ).
                const rptPageSize = reportType === 'BC015' ? Math.min(filters.page_size, 500)
                    : (reportType === 'BC007' || reportType === 'BC008' || reportType === 'BC014') ? Math.min(filters.page_size, 1000)
                    : filters.page_size;
                const query = new URLSearchParams({ from_date: filters.from_date, to_date: filters.to_date, org_ids: filters.org_ids.join(','), job_ids: filters.job_ids.join(','), page: _page, page_size: rptPageSize });
                try {
                    if (reportType === 'BC006') {
                        const r = await fetch(`/api/trial_balance?${query.toString()}`, { signal: abortRef.current.signal });
                        if (r.status === 401) { setIsLoggedIn(false); return; }
                        const res = await r.json();
                        if (res.status === 'ok') {
